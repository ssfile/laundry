    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatRp(num) {
      const val = Number(num) || 0;
      return "Rp " + val.toLocaleString("id-ID");
    }

    function formatDateId(isoStr) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
    }

    function formatDateTimeId(isoStr) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function sanitizeWaPhone(phone) {
      let digits = String(phone || "").replace(/\D/g, "");
      if (digits.startsWith("0")) digits = "62" + digits.slice(1);
      if (digits && !digits.startsWith("62")) digits = "62" + digits;
      return digits;
    }

    function hexToRgba(hex, alpha) {
      const clean = String(hex || "#0284c7").replace("#", "");
      if (clean.length !== 6) return `rgba(2, 132, 199, ${alpha})`;
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function showToast(message, type = "info") {
      const root = document.getElementById("toast-root");
      if (!root) return;

      const badgeStyle = {
        success: "brand-solid border-transparent",
        error: "bg-rose-600 text-white border-rose-700",
        warning: "bg-amber-600 text-white border-amber-700",
        info: "bg-slate-800 text-white border-slate-900"
      }[type] || "bg-slate-800 text-white border-slate-900";

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-200 ${badgeStyle}`;
      toast.innerHTML = `
        <span>${esc(message)}</span>
        <button type="button" class="opacity-80 hover:opacity-100 text-[11px] font-bold" onclick="this.parentElement.remove()">✕</button>
      `;

      root.appendChild(toast);
      setTimeout(() => {
        if (toast && toast.parentElement) {
          toast.remove();
        }
      }, 3600);
    }

    function parseLocationInput(rawInput, fallbackAddress = "") {
      const trimmed = String(rawInput || "").trim();
      const coordMatch = trimmed.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (coordMatch) {
        const lat = parseFloat(coordMatch[1]);
        const lng = parseFloat(coordMatch[2]);
        if (!isNaN(lat) && !isNaN(lng)) {
          return {
            lat,
            lng,
            mapsUrl: trimmed.startsWith("http") ? trimmed : `https://www.google.com/maps?q=${lat},${lng}`
          };
        }
      }

      if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
        return {
          lat: null,
          lng: null,
          mapsUrl: trimmed
        };
      }

      const queryTarget = trimmed || fallbackAddress;
      return {
        lat: null,
        lng: null,
        mapsUrl: queryTarget ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryTarget)}` : ""
      };
    }

    function buildEmbedMapUrl(lat, lng, address = "", mapsUrl = "") {
      if (typeof lat === "number" && typeof lng === "number" && !isNaN(lat) && !isNaN(lng)) {
        return `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
      }
      const coordFromUrl = String(mapsUrl || "").match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (coordFromUrl) {
        return `https://maps.google.com/maps?q=${coordFromUrl[1]},${coordFromUrl[2]}&z=15&output=embed`;
      }
      const q = encodeURIComponent(address || mapsUrl || "Jakarta, Indonesia");
      return `https://maps.google.com/maps?q=${q}&z=14&output=embed`;
    }

            }

        }

    function normalizeForHash(val) {
      if (Array.isArray(val)) {
        const mapped = val.map(normalizeForHash);
        if (mapped.length > 0 && mapped[0] && typeof mapped[0] === "object" && "id" in mapped[0]) {
          mapped.sort((a, b) => String(a.id || "").localeCompare(String(b.id || "")));
        }
        return mapped;
      }
      if (val && typeof val === "object") {
        const out = {};
        Object.keys(val).sort().forEach(k => {
          if (k === "updatedAt") return;
          out[k] = normalizeForHash(val[k]);
        });
        return out;
      }
      return val;
    }

    function computeCollectionHash(items) {
      try {
        return JSON.stringify(normalizeForHash(items || []));
      } catch (e) {
        return String(Date.now());
      }
    }

    function scheduleCloudRender() {
      if (pendingCloudRenderTimer) clearTimeout(pendingCloudRenderTimer);
      pendingCloudRenderTimer = setTimeout(() => {
        pendingCloudRenderTimer = null;
        const activeTag = document.activeElement?.tagName;
        const isTyping = activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT" || activeTag === "IFRAME";
        const modalRoot = document.getElementById("modal-root");
        const hasOpenModal = modalRoot && modalRoot.innerHTML.trim().length > 0;
        const hasVisibleMapIframe = Boolean(document.querySelector("#app-main-content iframe"));
        if (!isTyping && !hasOpenModal && !hasVisibleMapIframe) {
          renderApp({ isBackgroundSync: true });
        }
      }, 450);
    }

    async function syncRecordToCloud(collectionName, record) {
      saveStateToStorage();
      if (!db || !cloudConnected || !record || !record.id) return;
      try {
        const ref = doc(db, "artifacts", APP_ID, "public", "data", collectionName, String(record.id));
        await setDoc(ref, { ...record, updatedAt: new Date().toISOString() }, { merge: true });
      } catch (err) {

    }

    async function syncPlatformBrandingToCloud() {
      saveStateToStorage();
      if (!db || !cloudConnected) return;
      try {
        const ref = doc(db, "artifacts", APP_ID, "public", "data", "platform_config", "main");
        await setDoc(ref, { ...state.platformBranding, updatedAt: new Date().toISOString() }, { merge: true });
      } catch (err) {

      }
    }

    function attachFirestoreListeners() {
      if (!db || listenersAttached) return;
      listenersAttached = true;

      const configRef = doc(db, "artifacts", APP_ID, "public", "data", "platform_config", "main");
      onSnapshot(configRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          const newHash = computeCollectionHash(data);
          if (lastSnapshotHashes.platform_config !== newHash) {
            lastSnapshotHashes.platform_config = newHash;
            state.platformBranding = {
              ...DEFAULT_PLATFORM_BRANDING,
              ...state.platformBranding,
              ...data,
              superAdminAuth: {
                ...DEFAULT_PLATFORM_BRANDING.superAdminAuth,
                ...(data.superAdminAuth || {})
              },
              plans: {
                ...DEFAULT_PLATFORM_BRANDING.plans,
                ...(data.plans || {})
              }
            };
            saveStateToStorage();
            applyThemeVariables();
            scheduleCloudRender();
          }
        }
      }, (err) => console.warn("platform_config listener:", err));

      const collections = ["businesses", "owners", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"];
      collections.forEach(colName => {
        const colRef = collection(db, "artifacts", APP_ID, "public", "data", colName);
        onSnapshot(colRef, (snapshot) => {
          if (snapshot.empty) return;
          const items = [];
          snapshot.forEach(d => items.push({ id: d.id, ...d.data() }));
          const newHash = computeCollectionHash(items);
          if (lastSnapshotHashes[colName] !== newHash) {
            lastSnapshotHashes[colName] = newHash;
            state[colName] = items;
            if (colName === "owners") autoPurgeExpiredOwners(false);
            saveStateToStorage();
            scheduleCloudRender();
          }
        }, (err) => console.warn(`${colName} listener:`, err));
      });
    }

    async function initFirebase() {
      try {
        if (!firebaseConfig || !firebaseConfig.apiKey) {
          cloudConnected = false;
          return;
        }
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        onAuthStateChanged(auth, (user) => {
          if (user) {
            cloudConnected = true;
            attachFirestoreListeners();
            renderApp({ sidebarOnly: true });
          }
        });
        await signInAnonymously(auth);
      } catch (err) {
        console.warn("Firebase running in offline/local mode:", err);
        cloudConnected = false;
      }
    }

    // --- SUBSCRIPTION & 7-DAY GRACE PERIOD LOGIC ---
    function getOwnerForBusiness(bizId) {
      const biz = state.businesses.find(b => b.id === bizId);
      if (biz && biz.ownerId) {
        const own = state.owners.find(o => o.id === biz.ownerId);
        if (own) return own;
      }
      return state.owners.find(o => o.businessId === bizId) || null;
    }

    function getSubscriptionState(owner) {
      if (!owner || !owner.expiresAt) {
        return { status: "ACTIVE", daysLeft: 999, graceDaysLeft: 7, isFrozen: false, isPurgeable: false };
      }
      const exp = new Date(owner.expiresAt + "T23:59:59");
      const now = new Date();
      const diffMs = exp.getTime() - now.getTime();
      const daysLeft = Math.ceil(diffMs / 86400000);

      if (daysLeft > 0) {
        return {
          status: daysLeft <= 5 ? "EXPIRING_SOON" : "ACTIVE",
          daysLeft,
          graceDaysLeft: 7,
          isFrozen: false,
          isPurgeable: false
        };
      }
      const overdueDays = Math.abs(daysLeft);
      if (overdueDays <= 7) {
        return {
          status: "GRACE_PERIOD",
          daysLeft,
          graceDaysLeft: Math.max(0, 7 - overdueDays),
          isFrozen: true,
          isPurgeable: false
        };
      }
      return {
        status: "PURGE_DUE",
        daysLeft,
        graceDaysLeft: 0,
        isFrozen: true,
        isPurgeable: true
      };
    }

    function assertBusinessOperational() {
      if (!state.currentUser || state.currentUser.role === "SUPER_ADMIN") return true;
      const owner = getOwnerForBusiness(state.activeBusinessId);
      const sub = getSubscriptionState(owner);
      if (sub.isFrozen) {
        showToast("Transaksi dibekukan! Akun sedang dalam Masa Tenggang 7 hari. Hubungi Super Admin untuk perpanjangan.", "error");
        return false;
      }
      return true;
    }

    function purgeOwnerDataCascade(ownerId, silent = false) {
      const owner = state.owners.find(o => o.id === ownerId);
      if (!owner) return;
      const ownedBizIds = state.businesses
        .filter(b => b.ownerId === ownerId || b.id === owner.businessId)
        .map(b => b.id);

      state.owners = state.owners.filter(o => o.id !== ownerId);
      deleteRecordFromCloud("owners", ownerId);

      ownedBizIds.forEach(bId => {
        state.businesses = state.businesses.filter(b => b.id !== bId);
        deleteRecordFromCloud("businesses", bId);

        ["employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
          const toDelete = (state[col] || []).filter(item => item.businessId === bId);
          state[col] = (state[col] || []).filter(item => item.businessId !== bId);
          toDelete.forEach(item => deleteRecordFromCloud(col, item.id));
        });
      });

      if (state.currentUser && state.currentUser.ownerId === ownerId) {
        state.currentUser = null;
      }
      saveStateToStorage();
      if (!silent) {
        showToast(`Akun Owner "${owner.name}" & seluruh data cabangnya telah dihapus.`, "warning");
      }
    }

    function autoPurgeExpiredOwners(notify = true) {
      const toPurge = state.owners.filter(o => getSubscriptionState(o).isPurgeable);
      if (toPurge.length > 0) {
        toPurge.forEach(o => purgeOwnerDataCascade(o.id, true));
        if (notify) {
          showToast(`${toPurge.length} akun Owner yang melewati masa tenggang 7 hari otomatis dibersihkan.`, "info");
        }
      }
    }

    function applyThemeVariables() {
      const pb = state.platformBranding;
      const primary = pb.primaryColor || "#0284c7";
      const bgCanvas = pb.bgCanvas || "#f4f7fb";
      const bgSurface = pb.bgSurface || "#ffffff";
      const textPrimary = pb.textPrimary || "#0f172a";

      const themeSig = [pb.appName, primary, bgCanvas, bgSurface, textPrimary, pb.logoUrl, pb.faviconUrl].join("|");
      if (lastThemeSignature !== themeSig) {
        lastThemeSignature = themeSig;
        const root = document.documentElement.style;
        root.setProperty("--brand-primary", primary);
        root.setProperty("--brand-soft", hexToRgba(primary, 0.10));
        root.setProperty("--brand-border", hexToRgba(primary, 0.26));
        root.setProperty("--bg-canvas", bgCanvas);
        root.setProperty("--bg-surface", bgSurface);
        root.setProperty("--text-primary", textPrimary);
        document.title = `${pb.appName} — ${pb.tagline}`;
        if (pb.faviconUrl) {
          const fav = document.getElementById("dynamic-favicon");
          if (fav) fav.href = pb.faviconUrl;
        }
      }

      const manifestSig = `${pb.appName}|${pb.tagline}|${primary}`;
      if (lastManifestSignature !== manifestSig) {
        lastManifestSignature = manifestSig;
        try {
          const manifestObj = {
            name: pb.appName,
            short_name: pb.appName,
            description: pb.tagline,
            start_url: window.location.href.split("#")[0],
            display: "standalone",
            background_color: bgCanvas,
            theme_color: primary,
            icons: [
              {
                src: pb.faviconUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='48' fill='%230284c7'/%3E%3Ccircle cx='96' cy='102' r='48' fill='none' stroke='white' stroke-width='12'/%3E%3C/svg%3E",
                sizes: "192x192",
                type: "image/svg+xml"
              }
            ]
          };
          const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
          const manifestLink = document.getElementById("dynamic-manifest");
          if (manifestLink) {
            if (manifestLink.href && manifestLink.href.startsWith("blob:")) {
              URL.revokeObjectURL(manifestLink.href);
            }
            manifestLink.href = URL.createObjectURL(blob);
          }
        } catch (e) {
          console.warn("Manifest update skipped:", e);
        }
      }
    }

    // --- AUTHENTICATION ---
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;

      const sa = state.platformBranding.superAdminAuth;
      if (email === String(sa.email).toLowerCase() && password === sa.password) {
        state.currentUser = { id: sa.id, name: sa.name, email: sa.email, role: "SUPER_ADMIN" };
        state.activeTab = "dashboard";
        saveStateToStorage();
        showToast("Selamat datang, Super Admin!", "success");
        renderApp({ forceShellRebuild: true });
        return;
      }

      const owner = state.owners.find(o => String(o.email).toLowerCase() === email && o.password === password);
      if (owner) {
        const sub = getSubscriptionState(owner);
        if (sub.isPurgeable) {
          purgeOwnerDataCascade(owner.id, true);
          showToast("Akun Anda telah melewati masa tenggang 7 hari dan dihapus otomatis.", "error");
          return;
        }
        state.currentUser = {
          id: owner.id,
          ownerId: owner.id,
          businessId: owner.businessId,
          name: owner.name,
          email: owner.email,
          role: "OWNER"
        };
        const ownedBiz = getAccessibleBusinesses();
        if (ownedBiz.length > 0) state.activeBusinessId = ownedBiz[0].id;
        state.activeTab = "dashboard";
        saveStateToStorage();
        showToast(`Halo, ${owner.name}!`, "success");
        renderApp({ forceShellRebuild: true });
        return;
      }

      const emp = state.employees.find(em => String(em.email).toLowerCase() === email && em.password === password);
      if (emp) {
        if (emp.active === false) {
          showToast("Akun karyawan Anda sedang dinonaktifkan oleh Owner.", "error");
          return;
        }
        const ownerForEmp = getOwnerForBusiness(emp.businessId);
        const sub = getSubscriptionState(ownerForEmp);
        if (sub.isPurgeable) {
          showToast("Masa aktif outlet ini telah berakhir dan melewati masa tenggang.", "error");
          return;
        }
        state.currentUser = {
          id: emp.id,
          businessId: emp.businessId,
          name: emp.name,
          email: emp.email,
          role: emp.role
        };
        state.activeBusinessId = emp.businessId;
        state.activeTab = emp.role === "KASIR" ? "pos" : "dashboard";
        saveStateToStorage();
        showToast(`Login berhasil sebagai ${emp.name} (${emp.role})`, "success");
        renderApp({ forceShellRebuild: true });
        return;
      }

      showToast("Email/Username atau Password tidak sesuai.", "error");
    }

    function switchTab(tabId) {
      if (state.activeTab === "scanner" && tabId !== "scanner") {
        stopBarcodeScanner();
      }
      state.activeTab = tabId;
      state.mobileSidebarOpen = false;
      saveStateToStorage();
      renderApp();
    }

    function toggleMobileSidebar(forceState) {
      state.mobileSidebarOpen = typeof forceState === "boolean" ? forceState : !state.mobileSidebarOpen;
      updateMobileDrawerOnly();
    }

    function updateMobileDrawerOnly() {
      const slot = document.getElementById("mobile-sidebar-slot");
      if (!slot) return;
      const backdrop = slot.querySelector("[data-drawer-backdrop]");
      const panel = slot.querySelector("[data-drawer-panel]");
      if (backdrop && panel) {
        if (state.mobileSidebarOpen) {
          slot.classList.remove("pointer-events-none");
          backdrop.classList.remove("opacity-0", "pointer-events-none");
          backdrop.classList.add("opacity-100");
          panel.classList.remove("-translate-x-full");
          panel.classList.add("translate-x-0");
        } else {
          slot.classList.add("pointer-events-none");
          backdrop.classList.add("opacity-0", "pointer-events-none");
          backdrop.classList.remove("opacity-100");
          panel.classList.add("-translate-x-full");
          panel.classList.remove("translate-x-0");
        }
      }
    }

    function saveOwnerAccount(e, ownerId) {
      e.preventDefault();
      const name = document.getElementById("own-name").value.trim();
      const phone = document.getElementById("own-phone").value.trim();
      const email = document.getElementById("own-email").value.trim().toLowerCase();
      const password = document.getElementById("own-pass").value;
      const planId = document.getElementById("own-plan").value;
      const expiresAt = document.getElementById("own-expires").value;
      const planObj = state.platformBranding.plans[planId] || { id: planId, maxBranches: 3 };

      if (ownerId) {
        const idx = state.owners.findIndex(o => o.id === ownerId);
        if (idx !== -1) {
          state.owners[idx] = {
            ...state.owners[idx],
            name,
            phone,
            email,
            password,
            plan: planId,
            maxBranches: planObj.maxBranches,
            expiresAt
          };
          syncRecordToCloud("owners", state.owners[idx]);

          state.businesses.forEach((b, bIdx) => {
            if (b.ownerId === ownerId || b.id === state.owners[idx].businessId) {
              state.businesses[bIdx] = { ...b, plan: planId };
              syncRecordToCloud("businesses", state.businesses[bIdx]);
            }
          });
        }
        showToast("Paket & data Owner berhasil diperbarui.", "success");
      } else {
        const newOwnerId = "own_" + Date.now();
        const newBizId = "biz_" + Date.now();
        const bizName = document.getElementById("own-biz-name").value.trim();

        const newBiz = {
          id: newBizId,
          ownerId: newOwnerId,
          name: bizName,
          plan: planId,
          status: "ACTIVE",
          phone,
          address: "",
          logoUrl: "",
          qrisUrl: "",
          bankName: "",
          bankAccount: "",
          bankHolder: bizName,
          receiptFooter: "Terima kasih atas kepercayaan Anda!",
          invoicePrefix: "INV"
        };
        const newOwner = {
          id: newOwnerId,
          businessId: newBizId,
          name,
          email,
          password,
          phone,
          role: "OWNER",
          plan: planId,
          maxBranches: planObj.maxBranches,
          status: "ACTIVE",
          expiresAt
        };
        state.businesses.push(newBiz);
        state.owners.push(newOwner);
        syncRecordToCloud("businesses", newBiz);
        syncRecordToCloud("owners", newOwner);
        showToast("Owner & Outlet baru berhasil didaftarkan.", "success");
      }

      closeModal();
      renderApp();
    }

                  <label class="block text-slate-600 font-medium mb-1">Nominal DP Dibayar (Rp)</label>
                  <input type="number" min="0" value="${draft.dpAmount}" oninput="state.posDraft.dpAmount=Number(this.value)||0" class="w-full px-3 py-2 rounded-xl" />
                </div>
              ` : ""}

              <div class="text-xs">
                <label class="block text-slate-600 font-medium mb-1">Catatan Cucian</label>
                <input value="${esc(draft.notes)}" oninput="state.posDraft.notes=this.value" placeholder="Parfum, pisah luntur, dll..." class="w-full px-3 py-2 rounded-xl" />
              </div>

              <div id="pos-summary-box" class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5 text-xs">
                <div class="flex justify-between text-slate-500"><span>Subtotal Layanan</span><span>${formatRp(subtotal)}</span></div>
                <div class="flex justify-between brand-text"><span>Diskon Promo</span><span>-${formatRp(discount)}</span></div>
                <div class="flex justify-between text-slate-500"><span>Biaya Antar-Jemput</span><span>+${formatRp(delivery)}</span></div>
                <div class="flex justify-between text-base font-extrabold brand-text border-t border-slate-200 pt-2 mt-1">
                  <span>Total Biaya</span>
                  <span>${formatRp(grandTotal)}</span>
                </div>
              </div>

              <button type="button" onclick="submitPosOrder()" class="w-full brand-btn py-3 rounded-xl text-sm font-bold">
                Simpan Order & Cetak Nota
              </button>

          </div>
        </div>
      `;
    }

    function selectPosCustomer(custId) {
      if (!custId) {
        state.posDraft.customerId = "";
        return;
      }
      const c = state.customers.find(x => x.id === custId);
      if (c) {
        state.posDraft.customerId = c.id;
        state.posDraft.customerName = c.name;
        state.posDraft.customerPhone = c.phone;
        state.posDraft.customerAddress = c.address || "";
        state.posDraft.customerMapsUrl = c.mapsUrl || "";
        renderApp();
      }
    }

    function addServiceToPosCart(serviceId) {
      const srv = state.services.find(s => s.id === serviceId);
      if (!srv) return;
      const existingIdx = state.posDraft.items.findIndex(i => i.serviceId === serviceId);
      if (existingIdx !== -1) {
        state.posDraft.items[existingIdx].qty = Number((Number(state.posDraft.items[existingIdx].qty) + 1).toFixed(2));
      } else {
        state.posDraft.items.push({
          serviceId: srv.id,
          serviceName: srv.name,
          unit: srv.unit,
          qty: 1,
          price: srv.price,
          estHours: srv.estHours || 24
        });
      }
      renderApp();
    }

    function updatePosCartQty(idx, rawVal) {
      const val = Math.max(0.1, parseFloat(rawVal) || 0);
      if (state.posDraft.items[idx]) {
        state.posDraft.items[idx].qty = val;
        updatePosTotalsOnly();
      }
    }

    function removePosCartItem(idx) {
      state.posDraft.items.splice(idx, 1);
      renderApp();
    }

    function updatePosTotalsOnly() {
      const draft = state.posDraft;
      const subtotal = draft.items.reduce((sum, it) => sum + Math.round((Number(it.qty) || 0) * (Number(it.price) || 0)), 0);
      const discount = Math.max(0, Number(draft.discountAmount) || 0);
      const delivery = Math.max(0, Number(draft.deliveryFee) || 0);
      const grandTotal = Math.max(0, subtotal - discount + delivery);
      const box = document.getElementById("pos-summary-box");
      if (box) {
        box.innerHTML = `
          <div class="flex justify-between text-slate-500"><span>Subtotal Layanan</span><span>${formatRp(subtotal)}</span></div>
          <div class="flex justify-between brand-text"><span>Diskon Promo</span><span>-${formatRp(discount)}</span></div>
          <div class="flex justify-between text-slate-500"><span>Biaya Antar-Jemput</span><span>+${formatRp(delivery)}</span></div>
          <div class="flex justify-between text-base font-extrabold brand-text border-t border-slate-200 pt-2 mt-1">
            <span>Total Biaya</span>
            <span>${formatRp(grandTotal)}</span>
          </div>
        `;
      }
    }

    function submitPosOrder() {
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const draft = state.posDraft;

      if (!draft.customerName.trim() || !draft.customerPhone.trim()) {
        showToast("Nama dan Nomor WhatsApp pelanggan wajib diisi.", "error");
        return;
      }
      if (draft.items.length === 0) {
        showToast("Pilih minimal 1 layanan laundry.", "error");
        return;
      }

      const loc = parseLocationInput(draft.customerMapsUrl, draft.customerAddress);
      let custId = draft.customerId;
      if (!custId) {
        custId = "cust_" + Date.now();
        const newCust = {
          id: custId,
          businessId: biz.id,
          name: draft.customerName.trim(),
          phone: sanitizeWaPhone(draft.customerPhone),
          address: draft.customerAddress.trim(),
          lat: loc.lat,
          lng: loc.lng,
          mapsUrl: loc.mapsUrl
        };
        state.customers.unshift(newCust);
        syncRecordToCloud("customers", newCust);
      }

      const items = draft.items.map(it => ({
        serviceId: it.serviceId,
        serviceName: it.serviceName,
        unit: it.unit,
        qty: Number(it.qty),
        price: Number(it.price),
        subtotal: Math.round(Number(it.qty) * Number(it.price))
      }));

      const subtotalAmount = items.reduce((s, i) => s + i.subtotal, 0);
      const discountAmount = Math.max(0, Number(draft.discountAmount) || 0);
      const deliveryFee = Math.max(0, Number(draft.deliveryFee) || 0);
      const totalAmount = Math.max(0, subtotalAmount - discountAmount + deliveryFee);

      let paidAmount = 0;
      if (draft.paymentType === "FULL") paidAmount = totalAmount;
      else if (draft.paymentType === "DP") paidAmount = Math.min(totalAmount, Math.max(0, Number(draft.dpAmount) || 0));

      const maxEstHours = Math.max(...draft.items.map(i => Number(i.estHours) || 24));
      const dueDateObj = new Date(Date.now() + maxEstHours * 3600000);
      const prefix = biz.invoicePrefix || "INV";
      const dStr = new Date().toISOString().slice(2, 10).replace(/-/g, "");
      const invoiceNo = `${prefix}-${dStr}-${Math.floor(100 + Math.random() * 900)}`;
      const orderId = "ord_" + Date.now();

      const newOrder = {
        id: orderId,
        businessId: biz.id,
        invoiceNo,
        customerId: custId,
        customerName: draft.customerName.trim(),
        customerPhone: sanitizeWaPhone(draft.customerPhone),
        customerAddress: draft.customerAddress.trim(),
        customerLat: loc.lat,
        customerLng: loc.lng,
        customerMapsUrl: loc.mapsUrl,
        items,
        subtotalAmount,
        discountAmount,
        deliveryFee,
        totalAmount,
        paidAmount,
        paymentStatus: paidAmount >= totalAmount ? "PAID" : (paidAmount > 0 ? "PARTIAL" : "UNPAID"),
        paymentMethod: draft.paymentMethod,
        status: "RECEIVED",
        notes: draft.notes.trim(),
        createdAt: new Date().toISOString(),
        dueDate: dueDateObj.toISOString().slice(0, 10),
        auditLog: [
          {
            time: new Date().toISOString(),
            actor: `${state.currentUser.name} (${state.currentUser.role})`,
            action: `Order dibuat (${paidAmount >= totalAmount ? "Lunas" : "Tagihan " + formatRp(totalAmount)})`
          }
        ]
      };

      state.orders.unshift(newOrder);
      syncRecordToCloud("orders", newOrder);

      if (paidAmount > 0) {
        const payRec = {
          id: "pay_" + Date.now(),
          businessId: biz.id,
          orderId,
          invoiceNo,
          customerName: newOrder.customerName,
          amount: paidAmount,
          method: draft.paymentMethod,
          date: todayIso(),
          recordedBy: state.currentUser.name
        };
        const cashRec = {
          id: "cash_" + Date.now(),
          businessId: biz.id,
          type: "IN",
          category: "Pendapatan Order",
          description: `Pembayaran ${invoiceNo} (${newOrder.customerName})`,
          amount: paidAmount,
          date: todayIso()
        };
        state.payments.unshift(payRec);
        state.cashTransactions.unshift(cashRec);
        syncRecordToCloud("payments", payRec);
        syncRecordToCloud("cashTransactions", cashRec);
      }

      state.posDraft = {
        customerId: "",
        customerName: "",
        customerPhone: "",
        customerAddress: "",
        customerMapsUrl: "",
        items: [],
        discountAmount: 0,
        deliveryFee: 0,
        paymentMethod: "CASH",
        paymentType: "FULL",
        dpAmount: 0,
        notes: ""
      };

      showToast(`Order ${invoiceNo} berhasil disimpan!`, "success");
      renderApp();
      openReceiptModal(orderId);
    }

    // 4. ORDERS MANAGEMENT

          <div>
            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">Daftar Order Laundry</h1>
            <p class="text-xs text-slate-500">Ringkasan order, update status cepat, & tombol detail lengkap.</p>
          </div>
          <input value="${esc(state.uiFilters.orderSearch)}" oninput="state.uiFilters.orderSearch=this.value; renderApp();" placeholder="Cari invoice / nama..." class="px-3.5 py-2 rounded-xl text-xs w-full sm:w-64" />
        </div>

        <div class="flex flex-wrap gap-1.5">
          ${["ALL", ...STATUS_FLOW].map(st => {
            const label = st === "ALL" ? "Semua" : ORDER_STATUS_META[st].label;
            const active = filterSt === st;
            return `<button type="button" onclick="state.uiFilters.orderStatus='${st}'; renderApp();" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${active ? "brand-btn" : "bg-white border border-slate-200 text-slate-600 hover:text-slate-900"}">${label}</button>`;
          }).join("")}
        </div>

        <div class="space-y-2.5">
          ${orders.length === 0 ? `<div class="surface-card rounded-2xl p-8 text-center text-xs text-slate-400">Tidak ada order yang cocok dengan filter.</div>` : orders.map(o => {
            const st = ORDER_STATUS_META[o.status] || ORDER_STATUS_META.RECEIVED;

            const waReadyUrl = buildWaReadyLink(o, biz);
            return `
              <div class="surface-card rounded-2xl p-4 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">

                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${st.badge}">${st.label}</span>
                    </div>
                    <p class="text-sm font-bold text-slate-900 truncate mt-1">${esc(o.customerName)}</p>
                    <p class="text-[11px] text-slate-500 truncate">${(o.items || []).length} Layanan • Est. ${formatDateId(o.dueDate)}</p>
                  </div>
                  <div class="text-right shrink-0">
                    <p class="text-sm font-extrabold text-slate-900">${formatRp(o.totalAmount)}</p>
                    <span class="inline-block mt-0.5 px-2 py-0.5 rounded-full text-[10px] font-bold ${bal === 0 ? "brand-soft-bg border" : "bg-amber-50 text-amber-800"}">
                      ${bal === 0 ? "LUNAS" : "Sisa " + formatRp(bal)}
                    </span>
                  </div>
                </div>

                <div class="grid grid-cols-2 sm:flex sm:items-center sm:justify-between gap-2 pt-2.5 border-t border-slate-100">
                  <div class="flex items-center gap-1.5 col-span-2 sm:col-span-1">
                    <button type="button" onclick="openOrderDetailModal('${esc(o.id)}')" class="flex-1 sm:flex-none px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold">Detail</button>
                    <button type="button" onclick="openReceiptModal('${esc(o.id)}')" class="flex-1 sm:flex-none px-3 py-1.5 rounded-xl brand-soft-bg border text-xs font-semibold">Nota</button>
                    ${o.status === "READY" ? `
                      <a href="${waReadyUrl}" target="_blank" rel="noopener" class="flex-1 sm:flex-none px-3 py-1.5 rounded-xl brand-btn text-xs font-bold text-center">
                        WA Siap
                      </a>
                    ` : ""}
                  </div>
                  <select onchange="updateOrderStatus('${esc(o.id)}', this.value)" class="col-span-2 sm:col-span-1 px-3 py-1.5 rounded-xl text-xs font-semibold">
                    ${STATUS_FLOW.map(s => `<option value="${s}" ${o.status === s ? "selected" : ""}>Status: ${ORDER_STATUS_META[s].label}</option>`).join("")}
                  </select>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function buildWaReadyLink(order, biz) {
      const phone = sanitizeWaPhone(order.customerPhone);
      const bal = Math.max(0, (Number(order.totalAmount) || 0) - (Number(order.paidAmount) || 0));
      const trackUrl = `${window.location.href.split("#")[0]}#/track/${encodeURIComponent(order.invoiceNo)}`;
      const msg = [
        `Halo *${order.customerName}*,`,
        `Cucian Anda di *${biz?.name || state.platformBranding.appName}* dengan No. Invoice *${order.invoiceNo}* sudah *SIAP DIAMBIL* ✅`,
        ``,
        `Total Tagihan: *${formatRp(order.totalAmount)}*`,
        `Status Bayar: *${bal === 0 ? "LUNAS" : "Sisa " + formatRp(bal)}*`,
        `Cek Nota & Pembayaran: ${trackUrl}`,
        ``,
        `Terima kasih!`
      ].join("\n");
      return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    }

    function updateOrderStatus(orderId, newStatus) {
      if (!assertBusinessOperational()) {
        renderApp();
        return;
      }
      const idx = state.orders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const order = state.orders[idx];
      const logEntry = {
        time: new Date().toISOString(),
        actor: `${state.currentUser.name} (${state.currentUser.role})`,
        action: `Status diubah menjadi ${ORDER_STATUS_META[newStatus]?.label || newStatus}`
      };
      state.orders[idx] = {
        ...order,
        status: newStatus,
        auditLog: [...(order.auditLog || []), logEntry]
      };
      syncRecordToCloud("orders", state.orders[idx]);
      showToast(`Status ${order.invoiceNo} diperbarui ke ${ORDER_STATUS_META[newStatus]?.label}.`, "success");
      renderApp();
    }

    function settleOrderBalance(orderId, method = "CASH") {
      if (!assertBusinessOperational()) return;
      const idx = state.orders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const order = state.orders[idx];
      const bal = Math.max(0, order.totalAmount - order.paidAmount);
      if (bal <= 0) return;

      const logEntry = {
        time: new Date().toISOString(),
        actor: `${state.currentUser.name} (${state.currentUser.role})`,
        action: `Pelunasan sisa tagihan ${formatRp(bal)} via ${method}`
      };

      state.orders[idx] = {
        ...order,
        paidAmount: order.totalAmount,
        paymentStatus: "PAID",
        paymentMethod: method,
        auditLog: [...(order.auditLog || []), logEntry]
      };
      syncRecordToCloud("orders", state.orders[idx]);

      const payRec = {
        id: "pay_" + Date.now(),
        businessId: order.businessId,
        orderId: order.id,
        invoiceNo: order.invoiceNo,
        customerName: order.customerName,
        amount: bal,
        method,
        date: todayIso(),
        recordedBy: state.currentUser.name
      };
      const cashRec = {
        id: "cash_" + Date.now(),
        businessId: order.businessId,
        type: "IN",
        category: "Pelunasan Order",
        description: `Pelunasan ${order.invoiceNo} (${order.customerName})`,
        amount: bal,
        date: todayIso()
      };
      state.payments.unshift(payRec);
      state.cashTransactions.unshift(cashRec);
      syncRecordToCloud("payments", payRec);
      syncRecordToCloud("cashTransactions", cashRec);

      showToast(`Pelunasan ${formatRp(bal)} berhasil dicatat!`, "success");
      closeModal();
      renderApp();
    }

    // 5. RECEIPT MODAL

      openModal(`

    function handleManualBarcodeSubmit(e) {
      e.preventDefault();
      const code = document.getElementById("manual-barcode-input").value.trim();
      onBarcodeDecoded(code);
    }

    function onBarcodeDecoded(decodedText) {
      const clean = String(decodedText || "").trim().toLowerCase();
      const order = state.orders.find(o => o.invoiceNo.toLowerCase() === clean || o.id.toLowerCase() === clean);
      if (order) {
        stopBarcodeScanner();
        showToast(`Order ${order.invoiceNo} ditemukan!`, "success");
        openOrderDetailModal(order.id);
      } else {
        showToast(`Invoice "${decodedText}" tidak ditemukan.`, "error");
      }
    }

    async function startBarcodeScanner() {
      const container = document.getElementById("barcode-reader");
      if (!container || !window.Html5Qrcode) {
        showToast("Library pemindai kamera belum siap.", "warning");
        return;
      }
      try {
        await stopBarcodeScanner();
        html5QrInstance = new Html5Qrcode("barcode-reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.CODABAR
          ]
        });
        await html5QrInstance.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 280, height: 110 } },
          (decoded) => onBarcodeDecoded(decoded),
          () => {}
        );
      } catch (err) {
        showToast("Gagal mengakses kamera. Pastikan izin kamera aktif.", "error");
      }
    }

    async function stopBarcodeScanner() {
      if (html5QrInstance) {
        try {
          await html5QrInstance.stop();
          await html5QrInstance.clear();
        } catch (e) {}
        html5QrInstance = null;
      }
    }

      if (!navigator.geolocation) {

        (pos) => {
          const inp = document.getElementById("cust-maps");
          if (inp) inp.value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
          showToast("Koordinat GPS berhasil diambil!", "success");

        () => showToast("Gagal mengambil lokasi GPS.", "error")

    function saveCustomer(e, custId) {
      e.preventDefault();
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const name = document.getElementById("cust-name").value.trim();
      const phone = sanitizeWaPhone(document.getElementById("cust-phone").value);
      const address = document.getElementById("cust-addr").value.trim();
      const rawMaps = document.getElementById("cust-maps").value.trim();
      const loc = parseLocationInput(rawMaps, address);

      if (custId) {
        const idx = state.customers.findIndex(c => c.id === custId);
        if (idx !== -1) {
          state.customers[idx] = { ...state.customers[idx], name, phone, address, lat: loc.lat, lng: loc.lng, mapsUrl: loc.mapsUrl };
          syncRecordToCloud("customers", state.customers[idx]);
        }
      } else {
        const newCust = { id: "cust_" + Date.now(), businessId: biz.id, name, phone, address, lat: loc.lat, lng: loc.lng, mapsUrl: loc.mapsUrl };
        state.customers.unshift(newCust);
        syncRecordToCloud("customers", newCust);
      }
      showToast("Data pelanggan & lokasi tersimpan.", "success");
      closeModal();
      renderApp();
    }

    function deleteCustomer(custId) {
      if (!assertBusinessOperational()) return;
      state.customers = state.customers.filter(c => c.id !== custId);
      deleteRecordFromCloud("customers", custId);
      showToast("Pelanggan dihapus.", "info");

    function saveService(e, serviceId) {
      e.preventDefault();
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const name = document.getElementById("srv-name").value.trim();
      const category = document.getElementById("srv-cat").value.trim() || "Umum";
      const unit = document.getElementById("srv-unit").value;
      const price = Math.max(0, Number(document.getElementById("srv-price").value) || 0);
      const estHours = Math.max(1, Number(document.getElementById("srv-hours").value) || 24);

      if (serviceId) {
        const idx = state.services.findIndex(s => s.id === serviceId);
        if (idx !== -1) {
          state.services[idx] = { ...state.services[idx], name, category, unit, price, estHours };
          syncRecordToCloud("services", state.services[idx]);
        }
        showToast("Layanan berhasil diperbarui.", "success");
      } else {
        const newSrv = { id: "srv_" + Date.now(), businessId: biz.id, name, category, unit, price, estHours };
        state.services.push(newSrv);
        syncRecordToCloud("services", newSrv);
        showToast("Layanan baru berhasil ditambahkan.", "success");
      }
      closeModal();
      renderApp();
    }

      if (!assertBusinessOperational()) return;
      state.services = state.services.filter(s => s.id !== serviceId);
      deleteRecordFromCloud("services", serviceId);

      renderApp();

    function adjustInventoryStock(itemId, delta) {
      if (!assertBusinessOperational()) return;
      const idx = state.inventory.findIndex(i => i.id === itemId);
      if (idx === -1) return;
      state.inventory[idx].stock = Math.max(0, (Number(state.inventory[idx].stock) || 0) + delta);
      syncRecordToCloud("inventory", state.inventory[idx]);
      renderApp();
    }

      if (!assertBusinessOperational()) return;
      state.inventory = state.inventory.filter(i => i.id !== itemId);

    // 10. FINANCIAL REPORTS
    function setReportPeriodPreset(preset) {
      state.uiFilters.reportPreset = preset;
      if (preset === "MONTH") {
        state.uiFilters.reportStartDate = firstDayOfMonthIso();
        state.uiFilters.reportEndDate = todayIso();
      } else if (preset === "YEAR") {
        state.uiFilters.reportStartDate = firstDayOfYearIso();
        state.uiFilters.reportEndDate = todayIso();
      } else if (preset === "ALL") {
        state.uiFilters.reportStartDate = "2000-01-01";
        state.uiFilters.reportEndDate = "2099-12-31";
      }
      renderApp();
    }

    function getFilteredFinancialData(bId) {
      const start = state.uiFilters.reportStartDate || "2000-01-01";
      const end = state.uiFilters.reportEndDate || "2099-12-31";

      const txns = state.cashTransactions.filter(c => c.businessId === bId && c.date >= start && c.date <= end);
      const totalIn = txns.filter(t => t.type === "IN").reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const totalOut = txns.filter(t => t.type === "OUT").reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const netProfit = totalIn - totalOut;

      const filteredOrders = state.orders.filter(o => {
        if (o.businessId !== bId) return false;
        const d = String(o.createdAt || "").slice(0, 10);
        return d >= start && d <= end;
      });

      const serviceUsageMap = {};
      filteredOrders.forEach(o => {
        (o.items || []).forEach(it => {
          const key = it.serviceName || "Layanan";
          if (!serviceUsageMap[key]) {
            serviceUsageMap[key] = { name: key, count: 0, revenue: 0 };
          }
          serviceUsageMap[key].count += 1;
          serviceUsageMap[key].revenue += Number(it.subtotal) || 0;
        });
      });
      const serviceStats = Object.values(serviceUsageMap).sort((a, b) => b.revenue - a.revenue);

      return { start, end, txns, totalIn, totalOut, netProfit, serviceStats };
    }

    function renderReportsView() {
      const biz = getActiveBusiness();
      const bId = biz?.id;
      const preset = state.uiFilters.reportPreset;
      const primary = state.platformBranding.primaryColor || "#0284c7";
      const { start, end, txns, totalIn, totalOut, netProfit, serviceStats } = getFilteredFinancialData(bId);

      const maxBar = Math.max(totalIn, totalOut, Math.abs(netProfit), 1);
      const inPct = Math.max(6, Math.round((totalIn / maxBar) * 100));
      const outPct = Math.max(6, Math.round((totalOut / maxBar) * 100));
      const profitPct = Math.max(6, Math.round((Math.max(0, netProfit) / maxBar) * 100));

      const donutShades = [
        hexToRgba(primary, 1.0),
        hexToRgba(primary, 0.78),
        hexToRgba(primary, 0.58),
        hexToRgba(primary, 0.40),
        hexToRgba(primary, 0.25),
        hexToRgba(primary, 0.14)
      ];
      const totalSrvRev = serviceStats.reduce((s, x) => s + x.revenue, 0);
      let cumulativeDeg = 0;
      const gradientStops = serviceStats.map((s, idx) => {
        const deg = totalSrvRev > 0 ? (s.revenue / totalSrvRev) * 360 : 0;
        const startDeg = cumulativeDeg;
        cumulativeDeg += deg;
        const color = donutShades[idx % donutShades.length];
        return `${color} ${startDeg.toFixed(1)}deg ${cumulativeDeg.toFixed(1)}deg`;
      });
      const conicGradient = gradientStops.length > 0 ? `conic-gradient(${gradientStops.join(", ")})` : "conic-gradient(#e2e8f0 0deg 360deg)";

      return `

              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
              Export CSV
            </button>
          </div>
        </div>

        <div class="surface-card rounded-2xl p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
          <div class="grid grid-cols-3 sm:flex gap-1.5">
            <button type="button" onclick="setReportPeriodPreset('MONTH')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${preset === "MONTH" ? "brand-btn" : "bg-slate-100 text-slate-600 hover:text-slate-900"}">Bulan Ini</button>
            <button type="button" onclick="setReportPeriodPreset('YEAR')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${preset === "YEAR" ? "brand-btn" : "bg-slate-100 text-slate-600 hover:text-slate-900"}">Tahun Ini</button>
            <button type="button" onclick="setReportPeriodPreset('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${preset === "ALL" ? "brand-btn" : "bg-slate-100 text-slate-600 hover:text-slate-900"}">All Time</button>
          </div>
          <div class="grid grid-cols-2 sm:flex items-center gap-2 text-xs">
            <input type="date" value="${preset === "ALL" ? "" : esc(start)}" onchange="state.uiFilters.reportPreset='CUSTOM'; state.uiFilters.reportStartDate=this.value; renderApp();" class="px-3 py-1.5 rounded-xl w-full" />
            <input type="date" value="${preset === "ALL" ? "" : esc(end)}" onchange="state.uiFilters.reportPreset='CUSTOM'; state.uiFilters.reportEndDate=this.value; renderApp();" class="px-3 py-1.5 rounded-xl w-full" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="stat-card rounded-2xl p-4">
            <p class="text-xs text-slate-500">Total Pemasukan</p>
            <p class="text-lg sm:text-xl font-extrabold brand-text mt-1">${formatRp(totalIn)}</p>
          </div>
          <div class="stat-card rounded-2xl p-4">
            <p class="text-xs text-slate-500">Total Pengeluaran</p>
            <p class="text-lg sm:text-xl font-extrabold text-slate-700 mt-1">${formatRp(totalOut)}</p>
          </div>
          <div class="stat-card rounded-2xl p-4">
            <p class="text-xs text-slate-500">Laba Bersih</p>
            <p class="text-lg sm:text-xl font-extrabold brand-text mt-1">${formatRp(netProfit)}</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="surface-card rounded-2xl p-4 sm:p-5 space-y-4">
            <div>
              <h2 class="text-sm font-bold text-slate-900">Grafik Balok Arus Kas & Laba Bersih</h2>
              <p class="text-[11px] text-slate-500">Perbandingan Pemasukan, Pengeluaran, dan Laba Bersih</p>
            </div>
            <div class="h-52 flex items-end justify-around gap-3 pt-6 px-2 bg-slate-50 rounded-2xl border border-slate-200/70">
              <div class="flex flex-col items-center gap-1.5 flex-1 h-full justify-end min-w-0">
                <span class="text-[10px] font-bold brand-text truncate max-w-full">${formatRp(totalIn)}</span>
                <div style="height:${inPct}%" class="w-full max-w-[52px] rounded-t-xl brand-solid chart-bar-anim"></div>
                <span class="text-[11px] font-semibold text-slate-600 pb-2">Masuk</span>
              </div>
              <div class="flex flex-col items-center gap-1.5 flex-1 h-full justify-end min-w-0">
                <span class="text-[10px] font-bold text-slate-600 truncate max-w-full">${formatRp(totalOut)}</span>
                <div style="height:${outPct}%" class="w-full max-w-[52px] rounded-t-xl bg-slate-400 chart-bar-anim"></div>
                <span class="text-[11px] font-semibold text-slate-600 pb-2">Keluar</span>

              <div class="flex flex-col items-center gap-1.5 flex-1 h-full justify-end min-w-0">
                <span class="text-[10px] font-bold brand-text truncate max-w-full">${formatRp(netProfit)}</span>
                <div style="height:${profitPct}%; opacity:0.75;" class="w-full max-w-[52px] rounded-t-xl brand-solid chart-bar-anim"></div>
                <span class="text-[11px] font-semibold text-slate-600 pb-2">Laba</span>
              </div>
            </div>
          </div>

          <div class="surface-card rounded-2xl p-4 sm:p-5 space-y-4">

                <div class="w-[72px] h-[72px] rounded-full bg-white flex flex-col items-center justify-center text-center shadow-xs">
                  <span class="text-[9px] text-slate-400">Transaksi</span>

                </div>

      const rows = [
        ["LAPORAN KEUANGAN & ANALISIS LAYANAN", biz?.name || ""],

        [],

        ...serviceStats.map(s => [s.name, s.count, s.revenue]),

        ...txns.map(t => [t.date, t.category, t.description, t.type === "IN" ? "MASUK" : "KELUAR", t.amount])

      const csvContent = rows.map(r => r.map(cell => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");

    function downloadOwnerBackup(ownerId) {
      const owner = state.owners.find(o => o.id === ownerId);
      const ownedBusinesses = state.businesses.filter(b => b.ownerId === ownerId || (owner && b.id === owner.businessId));
      const bizIds = new Set(ownedBusinesses.map(b => b.id));

      const payload = {
        backupType: "OWNER_SCOPE",
        exportedAt: new Date().toISOString(),
        ownerId,
        owner,
        businesses: ownedBusinesses,
        employees: state.employees.filter(x => bizIds.has(x.businessId)),
        services: state.services.filter(x => bizIds.has(x.businessId)),
        customers: state.customers.filter(x => bizIds.has(x.businessId)),
        orders: state.orders.filter(x => bizIds.has(x.businessId)),
        payments: state.payments.filter(x => bizIds.has(x.businessId)),
        expenses: state.expenses.filter(x => bizIds.has(x.businessId)),
        cashTransactions: state.cashTransactions.filter(x => bizIds.has(x.businessId)),
        inventory: state.inventory.filter(x => bizIds.has(x.businessId))
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `backup_owner_${(owner?.name || ownerId).replace(/\s+/g, "_")}_${todayIso()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("File backup Owner (.json) berhasil diunduh!", "success");
    }

    function handleRestoreOwnerBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.businesses)) {
            showToast("Format file backup Owner tidak valid.", "error");
            return;
          }
          const mergeById = (colName, incomingList) => {
            if (!Array.isArray(incomingList)) return;
            incomingList.forEach(item => {
              if (!item || !item.id) return;
              const idx = state[colName].findIndex(x => x.id === item.id);
              if (idx !== -1) state[colName][idx] = item;
              else state[colName].push(item);
              syncRecordToCloud(colName, item);
            });
          };

          if (data.owner && data.owner.id) {
            mergeById("owners", [data.owner]);
          }
          ["businesses", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
            mergeById(col, data[col]);
          });

          saveStateToStorage();
          showToast("Data Owner, cabang, karyawan & transaksi berhasil dipulihkan!", "success");
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file JSON backup.", "error");
        }
      };
      reader.readAsText(file);
    }

              <input id="pb-bg-canvas" type="color" value="${esc(pb.bgCanvas || "#f4f7fb")}" class="w-full h-10 rounded-xl" />
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Warna Kartu & Sidebar (Surface)</label>
              <input id="pb-bg-surface" type="color" value="${esc(pb.bgSurface || "#ffffff")}" class="w-full h-10 rounded-xl" />
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Warna Teks Utama</label>
              <input id="pb-text-primary" type="color" value="${esc(pb.textPrimary || "#0f172a")}" class="w-full h-10 rounded-xl" />
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">No. WhatsApp Support</label>
              <input id="pb-wa" value="${esc(pb.supportWa)}" class="w-full px-3 py-2 rounded-xl" />
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Teks Footer</label>
              <input id="pb-footer" value="${esc(pb.footerText)}" class="w-full px-3 py-2 rounded-xl" />
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Username / Email Super Admin</label>
              <input id="pb-sa-email" required value="${esc(pb.superAdminAuth.email)}" class="w-full px-3 py-2 rounded-xl" />
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Password Super Admin</label>
              <input id="pb-sa-pass" required value="${esc(pb.superAdminAuth.password)}" class="w-full px-3 py-2 rounded-xl" />
            </div>
          </div>
          <div class="flex flex-wrap justify-between gap-2 pt-2 border-t border-slate-100">
            <button type="button" onclick="resetPlatformColorsDefault()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">Reset Warna Default</button>
            <button type="submit" class="brand-btn px-5 py-2.5 rounded-xl font-bold">Simpan Konfigurasi Platform</button>
          </div>
        </form>

        <div class="surface-card rounded-2xl p-5 space-y-3">
          <h2 class="text-sm font-bold text-slate-900">Backup & Restore Seluruh Database Platform</h2>
          <div class="grid grid-cols-1 sm:flex gap-2.5">
            <button type="button" onclick="downloadFullPlatformBackup()" class="brand-btn px-4 py-2.5 rounded-xl text-xs font-bold inline-flex items-center justify-center gap-2">
              <i data-lucide="download" class="w-4 h-4"></i>
              Download Backup Platform (.json)
            </button>
            <label class="cursor-pointer px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-800 text-xs font-bold inline-flex items-center justify-center gap-2">
              <i data-lucide="upload" class="w-4 h-4 brand-text"></i>
              Restore Database (.json)
              <input type="file" accept=".json" onchange="handleRestoreFullPlatformBackup(event)" class="hidden" />
            </label>
          </div>
        </div>
      `;
    }

    function resetPlatformColorsDefault() {
      state.platformBranding.primaryColor = "#0284c7";
      state.platformBranding.bgCanvas = "#f4f7fb";
      state.platformBranding.bgSurface = "#ffffff";
      state.platformBranding.textPrimary = "#0f172a";
      syncPlatformBrandingToCloud();
      applyThemeVariables();
      showToast("Warna platform dikembalikan ke default.", "info");
      renderApp({ forceShellRebuild: true });
    }

    function savePlatformSettings(e) {
      e.preventDefault();
      state.platformBranding.appName = document.getElementById("pb-name").value.trim();
      state.platformBranding.tagline = document.getElementById("pb-tagline").value.trim();
      state.platformBranding.primaryColor = document.getElementById("pb-primary").value;
      state.platformBranding.bgCanvas = document.getElementById("pb-bg-canvas").value;
      state.platformBranding.bgSurface = document.getElementById("pb-bg-surface").value;
      state.platformBranding.textPrimary = document.getElementById("pb-text-primary").value;
      state.platformBranding.supportWa = document.getElementById("pb-wa").value.trim();
      state.platformBranding.footerText = document.getElementById("pb-footer").value.trim();
      state.platformBranding.superAdminAuth.email = document.getElementById("pb-sa-email").value.trim();
      state.platformBranding.superAdminAuth.password = document.getElementById("pb-sa-pass").value;
      syncPlatformBrandingToCloud();
      applyThemeVariables();
      showToast("Pengaturan & warna platform disimpan.", "success");
      renderApp({ forceShellRebuild: true });
    }

    function downloadFullPlatformBackup() {
      const payload = {
        backupType: "FULL_PLATFORM",
        exportedAt: new Date().toISOString(),
        platformBranding: state.platformBranding,
        businesses: state.businesses,
        owners: state.owners,
        employees: state.employees,
        services: state.services,
        customers: state.customers,
        orders: state.orders,
        payments: state.payments,
        expenses: state.expenses,
        cashTransactions: state.cashTransactions,
        inventory: state.inventory
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `backup_full_platform_${todayIso()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Backup seluruh platform berhasil diunduh!", "success");
    }

    function handleRestoreFullPlatformBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.platformBranding) {
            state.platformBranding = { ...DEFAULT_PLATFORM_BRANDING, ...data.platformBranding };
            syncPlatformBrandingToCloud();
          }
          ["businesses", "owners", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
            if (Array.isArray(data[col])) {
              state[col] = data[col];
              data[col].forEach(item => syncRecordToCloud(col, item));
            }
          });
          saveStateToStorage();
          showToast("Database platform berhasil dipulihkan!", "success");
          renderApp({ forceShellRebuild: true });
        } catch (err) {
          showToast("File JSON tidak valid.", "error");
        }
      };
      reader.readAsText(file);
    }

    // --- MODAL SYSTEM ---
    function openModal(innerHtml) {
      const root = document.getElementById("modal-root");
      if (!root) return;
      root.innerHTML = `
        <div onclick="if(event.target===this) closeModal()" class="fixed inset-0 z-[100] bg-slate-900/45 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-xl w-full shadow-2xl border border-slate-200 overflow-hidden">
            ${innerHtml}
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const root = document.getElementById("modal-root");
      if (root) root.innerHTML = "";
    }

    // --- ROOT RENDER ENGINE ---
    function setHiddenFieldAndRender(fieldId, val) {
      const el = document.getElementById(fieldId);
      if (el) el.value = val;
      renderApp();
    }

    function renderApp(options = {}) {
      applyThemeVariables();
      const appEl = document.getElementById("app");
      if (!appEl) return;

      const currentSubRoute = state.publicOrderId || (state.currentUser ? `AUTH_${state.currentUser.id}` : "LOGIN");
      const isRouteTransition = (lastRenderedSubRoute !== currentSubRoute) || (lastRenderedTab !== state.activeTab);
      lastRenderedSubRoute = currentSubRoute;
      lastRenderedTab = state.activeTab;

      if (state.publicOrderId) {
        lastShellSignature = "PUBLIC";
        appEl.innerHTML = renderPublicClientPortalView();
        if (window.lucide) lucide.createIcons();
        return;
      }

      if (!state.currentUser) {
        lastShellSignature = "LOGIN";
        appEl.innerHTML = renderLoginView();
        if (window.lucide) lucide.createIcons();
        return;
      }

      const role = state.currentUser.role;
      const pb = state.platformBranding;
      const biz = getActiveBusiness();
      const activeTitleName = role === "SUPER_ADMIN" ? pb.appName : (biz?.name || pb.appName);
      const shellSig = `SHELL_${role}_${state.currentUser.id}`;

      const existingMainSlot = document.getElementById("app-main-content");
      const existingDesktopSidebar = document.getElementById("desktop-sidebar-slot");

      if (!options.forceShellRebuild && existingMainSlot && existingDesktopSidebar && lastShellSignature === shellSig) {
        const prevWinScrollY = window.scrollY;
        const prevInnerScrolls = Array.from(existingMainSlot.querySelectorAll(".overflow-y-auto")).map(el => el.scrollTop);

        const navHtml = buildSidebarInnerHtml(role, pb, biz, activeTitleName);
        existingDesktopSidebar.innerHTML = navHtml;
        const drawerPanel = document.querySelector("#mobile-sidebar-slot [data-drawer-panel]");
        if (drawerPanel) {
          drawerPanel.innerHTML = navHtml;
        }
        updateMobileDrawerOnly();

        if (!options.sidebarOnly) {
          existingMainSlot.innerHTML = renderMainContent();
          if (!isRouteTransition) {
            existingMainSlot.querySelectorAll(".animate-page, .chart-bar-anim, .chart-donut-anim").forEach(el => {
              el.classList.remove("animate-page", "chart-bar-anim", "chart-donut-anim");
            });
            const nextInnerScrolls = existingMainSlot.querySelectorAll(".overflow-y-auto");
            prevInnerScrolls.forEach((topVal, idx) => {
              if (nextInnerScrolls[idx]) nextInnerScrolls[idx].scrollTop = topVal;
            });
            window.scrollTo(0, prevWinScrollY);
          }
        }
        if (window.lucide) lucide.createIcons();
        return;
      }

      lastShellSignature = shellSig;
      const navHtml = buildSidebarInnerHtml(role, pb, biz, activeTitleName);

      appEl.innerHTML = `
        <div class="min-h-screen flex flex-col lg:flex-row">
          <aside id="desktop-sidebar-slot" class="hidden lg:flex lg:flex-col lg:w-64 lg:shrink-0 border-r border-slate-200/80 sticky top-0 h-screen" style="background-color: var(--bg-surface);">
            ${navHtml}
          </aside>

          <div id="mobile-sidebar-slot" class="fixed inset-0 z-50 lg:hidden pointer-events-none">
            <div data-drawer-backdrop onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200"></div>
            <aside data-drawer-panel class="relative w-64 max-w-[82vw] h-full border-r border-slate-200 flex flex-col transform -translate-x-full transition-transform duration-200 ease-out pointer-events-auto shadow-2xl" style="background-color: var(--bg-surface);">
              ${navHtml}
            </aside>
          </div>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky-app-header border-b border-slate-200/80 px-4 py-3 flex items-center justify-between gap-2 shadow-2xs">
              <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 rounded-xl bg-slate-100 text-slate-700 shrink-0">
                  <i data-lucide="menu" class="w-5 h-5 brand-text"></i>
                </button>
                <span class="font-bold text-sm text-slate-900 truncate">${esc(activeTitleName)}</span>
              </div>
              <span class="text-[10px] px-2.5 py-0.5 rounded-full brand-soft-bg font-bold shrink-0">${esc(role)}</span>
            </header>

            <main id="app-main-content" class="relative z-10 flex-1 p-4 sm:p-6 max-w-6xl w-full mx-auto">
              ${renderMainContent()}
            </main>

            <footer class="text-center text-[11px] text-slate-400 py-4 px-4 border-t border-slate-200/70">
              ${esc(pb.footerText)}
            </footer>
          </div>
        </div>
      `;

      updateMobileDrawerOnly();
      if (window.lucide) lucide.createIcons();
    }

    // --- GLOBAL EXPORTS FOR INLINE HANDLERS ---
    Object.assign(window, {
      state,
      addDaysIso,
      renderCustomDropdown,
      toggleCustomDropdown,
      closeCustomDropdown,
      setHiddenFieldAndRender,
      handleLogin,
      fillDemoAccount,
      handleLogout,
      switchTab,
      toggleMobileSidebar,
      switchActiveBusiness,
      triggerPwaInstall,
      openOwnerDetailModal,
      openOwnerFormModal,
      saveOwnerAccount,
      openConfirmDeleteOwnerModal,
      purgeOwnerDataCascade,
      downloadOwnerBackup,
      handleRestoreOwnerBackup,
      selectPosCustomer,
      addServiceToPosCart,
      updatePosCartQty,
      removePosCartItem,
      updatePosTotalsOnly,
      submitPosOrder,
      updateOrderStatus,
      settleOrderBalance,
      openOrderDetailModal,
      openReceiptModal,
      printThermalReceipt,
      startBarcodeScanner,
      stopBarcodeScanner,
      handleManualBarcodeSubmit,
      openCustomerDetailModal,
      openCustomerFormModal,
      fillCurrentGpsToCustomerForm,
      saveCustomer,
      deleteCustomer,
      openServiceFormModal,
      saveService,
      deleteService,
      openInventoryModal,
      saveInventoryItem,
      adjustInventoryStock,
      deleteInventoryItem,
      setReportPeriodPreset,
      openExpenseModal,
      saveExpense,
      exportFinancialReportCsv,
      openEmployeeFormModal,
      saveEmployee,
      toggleEmployeeActive,
      deleteEmployee,
      openNewBranchModal,
      saveNewBranch,
      saveOutletSettings,
      handleImageUploadToInput,
      resetPlatformColorsDefault,
      savePlatformSettings,
      downloadFullPlatformBackup,
      handleRestoreFullPlatformBackup,
      openModal,
      closeModal,
      renderApp
    });

    // --- BOOTSTRAP ---
    loadStateFromStorage();
    autoPurgeExpiredOwners(false);
    ["businesses", "owners", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
      lastSnapshotHashes[col] = computeCollectionHash(state[col] || []);
    });
    applyRouteFromUrl();
    window.addEventListener("hashchange", () => {
      applyRouteFromUrl();
      renderApp({ forceShellRebuild: true });
    });
    renderApp({ forceShellRebuild: true });
    initFirebase();
  </script>
</body>
</html>
