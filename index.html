    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatRupiah(num) {
      const n = Number(num || 0);
      return "Rp " + n.toLocaleString("id-ID");
    }

    function getJakartaNow() {
      try {
        const now = new Date();
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).formatToParts(now);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        return {
          dateStr: `${map.year}-${map.month}-${map.day}`,
          timeStr: `${map.hour}:${map.minute}`
        };
      } catch (e) {
        const d = new Date();
        return {
          dateStr: d.toISOString().slice(0, 10),
          timeStr: d.toTimeString().slice(0, 5)
        };
      }
    }

    function addDaysToDateStr(dateStr, days) {
      const base = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
      if (isNaN(base.getTime())) return getJakartaNow().dateStr;
      base.setDate(base.getDate() + Number(days || 0));
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, "0");
      const d = String(base.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getRemainingDays(expiresAt) {
      if (!expiresAt) return 30;
      const todayStr = getJakartaNow().dateStr;
      const t0 = new Date(todayStr + "T00:00:00").getTime();
      const t1 = new Date(expiresAt + "T00:00:00").getTime();
      if (isNaN(t1)) return 30;
      return Math.ceil((t1 - t0) / 86400000);
    }

    function sanitizeSessionUser(u) {
      if (!u) return null;
      return {

      };
    }

    async function hashPasswordText(plain) {
      const txt = String(plain || "");
      if (txt.startsWith("sha256:")) return txt;
      try {
        if (window.crypto && window.crypto.subtle) {
          const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
          const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
          return "sha256:" + hex;
        }
      } catch (e) {}
      return txt;
    }

    async function verifyPasswordMatch(inputPlain, storedPass) {
      const inStr = String(inputPlain || "");
      const stStr = String(storedPass || "");
      if (!stStr) return false;
      if (stStr.startsWith("sha256:")) {
        const hashed = await hashPasswordText(inStr);
        return hashed === stStr;
      }
      return inStr === stStr;
    }

    function getOwnerBusinesses(ownerId) {
      if (!ownerId) return [];
      const ownerRec = state.owners.find(o => o.id === ownerId);
      return state.businesses.filter(b => b.ownerId === ownerId || (ownerRec && b.id === ownerRec.businessId));
    }

    function getOwnerBranchQuota(ownerId) {
      const ownerRec = state.owners.find(o => o.id === ownerId);
      const owned = getOwnerBusinesses(ownerId);
      const purchased = Number(ownerRec?.maxBranches || Math.max(1, owned.length));
      return Math.max(1, purchased);
    }

    function saveStateToStorage() {
      try {
        const payload = {
          superAdminAuth: state.superAdminAuth,
          platformBranding: state.platformBranding,
          pricingPlans: state.pricingPlans,
          roleGuides: state.roleGuides,
          businesses: state.businesses,
          owners: state.owners,
          employees: state.employees,
          services: state.services,
          customers: state.customers,
          orders: state.orders,
          payments: state.payments,
          expenses: state.expenses,
          cashTransactions: state.cashTransactions,
          statusSettings: state.statusSettings
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
    }

    function loadStateFromStorage() {
      seedInitialData();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.superAdminAuth) state.superAdminAuth = Object.assign({}, state.superAdminAuth, parsed.superAdminAuth);
          if (parsed.platformBranding) state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, parsed.platformBranding);
          if (Array.isArray(parsed.pricingPlans) && parsed.pricingPlans.length) state.pricingPlans = parsed.pricingPlans;
          if (parsed.roleGuides) state.roleGuides = Object.assign({}, state.roleGuides, parsed.roleGuides);
          if (Array.isArray(parsed.businesses) && parsed.businesses.length) state.businesses = parsed.businesses;
          if (Array.isArray(parsed.owners) && parsed.owners.length) state.owners = parsed.owners;
          if (Array.isArray(parsed.employees) && parsed.employees.length) state.employees = parsed.employees;
          if (Array.isArray(parsed.services) && parsed.services.length) state.services = parsed.services;
          if (Array.isArray(parsed.customers) && parsed.customers.length) state.customers = parsed.customers;
          if (Array.isArray(parsed.orders) && parsed.orders.length) state.orders = parsed.orders;
          if (Array.isArray(parsed.payments) && parsed.payments.length) state.payments = parsed.payments;
          if (Array.isArray(parsed.expenses) && parsed.expenses.length) state.expenses = parsed.expenses;
          if (Array.isArray(parsed.cashTransactions) && parsed.cashTransactions.length) state.cashTransactions = parsed.cashTransactions;
          if (parsed.statusSettings) state.statusSettings = Object.assign({}, DEFAULT_STATUS_SETTINGS, parsed.statusSettings);
        }
      } catch (e) {}

      try {
        const sessRaw = sessionStorage.getItem(SESSION_KEY);
        if (sessRaw) {
          const sess = JSON.parse(sessRaw);
          if (sess && sess.isAuthenticated && sess.currentUser) {
            state.isAuthenticated = true;
            state.currentUser = sanitizeSessionUser(sess.currentUser);
            if (sess.activeBusinessId) state.activeBusinessId = sess.activeBusinessId;
          }
        }
      } catch (e) {}
    }

    function saveSessionToStorage() {
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          isAuthenticated: state.isAuthenticated,
          currentUser: sanitizeSessionUser(state.currentUser),
          activeBusinessId: state.activeBusinessId
        }));
      } catch (e) {}
    }

    function getPublicColRef(colName) {
      return collection(fbDb, "artifacts", appId, "public", "data", colName);
    }

    async function syncGlobalToCloud() {
      if (!fbDb || !state.firebaseConnected) return;
      try {
        const cfgRef = doc(fbDb, "artifacts", appId, "public", "data", "platform_config", "main");
        await setDoc(cfgRef, {
          id: "main",
          superAdminAuth: state.superAdminAuth,
          platformBranding: state.platformBranding,
          pricingPlans: state.pricingPlans,
          roleGuides: state.roleGuides,
          statusSettings: state.statusSettings,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("syncGlobalToCloud failed:", e);
      }
    }

    async function syncRecordToCloud(colName, record) {
      if (!fbDb || !state.firebaseConnected || !record || !record.id) return;
      try {
        const docRef = doc(fbDb, "artifacts", appId, "public", "data", colName, record.id);
        await setDoc(docRef, Object.assign({}, record, { updatedAt: new Date().toISOString() }), { merge: true });
      } catch (e) {
        console.error(`syncRecordToCloud (${colName}) failed:`, e);
      }
    }

    async function deleteRecordFromCloud(colName, recordId) {
      if (!fbDb || !state.firebaseConnected || !recordId) return;
      try {
        const docRef = doc(fbDb, "artifacts", appId, "public", "data", colName, recordId);
        await deleteDoc(docRef);
      } catch (e) {
        console.error(`deleteRecordFromCloud (${colName}) failed:`, e);
      }
    }

    async function syncAllCollectionsToCloud() {
      if (!fbDb || !state.firebaseConnected) return;
      await syncGlobalToCloud();
      const cols = ["businesses", "owners", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions"];
      for (const c of cols) {
        const arr = state[c] || [];
        for (const item of arr) {
          await syncRecordToCloud(c, item);
        }
      }
    }

    function attachFirestoreListeners() {
      fbUnsubscribers.forEach(fn => { try { fn(); } catch (e) {} });
      fbUnsubscribers = [];

      const cfgRef = doc(fbDb, "artifacts", appId, "public", "data", "platform_config", "main");
      const unsubCfg = onSnapshot(cfgRef, (snap) => {
        state.firebaseConnected = true;
        state.firebaseStatusNote = "Cloud Firebase Terhubung";
        if (snap.exists()) {
          const d = snap.data();
          if (d.superAdminAuth) state.superAdminAuth = Object.assign({}, state.superAdminAuth, d.superAdminAuth);
          if (d.platformBranding) state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, d.platformBranding);
          if (Array.isArray(d.pricingPlans) && d.pricingPlans.length) state.pricingPlans = d.pricingPlans;
          if (d.roleGuides) state.roleGuides = Object.assign({}, state.roleGuides, d.roleGuides);
          if (d.statusSettings) state.statusSettings = Object.assign({}, DEFAULT_STATUS_SETTINGS, d.statusSettings);
          applyThemeVariables();
          saveStateToStorage();
          renderApp();
        } else {
          syncAllCollectionsToCloud();
        }
      }, () => {
        state.firebaseConnected = false;
        state.firebaseStatusNote = "Sinkron Lokal (Cek Rules / Firestore)";
        renderApp();
      });
      fbUnsubscribers.push(unsubCfg);

      const listCols = ["businesses", "owners", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions"];
      for (const colName of listCols) {
        const unsub = onSnapshot(getPublicColRef(colName), (snapshot) => {
          state.firebaseConnected = true;
          state.firebaseStatusNote = "Cloud Firebase Terhubung";
          const items = [];
          snapshot.forEach(d => items.push(d.data()));
          if (items.length > 0) {
            state[colName] = items;
            saveStateToStorage();
            renderApp();
          }
        }, () => {});
        fbUnsubscribers.push(unsub);
      }
    }

    async function connectToFirebaseRealtime() {
      if (!fbAuth || !fbDb) {
        state.firebaseConnected = false;
        state.firebaseStatusNote = "Sinkron Lokal";
        renderApp();
        return;
      }

      onAuthStateChanged(fbAuth, (user) => {
        if (user) {
          attachFirestoreListeners();
        }
      });

      try {
        await signInAnonymously(fbAuth);
      } catch (err) {
        state.firebaseConnected = false;
        state.firebaseStatusNote = "Sinkron Lokal (Aktifkan Anonymous Auth)";
        renderApp();
      }
    }

    function normalizeOrderStatus(rawStatus) {
      const s = String(rawStatus || "RECEIVED").trim().toUpperCase();
      if (s === "RECEIVED" || s === "DITERIMA") return "RECEIVED";
      if (s === "WASHING" || s === "DICUCI") return "WASHING";
      if (s === "DRYING" || s === "DIKERINGKAN") return "DRYING";
      if (s === "IRONING" || s === "DISETRIKA") return "IRONING";
      if (s === "READY" || s === "SIAP DIAMBIL" || s === "SIAP_DIAMBIL") return "READY";
      if (s === "COMPLETED" || s === "SELESAI") return "COMPLETED";

    function getTrackingUrl(invoiceNumber) {
      try {
        const u = new URL(window.location.href);
        u.searchParams.set("track", invoiceNumber);
        u.hash = `track=${encodeURIComponent(invoiceNumber)}`;
        return u.toString();
      } catch (e) {
        return `#track=${encodeURIComponent(invoiceNumber)}`;
      }
    }

    function syncUrlRoute() {
      try {
        let targetHash = "#login";
        if (state.publicPortalMode) {
          targetHash = state.publicTrackQuery
            ? `#track=${encodeURIComponent(state.publicTrackQuery)}`
            : "#track";
        } else if (state.isAuthenticated && state.currentUser) {
          targetHash = `#${state.activeTab || "dashboard"}`;
        }
        if (window.location.hash !== targetHash) {
          history.replaceState(null, "", targetHash);
        }
      } catch (e) {}
    }

    function applyRouteFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const trackParam = params.get("track");
        const rawHash = String(window.location.hash || "").replace(/^#/, "").trim();

        if (trackParam) {
          state.publicPortalMode = true;
          state.publicTrackQuery = trackParam.trim().toUpperCase();
          return;
        }
        if (rawHash.startsWith("track")) {
          state.publicPortalMode = true;
          const eqIdx = rawHash.indexOf("=");
          state.publicTrackQuery = eqIdx >= 0 ? decodeURIComponent(rawHash.slice(eqIdx + 1)).trim().toUpperCase() : "";
          return;
        }
        if (rawHash === "login") {
          if (!state.isAuthenticated) {
            state.publicPortalMode = false;
          }
          return;
        }
        if (state.isAuthenticated && rawHash && canAccess(rawHash)) {
          state.publicPortalMode = false;
          state.activeTab = rawHash;
        }
      } catch (e) {}
    }

    let html5QrInstance = null;

    window.appActions = {

      toggleCustomDropdown(id) {

          renderApp();

          box.innerHTML = renderCustomDropdown({

      setModalEmpBranch(val) {
        state.modalEmpBranchId = val || getCurrentBusiness().id;

          box.innerHTML = renderCustomDropdown({
            id: "modal-emp-branch-dd",
            value: state.modalEmpBranchId,
            options: ownedBranches.map(b => ({ value: b.id, label: b.name, sub: b.address || "" })),
            onSelectFn: "setModalEmpBranch"
          });
        }
      },

      setModalOwnerPlan(val) {
        state.modalOwnerPlan = val || "STARTER";
        const box = document.getElementById("own-plan-dd-wrap");
        if (box) {
          box.innerHTML = renderCustomDropdown({
            id: "modal-own-plan-dd",
            value: state.modalOwnerPlan,
            options: state.pricingPlans.map(p => ({ value: p.id, label: p.name, sub: `${formatRupiah(p.monthlyPrice)}/bln` })),
            onSelectFn: "setModalOwnerPlan"
          });
        }
      },

      switchOwnerBranch(branchId) {
        if (state.currentUser?.role !== "OWNER") return;
        const owned = getOwnerBusinesses(state.currentUser.id);
        const target = owned.find(b => b.id === branchId);
        if (!target) return;
        state.activeBusinessId = target.id;
        state.selectedOrderId = null;
        state.selectedPaymentId = null;
        state.mobileSidebarOpen = false;
        saveSessionToStorage();
        showToast(`Beralih ke cabang ${target.name}`);
        renderApp();
      },

      switchTab(tab) {
        if (!canAccess(tab)) return;
        state.activeTab = tab;
        state.selectedOrderId = null;
        state.selectedPaymentId = null;
        state.mobileSidebarOpen = false;
        state.openDropdownId = null;
        renderApp();
      },

      openPublicPortal(invoicePrefill = "") {
        state.publicPortalMode = true;
        state.publicTrackQuery = invoicePrefill || "";
        state.mobileSidebarOpen = false;
        renderApp();
      },

      exitPublicPortal() {
        state.publicPortalMode = false;
        renderApp();
      },

      searchPublicInvoice() {
        const el = document.getElementById("public-track-input");
        state.publicTrackQuery = el ? el.value.trim().toUpperCase() : "";
        renderApp();
      },

      async loginWithCredentials() {
        const emailEl = document.getElementById("login-email-input");
        const passEl = document.getElementById("login-password-input");
        const emailInput = (emailEl ? emailEl.value : "").trim().toLowerCase();
        const passInput = (passEl ? passEl.value : "").trim();

        if (!emailInput || !passInput) {
          showToast("Masukkan email/username dan password", "error");
          return;
        }

        const sa = state.superAdminAuth || {};
        if (emailInput === String(sa.email || "").trim().toLowerCase() && await verifyPasswordMatch(passInput, sa.password)) {
          if (!String(sa.password || "").startsWith("sha256:")) {
            state.superAdminAuth.password = await hashPasswordText(passInput);
            saveStateToStorage();
            syncGlobalToCloud();
          }
          state.isAuthenticated = true;
          state.currentUser = sanitizeSessionUser({
            id: sa.id || "usr_super_admin",
            name: sa.name || "Super Admin",
            email: sa.email,
            role: "SUPER_ADMIN",
            businessId: state.activeBusinessId || "biz_ssmart_01"
          });
          state.activeTab = "dashboard";
          saveSessionToStorage();
          showToast("Berhasil masuk sebagai Super Admin");
          renderApp();
          return;
        }

        for (const owner of state.owners) {
          if (String(owner.email || "").trim().toLowerCase() === emailInput && await verifyPasswordMatch(passInput, owner.password)) {
            if (owner.status === "SUSPENDED") {
              showToast("Akun dinonaktifkan oleh Super Admin", "error");
              return;
            }
            if (!String(owner.password || "").startsWith("sha256:")) {
              owner.password = await hashPasswordText(passInput);
              saveStateToStorage();
              syncRecordToCloud("owners", owner);
            }
            state.isAuthenticated = true;
            state.activeBusinessId = owner.businessId || state.activeBusinessId;
            state.currentUser = sanitizeSessionUser({
              id: owner.id,
              name: owner.name,
              email: owner.email,
              role: "OWNER",
              businessId: owner.businessId
            });
            state.activeTab = "dashboard";
            saveSessionToStorage();
            showToast(`Selamat datang, ${owner.name}`);
            renderApp();
            return;
          }
        }

        for (const emp of state.employees) {
          if (String(emp.email || "").trim().toLowerCase() === emailInput && await verifyPasswordMatch(passInput, emp.password)) {
            if (emp.active === false) {
              showToast("Akun Anda dinonaktifkan oleh Owner", "error");
              return;
            }
            if (!String(emp.password || "").startsWith("sha256:")) {
              emp.password = await hashPasswordText(passInput);
              saveStateToStorage();
              syncRecordToCloud("employees", emp);
            }
            state.isAuthenticated = true;
            state.activeBusinessId = emp.businessId || state.activeBusinessId;
            state.currentUser = sanitizeSessionUser({
              id: emp.id,
              name: emp.name,
              email: emp.email,
              role: emp.role,
              businessId: emp.businessId
            });
            state.activeTab = emp.role === "OPERATOR" ? "orders" : "dashboard";
            saveSessionToStorage();
            showToast(`Berhasil masuk sebagai ${emp.role}`);
            renderApp();
            return;
          }
        }

        showToast("Email/username atau password salah", "error");
      },

      logoutUser() {
        state.isAuthenticated = false;
        state.currentUser = null;
        state.activeTab = "dashboard";
        state.mobileSidebarOpen = false;
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
        renderApp();
      },

      addToQuickCart(serviceId) {
        const srv = state.services.find(s => s.id === serviceId);
        if (!srv) return;
        const existing = state.quickCart.find(i => i.serviceId === srv.id);
        if (existing) {
          existing.qty += 1;
          existing.subtotal = existing.qty * existing.price;
        } else {
          state.quickCart.push({ serviceId: srv.id, name: srv.name, qty: 1, unit: srv.unit, price: srv.price, subtotal: srv.price });
        }
        renderApp();
      },

      removeCartItem(idx) {
        state.quickCart.splice(idx, 1);
        renderApp();
      },

      setQuickCustomer(val) { state.quickCustomerId = val; renderApp(); },

      setQuickNotes(val) { state.quickNotes = val; },

      submitQuickOrder() {
        if (!state.quickCustomerId) {
          showToast("Pilih pelanggan terlebih dahulu", "error");
          return;
        }
        if (state.quickCart.length === 0) {
          showToast("Keranjang masih kosong", "error");
          return;
        }
        const cust = state.customers.find(c => c.id === state.quickCustomerId);
        const biz = getCurrentBusiness();
        const now = getJakartaNow();
        const totalAmount = state.quickCart.reduce((s, i) => s + Number(i.subtotal || 0), 0);
        const paidAmount = Math.min(totalAmount, Math.max(0, Number(state.quickPaidAmount || 0)));
        const paymentStatus = paidAmount >= totalAmount ? "PAID" : (paidAmount > 0 ? "PARTIAL" : "UNPAID");
        const seq = String(state.orders.length + 1).padStart(4, "0");
        const invoiceNumber = `SS-${now.dateStr.replace(/-/g, "").slice(2)}-${seq}`;

        const orderRec = {
          id: "ord_" + Date.now(),
          businessId: biz.id,
          invoiceNumber,
          customerId: cust.id,
          customerName: cust.name,
          customerPhone: cust.phone,
          items: JSON.parse(JSON.stringify(state.quickCart)),
          totalAmount,
          paidAmount,
          paymentStatus,
          paymentMethod: state.quickPaymentMethod,
          status: "RECEIVED",
          notes: state.quickNotes,
          createdAt: `${now.dateStr} ${now.timeStr}`,
          estimatedDone: addDaysToDateStr(now.dateStr, 2)
        };

        state.orders.unshift(orderRec);
        saveStateToStorage();
        syncRecordToCloud("orders", orderRec);

        if (paidAmount > 0) {
          const payRec = {
            id: "pay_" + Date.now(),
            businessId: biz.id,
            orderId: orderRec.id,
            invoiceNumber,
            customerName: cust.name,
            amount: paidAmount,
            method: state.quickPaymentMethod,
            date: now.dateStr,
            note: "Pembayaran saat order"
          };
          const cashRec = {
            id: "csh_" + Date.now(),
            businessId: biz.id,
            type: "IN",
            category: "Pembayaran Order",
            amount: paidAmount,
            date: now.dateStr,
            note: `Order ${invoiceNumber} - ${cust.name}`
          };
          state.payments.unshift(payRec);
          state.cashTransactions.unshift(cashRec);
          saveStateToStorage();
          syncRecordToCloud("payments", payRec);
          syncRecordToCloud("cashTransactions", cashRec);
        }

        state.quickCart = [];
        state.quickPaidAmount = 0;
        state.quickNotes = "";
        showToast(`Order ${invoiceNumber} berhasil dibuat`);
        this.openReceiptModal(orderRec.id);

      settleOrderBalance(orderId) {
        const ord = state.orders.find(o => o.id === orderId);
        if (!ord) return;
        const sisa = Math.max(0, Number(ord.totalAmount) - Number(ord.paidAmount));
        if (sisa <= 0) return;
        ord.paidAmount = Number(ord.totalAmount);
        ord.paymentStatus = "PAID";
        const now = getJakartaNow();
        const payRec = { id: "pay_" + Date.now(), businessId: ord.businessId, orderId: ord.id, invoiceNumber: ord.invoiceNumber, customerName: ord.customerName, amount: sisa, method: ord.paymentMethod || "CASH", date: now.dateStr, note: "Pelunasan" };

        state.cashTransactions.unshift(cashRec);
        saveStateToStorage();
        syncRecordToCloud("orders", ord);

      async saveEmployee(existingEmpId = "") {
        if (state.currentUser?.role !== "OWNER") {
          showToast("Hanya Owner yang dapat mengelola Admin & Karyawan", "error");
          return;
        }
        const ownedBranches = getOwnerBusinesses(state.currentUser.id);
        const ownedIds = ownedBranches.map(b => b.id);
        const maxBranches = getOwnerBranchQuota(state.currentUser.id);

        const name = (document.getElementById("emp-name").value || "").trim();
        const email = (document.getElementById("emp-email").value || "").trim();
        const passwordRaw = (document.getElementById("emp-password").value || "").trim();
        const phone = (document.getElementById("emp-phone").value || "").trim();
        const role = state.modalEmpRole || "KASIR";
        const bizId = ownedIds.includes(state.modalEmpBranchId) ? state.modalEmpBranchId : getCurrentBusiness().id;

        const existing = existingEmpId ? state.employees.find(e => e.id === existingEmpId && ownedIds.includes(e.businessId)) : null;

        if (role === "ADMIN") {
          const totalAdminsAfter = state.employees.filter(e =>
            ownedIds.includes(e.businessId) &&
            e.role === "ADMIN" &&
            (!existing || e.id !== existing.id)
          ).length + 1;

          if (totalAdminsAfter > maxBranches) {
            closeModal();
            this.openBuyBranchPackageModal();
            return;
          }
        }

        if (!name || !email) {
          showToast("Nama dan email wajib diisi", "error");
          return;
        }
        if (!existing && passwordRaw.length < 6) {
          showToast("Password minimal 6 karakter wajib diisi", "error");
          return;
        }
        if (existing && passwordRaw && passwordRaw.length < 6) {
          showToast("Password baru minimal 6 karakter", "error");
          return;
        }

        const password = passwordRaw ? await hashPasswordText(passwordRaw) : existing.password;
        const rec = {
          id: existing ? existing.id : ("emp_" + Date.now()),
          businessId: bizId,
          name,
          email,
          password,
          phone,
          role,
          active: existing ? (existing.active !== false) : true
        };

        if (existing) {
          state.employees = state.employees.map(e => e.id === rec.id ? rec : e);
        } else {
          state.employees.push(rec);
        }

        saveStateToStorage();
        syncRecordToCloud("employees", rec);
        closeModal();
        showToast(existing ? "Data Admin / Staf diperbarui" : "Admin / Staf ditambahkan");
        renderApp();
      },

        if (state.currentUser?.role !== "OWNER") return;

        const emp = state.employees.find(e => e.id === empId && ownedIds.includes(e.businessId));
        if (!emp) return;

      async saveOwnerAccount(existingOwnerId) {
        if (state.currentUser?.role !== "SUPER_ADMIN") return;
        const name = (document.getElementById("own-f-name").value || "").trim();
        const email = (document.getElementById("own-f-email").value || "").trim();
        const passRaw = (document.getElementById("own-f-pass").value || "").trim();
        const role = "OWNER";
        const maxBranches = Math.max(1, Number(document.getElementById("own-f-branches")?.value || 1));
        const expiresAt = document.getElementById("own-f-exp").value || addDaysToDateStr(getJakartaNow().dateStr, 30);
        const bizName = (document.getElementById("own-f-biz").value || "").trim();
        const plan = state.modalOwnerPlan || "STARTER";
        const phone = (document.getElementById("own-f-phone").value || "").trim();

        if (!name || !email || !bizName) {
          showToast("Nama owner, email, dan nama usaha wajib diisi", "error");
          return;
        }

        const existingOwn = existingOwnerId ? state.owners.find(o => o.id === existingOwnerId) : null;
        if (!existingOwn && !passRaw) {
          showToast("Password wajib diisi untuk akun baru", "error");
          return;
        }

        const password = passRaw ? await hashPasswordText(passRaw) : existingOwn.password;
        const businessId = existingOwn?.businessId || ("biz_" + Date.now());
        const ownerId = existingOwn?.id || ("own_" + Date.now());

        const ownerRec = {
          id: ownerId,
          businessId,
          name,
          email,
          password,
          phone,
          role,
          maxBranches,
          status: existingOwn?.status || "ACTIVE",
          expiresAt
        };

        const existingBiz = state.businesses.find(b => b.id === businessId);
        const bizRec = Object.assign({}, existingBiz || {}, {
          id: businessId,
          ownerId,
          name: bizName,
          ownerName: name,
          phone,
          plan,
          expiresAt,
          address: existingBiz?.address || "Indonesia",
          logoUrl: existingBiz?.logoUrl || "",
          receiptFooter: existingBiz?.receiptFooter || "Terima kasih telah menggunakan layanan kami."
        });

        if (existingOwn) {
          state.owners = state.owners.map(o => o.id === ownerId ? ownerRec : o);
        } else {
          state.owners.push(ownerRec);
        }

        if (existingBiz) {
          state.businesses = state.businesses.map(b => b.id === businessId ? bizRec : b);
        } else {
          state.businesses.push(bizRec);
        }

        saveStateToStorage();
        syncRecordToCloud("owners", ownerRec);
        syncRecordToCloud("businesses", bizRec);
        closeModal();
        showToast("Data Owner, kuota cabang & masa aktif tersimpan");
        renderApp();
      },

      extendOwnerSubscription(ownerId, daysToAdd) {
        if (state.currentUser?.role !== "SUPER_ADMIN") return;
        const own = state.owners.find(o => o.id === ownerId);
        if (!own) return;
        const base = getRemainingDays(own.expiresAt) > 0 ? own.expiresAt : getJakartaNow().dateStr;
        const nextExp = addDaysToDateStr(base, daysToAdd);
        own.expiresAt = nextExp;

        const biz = state.businesses.find(b => b.id === own.businessId);
        if (biz) {
          biz.expiresAt = nextExp;
          syncRecordToCloud("businesses", biz);
        }

        saveStateToStorage();
        syncRecordToCloud("owners", own);
        showToast(`Masa aktif diperpanjang +${daysToAdd} hari (s/d ${nextExp})`);
        renderApp();
      },

      },

      savePlatformBranding() {
        if (state.currentUser?.role !== "SUPER_ADMIN") return;
        const readHex = (key, fallback) => {
          const raw = (document.getElementById(`hex-${key}`)?.value || "").trim();
          const normalized = raw.startsWith("#") ? raw : "#" + raw;
          return /^#[0-9A-Fa-f]{6}$/.test(normalized) ? normalized : fallback;
        };

        const primaryColor = readHex("primaryColor", "#2563eb");
        const btnColor = readHex("btnColor", primaryColor);
        const btnActiveColor = readHex("btnActiveColor", "#1e40af");
        const textColor = readHex("textColor", "#0f172a");
        const textMutedColor = readHex("textMutedColor", "#64748b");
        const iconColor = readHex("iconColor", primaryColor);
        const bgColor = readHex("bgColor", "#f8fafc");
        const surfaceColor = readHex("surfaceColor", "#ffffff");
        const sidebarColor = readHex("sidebarColor", "#ffffff");
        const iconStyle = (state.platformBranding?.iconStyle || "line") === "solid" ? "solid" : "line";

        state.platformBranding = Object.assign({}, state.platformBranding, {
          platformName: (document.getElementById("pb-name").value || "SSmart Laundry").trim(),
          supportWhatsApp: (document.getElementById("pb-wa").value || "").trim(),
          footerText: (document.getElementById("pb-footer").value || "").trim(),
          primaryColor,
          primaryDarkColor: btnActiveColor,
          btnColor,
          btnActiveColor,
          textColor,
          textMutedColor,
          iconColor,
          bgColor,
          surfaceColor,
          sidebarColor,
          iconStyle
        });
        applyThemeVariables();
        saveStateToStorage();
        syncGlobalToCloud();
        showToast("Pengaturan tampilan & warna HEX disimpan");
        renderApp();
      },

      selectGuideRoleToEdit(roleName) {
        state.editingGuideRole = roleName || "KASIR";
        renderApp();
      },

      saveRoleGuide() {
        if (state.currentUser?.role !== "SUPER_ADMIN") return;
        const roleKey = state.editingGuideRole || "KASIR";
        const raw = document.getElementById("sa-guide-textarea")?.value || "";
        const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
        state.roleGuides[roleKey] = lines.length ? lines : ["Panduan belum diisi."];
        saveStateToStorage();
        syncGlobalToCloud();
        showToast(`Panduan untuk role ${roleKey} disimpan`);
        renderApp();
      },

      async saveSuperAdminCredentials() {
        if (state.currentUser?.role !== "SUPER_ADMIN") return;
        const name = (document.getElementById("sa-auth-name").value || "Super Admin").trim();
        const email = (document.getElementById("sa-auth-email").value || "").trim();
        const passRaw = (document.getElementById("sa-auth-password").value || "").trim();
        if (!email) {
          showToast("Email/username wajib diisi", "error");
          return;
        }
        const password = passRaw ? await hashPasswordText(passRaw) : state.superAdminAuth.password;
        state.superAdminAuth = { id: "usr_super_admin", name, email, password, role: "SUPER_ADMIN" };
        state.currentUser = sanitizeSessionUser({
          id: "usr_super_admin",
          name,
          email,
          role: "SUPER_ADMIN",
          businessId: state.currentUser.businessId
        });
        saveStateToStorage();
        saveSessionToStorage();
        syncGlobalToCloud();
        showToast("Akun Super Admin diperbarui");
        renderApp();
      },

      handleBusinessLogoUpload(inputEl) {
        const file = inputEl?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const biz = getCurrentBusiness();
          biz.logoUrl = reader.result;
          saveStateToStorage();
          syncRecordToCloud("businesses", biz);
          showToast("Logo bisnis siap disimpan");
          renderApp();
        };
        reader.readAsDataURL(file);
      },

      saveBusinessSettings() {
        const role = state.currentUser?.role;
        if (role !== "OWNER" && role !== "ADMIN") return;
        const biz = getCurrentBusiness();
        biz.name = (document.getElementById("biz-set-name").value || biz.name).trim();
        biz.phone = (document.getElementById("biz-set-phone").value || "").trim();
        biz.address = (document.getElementById("biz-set-address").value || "").trim();
        biz.receiptFooter = (document.getElementById("biz-set-footer").value || "").trim();
        saveStateToStorage();
        syncRecordToCloud("businesses", biz);
        showToast("Pengaturan bisnis disimpan");
        renderApp();
      },

      handleBusinessQrisUpload(inputEl) {
        const role = state.currentUser?.role;
        if (role !== "ADMIN" && role !== "OWNER") return;
        const file = inputEl?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const biz = getCurrentBusiness();
          biz.qrisImageUrl = reader.result;
          saveStateToStorage();
          syncRecordToCloud("businesses", biz);
          showToast("Gambar QRIS berhasil diunggah");
          renderApp();
        };
        reader.readAsDataURL(file);
      },

      removeBusinessQris() {
        const role = state.currentUser?.role;
        if (role !== "ADMIN" && role !== "OWNER") return;
        const biz = getCurrentBusiness();
        biz.qrisImageUrl = "";
        saveStateToStorage();
        syncRecordToCloud("businesses", biz);
        showToast("Gambar QRIS dihapus");
        renderApp();
      },

      addPaymentAccount() {
        const role = state.currentUser?.role;
        if (role !== "ADMIN" && role !== "OWNER") return;
        const label = (document.getElementById("new-acc-label")?.value || "").trim();
        const accountNumber = (document.getElementById("new-acc-number")?.value || "-").trim();
        const accountHolder = (document.getElementById("new-acc-holder")?.value || "-").trim();
        if (!label) {
          showToast("Nama metode/bank wajib diisi", "error");
          return;
        }
        const biz = getCurrentBusiness();
        if (!Array.isArray(biz.paymentAccounts)) biz.paymentAccounts = [];
        biz.paymentAccounts.push({
          id: "acc_" + Date.now(),
          methodType: label.toUpperCase().includes("QRIS") ? "QRIS" : "TRANSFER",
          label,
          accountNumber: accountNumber || "-",
          accountHolder: accountHolder || "-"
        });
        saveStateToStorage();
        syncRecordToCloud("businesses", biz);
        showToast("Metode pembayaran / rekening ditambahkan");
        renderApp();
      },

      removePaymentAccount(accId) {
        const role = state.currentUser?.role;
        if (role !== "ADMIN" && role !== "OWNER") return;
        const biz = getCurrentBusiness();
        biz.paymentAccounts = (biz.paymentAccounts || []).filter(a => a.id !== accId);
        saveStateToStorage();
        syncRecordToCloud("businesses", biz);
        showToast("Metode pembayaran dihapus");
        renderApp();
      },

      async startQrScanner() {
        if (!window.Html5Qrcode) {
          showToast("Library kamera tidak tersedia", "error");
          return;
        }
        try {
          if (html5QrInstance) {
            try { await html5QrInstance.stop(); } catch (e) {}
            try { html5QrInstance.clear(); } catch (e) {}
            html5QrInstance = null;
          }

          const onDecodeSuccess = (decodedText) => {
            let inv = String(decodedText || "").trim();
            try {
              const u = new URL(inv);
              if (u.searchParams.get("track")) inv = u.searchParams.get("track");
              else if (u.hash && u.hash.includes("track=")) inv = decodeURIComponent(u.hash.split("track=")[1]);
            } catch (e) {}
            this.stopQrScanner();
            const found = state.orders.find(o => String(o.invoiceNumber).toUpperCase() === inv.toUpperCase());
            if (found) {
              state.activeTab = "orders";
              state.selectedOrderId = found.id;
              renderApp();
              showToast(`Invoice ${found.invoiceNumber} ditemukan`);
            } else {
              showToast(`Invoice ${inv} tidak ditemukan`, "error");
            }
          };

          const config = { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };
          html5QrInstance = new window.Html5Qrcode("qr-reader");

          let started = false;
          try {
            await html5QrInstance.start({ facingMode: "environment" }, config, onDecodeSuccess, () => {});
            started = true;
          } catch (firstErr) {
            const cameras = await window.Html5Qrcode.getCameras();
            if (cameras && cameras.length > 0) {
              const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
              await html5QrInstance.start(backCam.id, config, onDecodeSuccess, () => {});
              started = true;
            } else {
              throw firstErr;
            }
          }

          if (started) {
            showToast("Kamera scanner aktif");
          }
        } catch (err) {
          const msg = String(err?.message || err || "");
          if (/Permission|NotAllowed/i.test(msg)) {
            showToast("Izin kamera ditolak browser. Aktifkan izin kamera pada situs ini.", "error");
          } else {
            showToast("Kamera tidak terdeteksi atau sedang dipakai aplikasi lain", "error");
          }
        }
      },

      async stopQrScanner() {
        if (html5QrInstance) {
          try { await html5QrInstance.stop(); } catch (e) {}
          try { html5QrInstance.clear(); } catch (e) {}
          html5QrInstance = null;
        }
      },

      lookupScannedInvoice() {
        const val = (document.getElementById("manual-scan-invoice")?.value || "").trim().toUpperCase();
        if (!val) return;
        const found = state.orders.find(o => String(o.invoiceNumber).toUpperCase() === val);
        if (found) {
          state.activeTab = "orders";
          state.selectedOrderId = found.id;
          renderApp();
        } else {
          showToast("Nomor invoice tidak ditemukan", "error");
        }
      }
    };

    function bootstrapApplication() {
      loadStateFromStorage();
      applyRouteFromUrl();
      document.addEventListener("click", () => {
        if (state.openDropdownId) {
          state.openDropdownId = null;
          renderApp();
        }
      });
      window.addEventListener("hashchange", () => {
        applyRouteFromUrl();
        renderApp();
      });
      renderApp();
      connectToFirebaseRealtime();
    }

    bootstrapApplication();
  </script>
</body>
