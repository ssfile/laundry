  <!-- Firebase SDK (Modular Bridge) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const userFirebaseConfig = {
      apiKey: "AIzaSyCuY0JO7eIFl656y3Nw92sp9N850YBVJEI",
      authDomain: "ssmart-laundry.firebaseapp.com",
      projectId: "ssmart-laundry",
      storageBucket: "ssmart-laundry.firebasestorage.app",
      messagingSenderId: "650316028227",
      appId: "1:650316028227:web:590c7fc6e3630e0ccdb7f6"
    };

    const firebaseConfig = typeof __firebase_config !== 'undefined'
      ? JSON.parse(__firebase_config)
      : userFirebaseConfig;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'ssmart-laundry';

    window.__firebaseBridge = {
      ready: false,
      user: null,
      db: null,
      appId,
      async init(onRemoteStateUpdate, onRemoteCollectionUpdate) {
        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);
          this.db = db;

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
          this.user = auth.currentUser;
          this.ready = Boolean(this.user);

          if (!this.user) return;

          // 1. Listener Konfigurasi Global Platform (Super Admin Credentials, Branding, SaaS Plans)
          const globalDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'platform_config', 'main');
          onSnapshot(globalDocRef, (snap) => {
            if (snap.exists() && onRemoteStateUpdate) {
              onRemoteStateUpdate(snap.data());
            }
          }, (err) => console.warn('Firestore global listener:', err.message));

          // 2. Listener Koleksi Multi-Tenant
          const collections = [
            'businesses', 'owners', 'employees', 'services',
            'customers', 'orders', 'payments', 'expenses', 'cashTransactions'
          ];
          collections.forEach((colName) => {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
            onSnapshot(colRef, (snapshot) => {
              const items = [];
              snapshot.forEach((d) => items.push(d.data()));
              if (onRemoteCollectionUpdate) {
                onRemoteCollectionUpdate(colName, items);
              }
            }, (err) => console.warn(`Firestore ${colName} listener:`, err.message));
          });
        } catch (err) {
          console.warn('Firebase init fallback active:', err.message);
        }
      },
      async saveGlobalConfig(payload) {
        if (!this.ready || !this.user || !this.db) return;
        try {
          const ref = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'platform_config', 'main');
          await setDoc(ref, payload, { merge: true });
        } catch (e) {
          console.warn('Firestore saveGlobalConfig error:', e.message);
        }
      },
      async saveDoc(colName, docId, data) {
        if (!this.ready || !this.user || !this.db || !docId) return;
        try {
          const ref = doc(this.db, 'artifacts', this.appId, 'public', 'data', colName, String(docId));
          await setDoc(ref, data, { merge: true });
        } catch (e) {
          console.warn(`Firestore saveDoc (${colName}/${docId}) error:`, e.message);
        }
      }
    };

    if (window.__onFirebaseBridgeLoaded) {
      window.__onFirebaseBridgeLoaded();
    }
  </script>

    // =========================================================================
    // 2. FUNGSI UTILITAS & HELPER UTAMA
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatRupiah(amount) {
      const num = Number(amount) || 0;
      return 'Rp' + num.toLocaleString('id-ID');
    }

    function getJakartaNow() {
      try {
        const now = new Date();
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Jakarta',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).formatToParts(now);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const dateStr = `${map.year}-${map.month}-${map.day}`;
        const timeStr = `${map.hour}:${map.minute}`;
        const compactDate = `${map.year}${map.month}${map.day}`;
        return { dateStr, timeStr, compactDate };
      } catch (e) {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return { dateStr: `${yyyy}-${mm}-${dd}`, timeStr: `${hh}:${min}`, compactDate: `${yyyy}${mm}${dd}` };
      }
    }

    function addHoursToDateTime(dateStr, timeStr, hoursToAdd) {
      try {
        const base = new Date(`${dateStr}T${timeStr || '08:00'}:00`);
        if (isNaN(base.getTime())) return `${dateStr} ${timeStr}`;
        base.setHours(base.getHours() + (Number(hoursToAdd) || 24));
        const yyyy = base.getFullYear();
        const mm = String(base.getMonth() + 1).padStart(2, '0');
        const dd = String(base.getDate()).padStart(2, '0');
        const hh = String(base.getHours()).padStart(2, '0');
        const min = String(base.getMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
      } catch (e) {
        return `${dateStr} ${timeStr}`;
      }
    }

    function addDaysToDateStr(dateStr, days) {
      try {
        const parts = String(dateStr).split('-').map(Number);
        const d = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
        d.setDate(d.getDate() + (Number(days) || 0));
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      } catch (e) {
        return dateStr;
      }
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '-';
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function getSubscriptionRemainingDays(obj) {
      if (!obj || !obj.expiresAt) return 30;
      const todayStr = getJakartaNow().dateStr;
      const tParts = todayStr.split('-').map(Number);
      const eParts = String(obj.expiresAt).split('-').map(Number);
      const tDate = new Date(tParts[0], (tParts[1] || 1) - 1, tParts[2] || 1);
      const eDate = new Date(eParts[0], (eParts[1] || 1) - 1, eParts[2] || 1);
      return Math.round((eDate - tDate) / (1000 * 60 * 60 * 24));
    }

    function getCurrentBusiness() {
      return state.businesses.find(b => b.id === state.activeBusinessId) || state.businesses[0] || {
        id: 'biz_ssmart_01',
        name: 'SSmart Laundry',
        address: 'Indonesia',
        phone: '6281234567890',
        invoicePrefix: 'LF',
        invoiceCounter: 1,
        minWeight: 1,
        taxRate: 0,
        plan: 'PRO',
        statuses: JSON.parse(JSON.stringify(DEFAULT_STATUSES)),
        paymentMethods: ['Tunai', 'QRIS', 'Transfer Bank'],
        expenseCategories: ['Deterjen', 'Pewangi', 'Listrik', 'Gaji', 'Lain-lain'],
        whatsappTemplates: {
          received: 'Halo *{nama_pelanggan}*, order *{no_invoice}* diterima. Total *{total}*. Cek: {link_tracking}',
          ready: 'Halo *{nama_pelanggan}*, cucian *{no_invoice}* sudah siap diambil. Cek: {link_tracking}',
          reminder: 'Halo *{nama_pelanggan}*, sisa tagihan *{no_invoice}*: *{sisa_bayar}*.'

      };
    }

    function canAccess(tabId) {
      if (!state.currentUser || !state.currentUser.role) return false;
      const allowed = ROLE_PERMISSIONS[state.currentUser.role] || [];
      return allowed.includes(tabId);
    }

    function getTrackingUrl(invoiceNumber) {
      try {
        const url = new URL(window.location.href.split('?')[0]);
        url.searchParams.set('track', invoiceNumber);
        return url.toString();
      } catch (e) {
        return `?track=${encodeURIComponent(invoiceNumber)}`;
      }
    }

    function showToast(message, type = 'success') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      const styleMap = {
        success: 'bg-slate-900 text-white border-slate-800',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-indigo-600 text-white border-indigo-500'
      };
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-semibold animate-page ${styleMap[type] || styleMap.success}`;
      el.textContent = message;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3000);
    }

    function applyPlatformBranding() {
      const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
      const rootEl = document.documentElement;
      if (pb.primaryColor) {
        rootEl.style.setProperty('--brand-primary', pb.primaryColor);
        rootEl.style.setProperty('--brand-primary-hover', pb.primaryColor);
      }
      if (pb.accentColor) rootEl.style.setProperty('--brand-accent', pb.accentColor);
      if (pb.bgColor) rootEl.style.setProperty('--app-bg', pb.bgColor);
      if (pb.surfaceColor) rootEl.style.setProperty('--surface-bg', pb.surfaceColor);
      if (pb.sidebarColor) rootEl.style.setProperty('--sidebar-bg', pb.sidebarColor);

      if (pb.platformName) {
        document.title = `${pb.platformName} — ${pb.platformTagline || 'Kelola Laundry tanpa Ribet'}`;
      }
      if (pb.faviconDataUrl) {
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        link.href = pb.faviconDataUrl;
      }
    }

    function readImageFileAsDataUrl(file, maxSize = 260) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxSize || h > maxSize) {
              if (w > h) {
                h = Math.round((h * maxSize) / w);
                w = maxSize;
              } else {
                w = Math.round((w * maxSize) / h);
                h = maxSize;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png', 0.9));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderSubscriptionWarningBanner() {
      if (!state.currentUser || state.currentUser.role === 'SUPER_ADMIN') return '';
      const biz = getCurrentBusiness();
      const owner = state.owners.find(o => o.businessId === biz.id);
      const expStr = (owner && owner.expiresAt) || biz.expiresAt;
      if (!expStr) return '';

      const remDays = getSubscriptionRemainingDays({ expiresAt: expStr });
      if (remDays > 7) return '';

      const isExpired = remDays < 0;
      const canRenew = state.currentUser.role === 'OWNER' || state.currentUser.role === 'ADMIN';
      const title = isExpired
        ? `Masa Aktif Paket ${biz.plan} Telah Berakhir (${Math.abs(remDays)} hari lalu)`
        : `Peringatan: Masa Aktif Paket ${biz.plan} Berakhir dalam ${remDays} Hari (${formatDisplayDate(expStr)})`;

      return `
        <div class="p-4 rounded-2xl ${isExpired ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-amber-50 border-amber-200 text-amber-900'} border flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="space-y-0.5">
            <div class="font-bold text-xs sm:text-sm">${escapeHtml(title)}</div>
            <div class="text-xs opacity-80">Segera lakukan perpanjangan agar layanan operasional outlet tetap berjalan lancar.</div>
          </div>
          ${canRenew ? `
            <button type="button" onclick="window.appActions.openRenewPackageModal()"
              class="px-4 py-2 rounded-xl ${isExpired ? 'bg-rose-600 hover:bg-rose-700' : 'bg-amber-600 hover:bg-amber-700'} text-white text-xs font-bold shrink-0 transition-colors">
              Perpanjang / Pilih Paket Baru
            </button>
          ` : ''}
        </div>
      `;
    }

    // =========================================================================
    // 3. DATA AWAL & SINKRONISASI CLOUD FIRESTORE
    // =========================================================================
    function syncGlobalToCloud() {
      if (window.__firebaseBridge && window.__firebaseBridge.ready) {
        window.__firebaseBridge.saveGlobalConfig({
          superAdminAuth: state.superAdminAuth,
          saasPlans: state.saasPlans,
          platformBranding: state.platformBranding,
          systemAnnouncement: state.systemAnnouncement,
          updatedAt: new Date().toISOString()
        });
      }
    }

    function syncRecordToCloud(colName, record) {
      if (window.__firebaseBridge && window.__firebaseBridge.ready && record && record.id) {
        window.__firebaseBridge.saveDoc(colName, record.id, record);
      }
    }

    function syncAllCollectionsToCloud() {
      if (!window.__firebaseBridge || !window.__firebaseBridge.ready) return;
      syncGlobalToCloud();
      const map = {
        businesses: state.businesses,
        owners: state.owners,
        employees: state.employees,
        services: state.services,
        customers: state.customers,
        orders: state.orders,
        payments: state.payments,
        expenses: state.expenses,
        cashTransactions: state.cashTransactions
      };
      Object.entries(map).forEach(([col, list]) => {
        (list || []).forEach(item => syncRecordToCloud(col, item));
      });
    }

    function saveSessionToStorage() {
      try {
        if (state.isAuthenticated && state.currentUser) {
          localStorage.setItem(SESSION_KEY, JSON.stringify({
            isAuthenticated: true,
            activeBusinessId: state.activeBusinessId,
            currentUser: state.currentUser
          }));
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {}
    }

    function restoreSessionFromStorage() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const sess = JSON.parse(raw);
        if (sess && sess.isAuthenticated && sess.currentUser && sess.currentUser.role) {
          state.isAuthenticated = true;
          state.currentUser = sess.currentUser;
          if (sess.activeBusinessId) state.activeBusinessId = sess.activeBusinessId;
        }
      } catch (e) {}
    }

    function connectToFirebaseRealtime() {
      if (!window.__firebaseBridge) return;
      window.__firebaseBridge.init(
        (remoteGlobal) => {
          state.firebaseConnected = true;
          if (remoteGlobal.superAdminAuth) {
            state.superAdminAuth = Object.assign({}, state.superAdminAuth, remoteGlobal.superAdminAuth);
          }
          if (Array.isArray(remoteGlobal.saasPlans) && remoteGlobal.saasPlans.length > 0) {
            state.saasPlans = remoteGlobal.saasPlans;
          }
          if (remoteGlobal.platformBranding) {
            state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, remoteGlobal.platformBranding);
          }
          if (remoteGlobal.systemAnnouncement) {
            state.systemAnnouncement = remoteGlobal.systemAnnouncement;
          }
          saveStateToStorage();
          renderApp();
        },
        (colName, remoteItems) => {
          state.firebaseConnected = true;
          if (!Array.isArray(remoteItems)) return;
          if (remoteItems.length === 0) {
            if (colName === 'businesses' && state.businesses.length > 0) {
              syncAllCollectionsToCloud();
            }
            return;
          }
          state[colName] = remoteItems;
          saveStateToStorage();
          renderApp();
        }
      );
    }

    function renderCustomDropdown({ id, value, options, onChangeAction, param = '', placeholder = 'Pilih opsi...', compact = false }) {
      const selected = options.find(o => String(o.value) === String(value));
      const label = selected ? selected.label : placeholder;
      const badgeColor = selected && selected.color ? selected.color : null;
      const encodedOptions = encodeURIComponent(JSON.stringify(options));

      const dotHtml = badgeColor
        ? `<span class="w-2 h-2 rounded-full bg-${badgeColor}-500 shrink-0"></span>`
        : '';

      return `
        <button type="button"
          onclick="window.appActions.openDropdown(this, '${escapeHtml(id)}', '${escapeHtml(String(value ?? ''))}', '${encodedOptions}', '${escapeHtml(onChangeAction)}', '${escapeHtml(String(param))}')"
          class="w-full flex items-center justify-between gap-2 ${compact ? 'px-3 py-2 text-xs' : 'px-3.5 py-2.5 text-sm'} rounded-xl border border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50/70 text-slate-800 font-medium transition-all text-left focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
          <span class="flex items-center gap-2 truncate">
            ${dotHtml}
            <span class="truncate">${escapeHtml(label)}</span>
          </span>
          <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
      `;
    }

    function openCustomDropdown(triggerEl, id, currentValue, encodedOptions, onChangeAction, param) {
      const portal = document.getElementById('custom-dropdown-portal');
      if (!portal) return;

      let options = [];
      try {
        options = JSON.parse(decodeURIComponent(encodedOptions));
      } catch (e) {
        return;
      }

      const rect = triggerEl.getBoundingClientRect();
      const isMobile = window.innerWidth < 640;

      const listHtml = options.map(opt => {
        const isSelected = String(opt.value) === String(currentValue);
        const dot = opt.color ? `<span class="w-2.5 h-2.5 rounded-full bg-${opt.color}-500 shrink-0"></span>` : '';
        return `
          <button type="button"
            onclick="window.appActions.selectDropdownOption('${escapeHtml(onChangeAction)}', '${escapeHtml(String(opt.value))}', '${escapeHtml(param)}')"
            class="w-full flex items-center justify-between gap-3 px-3.5 py-2.5 rounded-xl text-left text-sm transition-colors ${isSelected ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-700 hover:bg-slate-100'}">
            <div class="flex items-center gap-2.5 min-w-0">
              ${dot}
              <div class="truncate">
                <div class="truncate">${escapeHtml(opt.label)}</div>
                ${opt.sub ? `<div class="text-[11px] text-slate-400 truncate">${escapeHtml(opt.sub)}</div>` : ''}
              </div>
            </div>
            ${isSelected ? `<svg class="w-4 h-4 text-indigo-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>` : ''}
          </button>
        `;
      }).join('');

      portal.classList.remove('hidden');

      if (isMobile) {
        portal.innerHTML = `
          <div onclick="window.appActions.closeDropdown()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-end justify-center p-2">
            <div onclick="event.stopPropagation()" class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-100 p-3 max-h-[70vh] flex flex-col animate-page">
              <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-2.5"></div>
              <div class="overflow-y-auto space-y-1 pr-1">${listHtml}</div>
            </div>
          </div>
        `;
      } else {
        const top = Math.min(rect.bottom + 6, window.innerHeight - 260);
        const left = Math.min(rect.left, window.innerWidth - Math.max(rect.width, 220) - 16);
        const width = Math.max(rect.width, 210);
        portal.innerHTML = `
          <div onclick="window.appActions.closeDropdown()" class="fixed inset-0">
            <div onclick="event.stopPropagation()"
              style="position:fixed; top:${top}px; left:${left}px; width:${width}px;"
              class="bg-white rounded-2xl shadow-xl border border-slate-200/80 p-1.5 max-h-64 overflow-y-auto space-y-0.5 animate-page">
              ${listHtml}
            </div>
          </div>
        `;
      }
    }

    function closeCustomDropdown() {
      const portal = document.getElementById('custom-dropdown-portal');
      if (portal) {
        portal.classList.add('hidden');
        portal.innerHTML = '';
      }
    }

    // =========================================================================
    // 5. KALKULASI OTOMATIS QUICK ORDER (TANPA HILANG FOKUS INPUT)
    // =========================================================================
    function calculateQuickOrderSummary() {
      const biz = getCurrentBusiness();
      const bizServices = state.services.filter(s => s.businessId === biz.id && s.active);
      let subtotal = 0;

      const resolvedItems = state.quickOrderForm.items.map(row => {
        const srv = bizServices.find(s => s.id === row.serviceId) || bizServices[0];
        if (!srv) return null;
        let qty = Number(row.qty) || 0;
        if (srv.unit === 'Kg' && qty > 0 && qty < (Number(biz.minWeight) || 0)) {
          qty = Number(biz.minWeight);
        }
        const unitPrice = row.customPrice !== null && row.customPrice !== '' ? Number(row.customPrice) : Number(srv.price);
        const rowSub = Math.round(qty * unitPrice);
        subtotal += rowSub;
        return {
          serviceId: srv.id,
          serviceName: srv.name,
          unit: srv.unit,
          durationHours: srv.durationHours,
          priceSnapshot: unitPrice,
          qty,
          subtotal: rowSub
        };
      }).filter(Boolean);

      const discount = Math.max(0, Number(state.quickOrderForm.discount) || 0);
      const extraFees = (Number(state.quickOrderForm.deliveryFee) || 0)
                      + (Number(state.quickOrderForm.packingFee) || 0)
                      + (Number(state.quickOrderForm.expressFee) || 0);
      const taxable = Math.max(0, subtotal - discount + extraFees);
      const taxAmount = state.quickOrderForm.applyTax ? Math.round(taxable * ((Number(biz.taxRate) || 0) / 100)) : 0;
      const total = taxable + taxAmount;

      let paidAmount = 0;
      if (state.quickOrderForm.paymentOption === 'FULL') paidAmount = total;
      else if (state.quickOrderForm.paymentOption === 'DP') paidAmount = Math.min(total, Math.max(0, Number(state.quickOrderForm.dpAmount) || 0));

      const remainingAmount = Math.max(0, total - paidAmount);
      const maxDuration = resolvedItems.reduce((max, item) => Math.max(max, item.durationHours || 24), 24);
      const now = getJakartaNow();
      const dIn = state.quickOrderForm.customDate || now.dateStr;
      const tIn = state.quickOrderForm.customTime || now.timeStr;
      const estimatedDone = addHoursToDateTime(dIn, tIn, maxDuration);

      return { resolvedItems, subtotal, discount, extraFees, taxAmount, total, paidAmount, remainingAmount, estimatedDone, dateIn: dIn, timeIn: tIn };
    }

    function updateQuickOrderLiveSummaryDOM() {
      const summary = calculateQuickOrderSummary();
      const elSub = document.getElementById('qo-live-subtotal');
      const elTotal = document.getElementById('qo-live-total');
      const elEst = document.getElementById('qo-live-est');
      const elRem = document.getElementById('qo-live-remaining');
      if (elSub) elSub.textContent = formatRupiah(summary.subtotal);
      if (elTotal) elTotal.textContent = formatRupiah(summary.total);
      if (elEst) elEst.textContent = summary.estimatedDone;
      if (elRem) elRem.textContent = formatRupiah(summary.remainingAmount);

      state.quickOrderForm.items.forEach((row, idx) => {
        const rowSubEl = document.getElementById(`qo-row-sub-${idx}`);
        if (rowSubEl && summary.resolvedItems[idx]) {
          rowSubEl.textContent = formatRupiah(summary.resolvedItems[idx].subtotal);
        }
      });
    }

    function getStatusBadge(statusName) {
      const biz = getCurrentBusiness();
      const found = (biz.statuses || DEFAULT_STATUSES).find(s => s.name === statusName);
      const color = found ? found.color : 'slate';
      const map = {
        slate: 'bg-slate-100 text-slate-700 border-slate-200',
        amber: 'bg-amber-50 text-amber-700 border-amber-200',
        blue: 'bg-blue-50 text-blue-700 border-blue-200',
        cyan: 'bg-cyan-50 text-cyan-700 border-cyan-200',
        indigo: 'bg-indigo-50 text-indigo-700 border-indigo-200',
        purple: 'bg-purple-50 text-purple-700 border-purple-200',
        emerald: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        teal: 'bg-teal-50 text-teal-700 border-teal-200',
        rose: 'bg-rose-50 text-rose-700 border-rose-200'
      };
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${map[color] || map.slate}">${escapeHtml(statusName)}</span>`;
    }

    function getPaymentBadge(payStatus) {
      if (payStatus === 'LUNAS') return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Lunas</span>`;
      if (payStatus === 'DP') return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">DP</span>`;
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">Belum Lunas</span>`;
    }

    function renderReportsView() {
      const biz = getCurrentBusiness();

      const kasMasuk = bizPayments.reduce((a, b) => a + b.amount, 0);

      const labaOperasional = omzet - kasKeluar;

      return `

              <div class="text-xs text-slate-500">Biaya Operasional</div>

    // =========================================================================
    // 7. PORTAL PELANGGAN PUBLIK (TANPA LOGIN — CLEAN MINIMALIST)
    // =========================================================================
    function renderPublicClientPortalView() {
      const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
      const query = (state.publicTrackQuery || '').trim().toUpperCase();
      const matchedOrder = query
        ? state.orders.find(o => o.invoiceNumber.toUpperCase() === query)
        : null;
      const biz = matchedOrder
        ? (state.businesses.find(b => b.id === matchedOrder.businessId) || getCurrentBusiness())
        : getCurrentBusiness();

      const workflowSteps = (biz.statuses || DEFAULT_STATUSES).filter(s => s.name !== 'Dibatalkan');
      const currentStepIdx = matchedOrder ? workflowSteps.findIndex(s => s.name === matchedOrder.status) : -1;

      const logoMarkup = biz.logoDataUrl
        ? `<img src="${biz.logoDataUrl}" alt="${escapeHtml(biz.name)}" class="w-8 h-8 rounded-xl object-contain bg-white border border-slate-200 p-0.5" />`
        : pb.logoDataUrl
          ? `<img src="${pb.logoDataUrl}" alt="${escapeHtml(pb.platformName)}" class="w-8 h-8 rounded-xl object-contain bg-white border border-slate-200 p-0.5" />`
          : `<div class="w-8 h-8 rounded-xl theme-primary-bg text-white flex items-center justify-center font-extrabold text-sm">${escapeHtml((biz.name || 'S').charAt(0).toUpperCase())}</div>`;

      return `
        <div class="min-h-screen flex flex-col justify-between" style="background-color: var(--app-bg);">
          <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-20">
            <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                ${logoMarkup}
                <span class="font-bold text-slate-900 text-sm tracking-tight">${escapeHtml(biz.name)}</span>
              </div>
              <button type="button" onclick="window.appActions.exitPublicPortal()" class="text-xs font-medium text-slate-500 hover:text-indigo-600 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 transition-colors">
                Mode Kasir →
              </button>
            </div>
          </header>

          <main class="max-w-lg w-full mx-auto px-4 py-8 flex-1 space-y-6 animate-page">
            <div class="text-center space-y-1.5">
              <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Lacak Status Cucian</h1>
              <p class="text-xs sm:text-sm text-slate-500">Masukkan nomor invoice pada struk Anda tanpa perlu login.</p>
            </div>

            <div class="bg-white p-2 rounded-2xl border border-slate-200/90 shadow-xs flex items-center gap-2">
              <input type="text" id="public-track-input" value="${escapeHtml(state.publicTrackQuery)}"
                onkeydown="if(event.key==='Enter') window.appActions.searchPublicInvoice()"
                placeholder="Contoh: LF-20261126-0001"
                class="flex-1 px-3.5 py-2.5 text-sm font-mono uppercase bg-transparent text-slate-900 placeholder:text-slate-400 focus:outline-none" />
              <button type="button" onclick="window.appActions.searchPublicInvoice()"
                class="px-5 py-2.5 rounded-xl theme-primary-bg text-white text-xs sm:text-sm font-semibold transition-all shrink-0">
                Cek Status
              </button>
            </div>

            ${matchedOrder ? `
              <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs p-5 sm:p-6 space-y-6 animate-page">
                <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-4">
                  <div>
                    <span class="text-[11px] font-mono font-semibold theme-primary-text uppercase">${escapeHtml(matchedOrder.invoiceNumber)}</span>
                    <h2 class="text-lg font-bold text-slate-900 mt-0.5">${escapeHtml(matchedOrder.customerName)}</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Estimasi selesai: <strong class="text-slate-600">${escapeHtml(matchedOrder.estimatedDone)}</strong></p>
                  </div>
                  ${getPaymentBadge(matchedOrder.paymentStatus)}
                </div>

                <!-- Vertical Minimalist Timeline -->
                <div class="space-y-3">
                  <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Progres Pengerjaan</div>
                  <div class="space-y-0">
                    ${workflowSteps.map((st, idx) => {
                      const done = idx <= currentStepIdx;
                      const isCurrent = idx === currentStepIdx;
                      return `
                        <div class="flex items-start gap-3.5 relative pb-4 last:pb-0">
                          ${idx < workflowSteps.length - 1 ? `<div class="w-0.5 h-full absolute left-[9px] top-4 ${idx < currentStepIdx ? 'theme-primary-bg' : 'bg-slate-200'}"></div>` : ''}
                          <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 z-10 mt-0.5 ${isCurrent ? 'theme-primary-bg ring-4 ring-indigo-100' : done ? 'theme-primary-bg' : 'bg-slate-200'}">
                            ${done ? `<div class="w-2 h-2 rounded-full bg-white"></div>` : ''}

                          <div class="flex-1 flex items-center justify-between">
                            <span class="text-sm ${isCurrent ? 'font-bold theme-primary-text' : done ? 'font-medium text-slate-800' : 'text-slate-400'}">${escapeHtml(st.name)}</span>
                            ${isCurrent ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full theme-primary-soft">Saat Ini</span>` : ''}
                          </div>
                        </div>

                <!-- Ringkasan Layanan & Biaya -->

                    <span>${formatRupiah(matchedOrder.total)}</span>

                  ${matchedOrder.remainingAmount > 0 ? `
                    <div class="flex justify-between text-amber-700 font-semibold">

                      <span>${formatRupiah(matchedOrder.remainingAmount)}</span>
                    </div>

    let html5QrScannerInstance = null;

    window.appActions = {
      handleLoginSubmit() {
        const emailVal = (document.getElementById('login-email-input')?.value || '').trim().toLowerCase();
        const passVal = (document.getElementById('login-password-input')?.value || '').trim();

        if (!emailVal || !passVal) {
          showToast('Email dan password wajib diisi', 'error');
          return;
        }

        // 1. Cek Login Super Admin
        const sa = state.superAdminAuth || { id: 'usr_super_admin', name: 'Super Admin', email: 'admin', password: 'admin', role: 'SUPER_ADMIN' };
        if (emailVal === String(sa.email).toLowerCase() && passVal === String(sa.password)) {
          state.isAuthenticated = true;
          state.currentUser = {
            id: sa.id || 'usr_super_admin',
            name: sa.name || 'Super Admin',
            email: sa.email,
            role: 'SUPER_ADMIN'
          };
          state.activeTab = 'dashboard';
          state.settingsSubTab = 'superadmin_auth';
          saveStateToStorage();
          renderApp();
          showToast(`Selamat datang, ${state.currentUser.name}`);
          return;
        }

        // 2. Cek Login Owner / Admin yang didaftarkan oleh Super Admin
        const matchedOwner = state.owners.find(
          o => String(o.email || '').trim().toLowerCase() === emailVal && String(o.password || '') === passVal
        );
        if (matchedOwner) {
          if (matchedOwner.status === 'SUSPENDED') {
            showToast('Akun Anda sedang dinonaktifkan. Hubungi Super Admin.', 'error');
            return;
          }
          state.isAuthenticated = true;
          state.activeBusinessId = matchedOwner.businessId;
          state.currentUser = {
            id: matchedOwner.id,
            name: matchedOwner.name,
            email: matchedOwner.email,
            role: matchedOwner.role || 'OWNER',
            businessId: matchedOwner.businessId
          };
          state.activeTab = canAccess('dashboard') ? 'dashboard' : 'orders';
          saveStateToStorage();
          renderApp();
          showToast(`Selamat datang, ${matchedOwner.name} (${state.currentUser.role})`);
          return;
        }

        // 3. Cek Login Karyawan (Admin / Kasir / Operator)
        const matchedEmp = state.employees.find(
          e => String(e.email || '').trim().toLowerCase() === emailVal && String(e.password || '') === passVal
        );
        if (matchedEmp) {
          if (matchedEmp.active === false) {
            showToast('Akun karyawan tidak aktif', 'error');
            return;
          }
          state.isAuthenticated = true;
          state.activeBusinessId = matchedEmp.businessId;
          state.currentUser = {
            id: matchedEmp.id,
            name: matchedEmp.name,
            email: matchedEmp.email,
            role: matchedEmp.role || 'KASIR',
            businessId: matchedEmp.businessId
          };
          state.activeTab = canAccess('dashboard') ? 'dashboard' : 'orders';
          saveStateToStorage();
          renderApp();
          showToast(`Selamat datang, ${matchedEmp.name} (${state.currentUser.role})`);
          return;
        }

        showToast('Email atau password tidak sesuai', 'error');
      },

      logoutUser() {
        state.isAuthenticated = false;
        state.currentUser = null;
        state.mobileSidebarOpen = false;
        state.focusedOrderId = null;
        state.focusedPaymentOrderId = null;
        saveSessionToStorage();
        renderApp();
        showToast('Anda telah keluar dari sistem', 'info');
      },

      setTab(tabId) {
        if (!canAccess(tabId)) {
          showToast('Anda tidak memiliki izin mengakses halaman ini', 'error');
          return;
        }
        state.activeTab = tabId;
        state.mobileSidebarOpen = false;
        state.focusedOrderId = null;
        state.focusedPaymentOrderId = null;
        closeCustomDropdown();
        renderApp();
      },
      toggleMobileSidebar(open) {
        state.mobileSidebarOpen = open;
        renderApp();

      submitQuickOrder() {
        const f = state.quickOrderForm;
        if (!f.customerName.trim()) {
          showToast('Nama pelanggan wajib diisi', 'error');
          return;
        }
        const summary = calculateQuickOrderSummary();
        if (summary.resolvedItems.length === 0 || summary.total <= 0) {
          showToast('Pilih minimal 1 layanan dengan jumlah valid', 'error');
          return;
        }

        const biz = getCurrentBusiness();
        const now = getJakartaNow();
        biz.invoiceCounter = (Number(biz.invoiceCounter) || 0) + 1;
        const seq = String(biz.invoiceCounter).padStart(4, '0');
        const invoiceNumber = `${biz.invoicePrefix || 'LF'}-${now.compactDate}-${seq}`;

        let customerId = f.selectedCustomerId;
        if (!customerId) {
          customerId = 'cust_' + Date.now();
          state.customers.unshift({
            id: customerId,
            businessId: biz.id,
            name: f.customerName.trim(),
            phone: f.customerPhone.trim() || '-',
            address: '',
            notes: ''
          });
        }

        const payStatus = summary.remainingAmount === 0 ? 'LUNAS' : (summary.paidAmount > 0 ? 'DP' : 'BELUM_LUNAS');
        const newOrderId = 'ord_' + Date.now();

        if (!f.selectedCustomerId) {
          const newCustObj = state.customers[0];
          syncRecordToCloud('customers', newCustObj);
        }

        const newOrder = {
          id: newOrderId,
          businessId: biz.id,
          invoiceNumber,
          customerId,
          customerName: f.customerName.trim(),
          customerPhone: f.customerPhone.trim(),
          dateIn: summary.dateIn,
          timeIn: summary.timeIn,
          estimatedDone: summary.estimatedDone,
          items: summary.resolvedItems,
          subtotal: summary.subtotal,
          discount: summary.discount,
          extraFees: summary.extraFees,
          taxAmount: summary.taxAmount,
          total: summary.total,
          paidAmount: summary.paidAmount,
          remainingAmount: summary.remainingAmount,
          paymentStatus: payStatus,
          status: (biz.statuses && biz.statuses[0]) ? biz.statuses[0].name : 'Diterima',
          notes: f.notes,
          createdBy: state.currentUser.name,
          timeline: [{ status: 'Diterima', time: `${summary.dateIn} ${summary.timeIn}`, user: state.currentUser.name }]
        };

        state.orders.unshift(newOrder);
        syncRecordToCloud('orders', newOrder);
        syncRecordToCloud('businesses', biz);

        if (summary.paidAmount > 0) {
          const newPay = {
            id: 'pay_' + Date.now(),
            businessId: biz.id,
            orderId: newOrderId,
            invoiceNumber,
            customerName: newOrder.customerName,
            amount: summary.paidAmount,
            method: f.paymentMethod,
            date: now.dateStr,
            time: now.timeStr,
            note: payStatus === 'LUNAS' ? 'Pelunasan Order Baru' : 'DP Order Baru'
          };
          const newCash = {
            id: 'cash_' + Date.now(),
            businessId: biz.id,
            date: now.dateStr,
            time: now.timeStr,
            ref: invoiceNumber,
            description: `Pemasukan Order ${invoiceNumber} (${newOrder.customerName})`,
            type: 'IN',
            account: f.paymentMethod,
            amount: summary.paidAmount
          };
          state.payments.unshift(newPay);
          state.cashTransactions.unshift(newCash);
          syncRecordToCloud('payments', newPay);
          syncRecordToCloud('cashTransactions', newCash);
        }

        const defaultSrv = state.services.find(s => s.businessId === biz.id && s.active);
        state.quickOrderForm = {
          customerPhone: '',
          customerName: '',
          customerAddress: '',
          customerNotes: '',
          selectedCustomerId: '',
          items: defaultSrv ? [{ id: 'item_' + Date.now(), serviceId: defaultSrv.id, qty: 2, customPrice: null }] : [],
          discount: 0,
          deliveryFee: 0,
          packingFee: 0,
          expressFee: 0,
          applyTax: false,
          paymentOption: 'FULL',
          dpAmount: 0,
          paymentMethod: (biz.paymentMethods && biz.paymentMethods[0]) || 'Tunai',
          customDate: '',
          customTime: '',
          notes: ''
        };

        saveStateToStorage();
        state.activeTab = 'orders';
        state.focusedOrderId = newOrderId;
        renderApp();
        openOrderModal(newOrderId);
        showToast(`Invoice ${invoiceNumber} berhasil dibuat!`);

      openOrderModal,
      openSettleModal,
      confirmSettlement(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return;
        const amt = Math.min(order.remainingAmount, Math.max(0, Number(document.getElementById('settle-amount-input')?.value) || 0));
        const method = document.getElementById('settle-method-input')?.value || 'Tunai';
        if (amt <= 0) {
          showToast('Nominal pelunasan tidak valid', 'error');
          return;
        }
        const now = getJakartaNow();
        order.paidAmount += amt;
        order.remainingAmount = Math.max(0, order.total - order.paidAmount);
        order.paymentStatus = order.remainingAmount === 0 ? 'LUNAS' : 'DP';

        const payRec = {
          id: 'pay_' + Date.now(),
          businessId: order.businessId,
          orderId: order.id,
          invoiceNumber: order.invoiceNumber,
          customerName: order.customerName,
          amount: amt,
          method,
          date: now.dateStr,
          time: now.timeStr,
          note: 'Pelunasan Piutang'
        };

        const cashRec = {
          id: 'cash_' + Date.now(),
          businessId: order.businessId,
          date: now.dateStr,
          time: now.timeStr,
          ref: order.invoiceNumber,
          description: `Pelunasan ${order.invoiceNumber} (${order.customerName})`,
          type: 'IN',
          account: method,
          amount: amt
        };

        state.payments.unshift(payRec);
        state.cashTransactions.unshift(cashRec);
        syncRecordToCloud('orders', order);
        syncRecordToCloud('payments', payRec);
        syncRecordToCloud('cashTransactions', cashRec);

        saveStateToStorage();
        closeModal();
        renderApp();
        showToast(`Pelunasan ${formatRupiah(amt)} tercatat ke buku kas!`);
      },

      // WhatsApp Integration
      sendWhatsAppOrder(orderId, templateKey = 'received') {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return;
        const biz = state.businesses.find(b => b.id === order.businessId) || getCurrentBusiness();
        const rawTpl = (biz.whatsappTemplates && biz.whatsappTemplates[templateKey]) || biz.whatsappTemplates.received;
        const trackingUrl = getTrackingUrl(order.invoiceNumber);

        const msg = rawTpl
          .replace(/\{nama_pelanggan\}/g, order.customerName)
          .replace(/\{no_invoice\}/g, order.invoiceNumber)
          .replace(/\{total\}/g, formatRupiah(order.total))
          .replace(/\{sisa_bayar\}/g, formatRupiah(order.remainingAmount))
          .replace(/\{estimasi\}/g, order.estimatedDone)
          .replace(/\{nama_usaha\}/g, biz.name)
          .replace(/\{link_tracking\}/g, trackingUrl);

        let phone = (order.customerPhone || '').replace(/\D/g, '');
        if (phone.startsWith('0')) phone = '62' + phone.slice(1);
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
      },

      // Scanner Kamera & Manual
      startCameraScanner() {
        if (!window.Html5Qrcode) {
          showToast('Library scanner belum siap, gunakan input manual', 'info');
          return;
        }
        try {
          html5QrScannerInstance = new Html5Qrcode('qr-reader-box');
          html5QrScannerInstance.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 220, height: 140 } },
            (decodedText) => {
              let inv = decodedText.trim();
              if (inv.includes('track=')) {
                try {
                  const u = new URL(inv);
                  inv = u.searchParams.get('track') || inv;
                } catch (e) {}
              }
              this.stopCameraScanner();
              this.lookupInvoiceByCode(inv);
            }
          ).catch(() => {
            showToast('Izin kamera ditolak/tidak tersedia, gunakan pencarian manual', 'error');
          });
        } catch (e) {
          showToast('Kamera tidak tersedia', 'error');
        }
      },
      stopCameraScanner() {
        if (html5QrScannerInstance) {
          html5QrScannerInstance.stop().catch(() => {});
          html5QrScannerInstance = null;
        }
      },
      handleManualInvoiceLookup() {
        const val = document.getElementById('manual-scan-input')?.value || '';
        this.lookupInvoiceByCode(val);
      },
      lookupInvoiceByCode(code) {
        const clean = code.trim().toUpperCase();
        if (!clean) return;
        const found = state.orders.find(o => o.businessId === state.activeBusinessId && o.invoiceNumber.toUpperCase() === clean);
        if (!found) {
          showToast(`Invoice ${clean} tidak ditemukan di cabang ini`, 'error');
          return;
        }
        state.activeTab = 'orders';
        state.focusedOrderId = found.id;
        renderApp();
        showToast(`Invoice ${found.invoiceNumber} ditemukan!`);
      },

            phone,
            role,
            status,
            expiresAt
          };
          const defaultSrv = {
            id: 'srv_' + Date.now(),
            businessId: newBizId,
            name: 'Cuci Komplit Reguler',
            category: 'Kiloan',
            unit: 'Kg',
            price: 7000,
            durationHours: 48,
            active: true
          };
          state.businesses.push(newBiz);
          state.owners.push(newOwner);
          state.services.push(defaultSrv);
          syncRecordToCloud('businesses', newBiz);
          syncRecordToCloud('owners', newOwner);
          syncRecordToCloud('services', defaultSrv);
          showToast('Owner & Tenant baru berhasil didaftarkan');
        }

        saveStateToStorage();
        closeModal();
        renderApp();
      },
      extendOwnerSubscription(ownerId, extraDays = 30) {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        const owner = state.owners.find(o => o.id === ownerId);
        if (!owner) return;
        const today = getJakartaNow().dateStr;
        const baseDate = (owner.expiresAt && owner.expiresAt > today) ? owner.expiresAt : today;
        const newExp = addDaysToDateStr(baseDate, extraDays);
        owner.expiresAt = newExp;
        owner.status = 'ACTIVE';
        syncRecordToCloud('owners', owner);

        const biz = state.businesses.find(b => b.id === owner.businessId);
        if (biz) {
          biz.expiresAt = newExp;
          biz.status = 'ACTIVE';
          syncRecordToCloud('businesses', biz);
        }
        saveStateToStorage();
        renderApp();
        showToast(`Masa aktif ${owner.name} diperpanjang s/d ${formatDisplayDate(newExp)}`);
      },

      // Perpanjang / Pilih Paket oleh Owner/Admin via WA Super Admin
      openRenewPackageModal,
      orderPlanViaWhatsApp(planId) {
        const plan = state.saasPlans.find(p => p.id === planId);
        const biz = getCurrentBusiness();
        const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
        const waPhone = (pb.superAdminWhatsapp || '6281234567890').replace(/\D/g, '').replace(/^0/, '62');
        const msg = `Halo ${pb.superAdminName || 'Super Admin'}, saya *${state.currentUser.name}* dari outlet *${biz.name}* ingin melakukan perpanjangan / aktivasi paket *${plan ? plan.name : biz.plan}* (${plan ? formatRupiah(plan.price) + '/bln' : ''}) pada aplikasi ${pb.platformName}.`;
        closeModal();
        window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
      },

      // Edit Pricing Paket (Khusus Super Admin)
      openEditPlanModal,
      saveSaasPlan(planId) {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        const plan = state.saasPlans.find(p => p.id === planId);
        if (!plan) return;
        const name = (document.getElementById('plan-edit-name')?.value.trim() || plan.name).toUpperCase();
        const price = Math.max(0, Number(document.getElementById('plan-edit-price')?.value) || 0);
        const maxOrders = Math.max(1, Number(document.getElementById('plan-edit-orders')?.value) || 100);
        const maxStaff = Math.max(1, Number(document.getElementById('plan-edit-staff')?.value) || 1);
        Object.assign(plan, { name, price, maxOrders, maxStaff });
        syncGlobalToCloud();
        saveStateToStorage();
        closeModal();
        renderApp();
        showToast(`Paket ${name} berhasil diperbarui`);
      },

      // Branding & Warna Global (Khusus Super Admin)
      async handlePlatformLogoUpload(event) {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        const file = event.target?.files?.[0];
        if (!file) return;
        try {
          state.platformBranding.logoDataUrl = await readImageFileAsDataUrl(file, 240);
          syncGlobalToCloud();
          saveStateToStorage();
          renderApp();
          showToast('Logo utama web berhasil diperbarui');
        } catch (e) {
          showToast('Gagal membaca file gambar', 'error');
        }
      },
      async handlePlatformFaviconUpload(event) {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        const file = event.target?.files?.[0];
        if (!file) return;
        try {
          state.platformBranding.faviconDataUrl = await readImageFileAsDataUrl(file, 96);
          syncGlobalToCloud();
          saveStateToStorage();
          renderApp();
          showToast('Favicon browser berhasil diperbarui');
        } catch (e) {
          showToast('Gagal membaca file favicon', 'error');
        }
      },
      clearPlatformAsset(key) {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        state.platformBranding[key] = '';
        syncGlobalToCloud();
        saveStateToStorage();
        renderApp();
        showToast('Aset gambar dihapus', 'info');
      },
      savePlatformBranding() {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        state.platformBranding.platformName = document.getElementById('sa-brand-name')?.value.trim() || 'SSmart Laundry';
        state.platformBranding.platformTagline = document.getElementById('sa-brand-tagline')?.value.trim() || 'Kelola Laundry tanpa Ribet';
        state.platformBranding.footerText = document.getElementById('sa-brand-footer')?.value.trim() || DEFAULT_PLATFORM_BRANDING.footerText;
        state.platformBranding.primaryColor = document.getElementById('sa-color-primary')?.value || '#4f46e5';
        state.platformBranding.accentColor = document.getElementById('sa-color-accent')?.value || '#06b6d4';
        state.platformBranding.bgColor = document.getElementById('sa-color-bg')?.value || '#f8fafc';
        state.platformBranding.surfaceColor = document.getElementById('sa-color-surface')?.value || '#ffffff';
        state.platformBranding.sidebarColor = document.getElementById('sa-color-sidebar')?.value || '#ffffff';
        syncGlobalToCloud();
        saveStateToStorage();
        renderApp();
        showToast('Tampilan & warna global web berhasil disimpan!');
      },
      resetPlatformBranding() {
        if (state.currentUser.role !== 'SUPER_ADMIN') return;
        state.platformBranding = JSON.parse(JSON.stringify(DEFAULT_PLATFORM_BRANDING));
        syncGlobalToCloud();
        saveStateToStorage();
        renderApp();
        showToast('Tampilan global dikembalikan ke pengaturan awal', 'info');
      },

      // Help Owner -> WhatsApp Super Admin
      contactSuperAdminWhatsApp() {
        const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
        const waPhone = (pb.superAdminWhatsapp || '6281234567890').replace(/\D/g, '').replace(/^0/, '62');
        const msg = document.getElementById('owner-help-message')?.value.trim() || 'Halo Super Admin SSmart Laundry, saya butuh bantuan.';
        window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
      },

      // Portal Klien Publik
      enterPublicPortal() {
        state.publicPortalMode = true;
        state.mobileSidebarOpen = false;
        renderApp();
      },
      exitPublicPortal() {
        state.publicPortalMode = false;
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete('track');
          window.history.replaceState({}, '', url.toString());
        } catch (e) {}
        renderApp();
      },
      openPublicTrackingFor(invoiceNumber) {
        closeModal();
        state.publicPortalMode = true;
        state.publicTrackQuery = invoiceNumber;
        renderApp();
      },
      searchPublicInvoice() {
        const val = document.getElementById('public-track-input')?.value || '';
        state.publicTrackQuery = val.trim();
        renderApp();
      },
      quickTrackDemo(inv) {
        state.publicTrackQuery = inv;
        renderApp();
      },

      closeModal
    };

    // =========================================================================
    // 11. BOOTSTRAP INSTAN & KONEKSI REAL-TIME FIREBASE
    // =========================================================================
    function bootstrapApplication() {
      seedInitialData();
      try {
        const params = new URLSearchParams(window.location.search);
        const trackParam = params.get('track');
        if (trackParam) {
          state.publicPortalMode = true;
          state.publicTrackQuery = trackParam.trim();
        }
      } catch (e) {}

      renderApp();

      if (window.__firebaseBridge) {
        connectToFirebaseRealtime();
      } else {
        window.__onFirebaseBridgeLoaded = () => {
          connectToFirebaseRealtime();
        };
      }
    }

    bootstrapApplication();
  </script>
</body>
</html>
