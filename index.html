    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    function formatRupiah(num) {
      const n = Number(num) || 0;
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');

    function getJakartaNow() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      const dateStr = `${map.year}-${map.month}-${map.day}`;
      const timeStr = `${map.hour}:${map.minute}`;
      const compactDate = `${String(map.year).slice(-2)}${map.month}${map.day}`;
      return { dateStr, timeStr, compactDate };
    }

    function addDaysToDateStr(dateStr, days) {
      const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      if (isNaN(base.getTime())) {
        const now = new Date();
        now.setDate(now.getDate() + Number(days || 0));
        return now.toISOString().slice(0, 10);
      }
      base.setDate(base.getDate() + Number(days || 0));
      return base.toISOString().slice(0, 10);
    }

    function getRemainingDays(expiresAtStr) {
      if (!expiresAtStr) return 30;
      const todayStr = getJakartaNow().dateStr;
      const start = new Date(todayStr + 'T00:00:00');
      const end = new Date(expiresAtStr + 'T00:00:00');
      if (isNaN(end.getTime())) return 30;
      return Math.ceil((end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24));
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function readImageFileAsDataUrl(file, maxSize = 240) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('No file'));
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxSize || h > maxSize) {
              if (w > h) {
                h = Math.round((h * maxSize) / w);
                w = maxSize;
              } else {
                w = Math.round((w * maxSize) / h);
                h = maxSize;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png', 0.9));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      const el = document.createElement('div');

        : type === 'info'

      el.className = `px-4 py-2.5 rounded-2xl shadow-lg text-xs font-semibold flex items-center gap-2 pointer-events-auto animate-page ${tone}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {

    window.__dropdownRegistry = {};

    function openCustomDropdown(id, onChangeAction, actionParam) {
      const wrap = document.getElementById(`dd-wrap-${id}`);
      const layer = document.getElementById('custom-dropdown-layer');
      const options = window.__dropdownRegistry[id] || [];
      if (!wrap || !layer) return;

      const rect = wrap.getBoundingClientRect();
      const isMobile = window.innerWidth < 640;

      layer.classList.remove('hidden');
      layer.onclick = (e) => {
        if (e.target === layer) closeCustomDropdown();
      };

      const menuHtml = options.map(opt => `
        <button type="button"
          onclick="window.appActions.selectDropdownOption('${escapeHtml(onChangeAction)}', '${escapeHtml(String(opt.value))}', '${escapeHtml(String(actionParam))}')"

          </span>
          ${opt.sub ? `<span class="text-[11px] text-slate-400 shrink-0">${escapeHtml(opt.sub)}</span>` : ''}
        </button>
      `).join('');

        layer.innerHTML = `
          <div class="fixed inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-2xl border-t border-slate-200 max-h-[65vh] flex flex-col animate-page">
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">

            </div>
            <div class="overflow-y-auto flex-1">${menuHtml}</div>
          </div>
        `;
      } else {
        const leftPos = Math.min(Math.max(12, rect.left), window.innerWidth - Math.max(240, rect.width) - 12);
        const topPos = Math.min(rect.bottom + 6, window.innerHeight - 260);
        layer.innerHTML = `
          <div style="position:fixed; left:${leftPos}px; top:${topPos}px; width:${Math.max(220, rect.width)}px;"
            class="bg-white rounded-2xl shadow-xl border border-slate-200/90 max-h-64 overflow-y-auto animate-page">
            ${menuHtml}
          </div>
        `;
      }
      activeDropdownState = id;
    }

    function getPublicColRef(colName) {
      return doc(db, 'artifacts', APP_ID, 'public', 'data', 'placeholder', 'init');
    }

    function getCollectionDocRef(colName, docId) {
      return doc(db, 'artifacts', APP_ID, 'public', 'data', colName, String(docId));
    }

    async function syncGlobalToCloud() {
      if (!window.__firebaseBridge || !window.__firebaseBridge.ready) return;
      try {
        await setDoc(getCollectionDocRef('platform_config', 'main'), {
          platformBranding: state.platformBranding,
          superAdminAuth: state.superAdminAuth,
          saasPlans: state.saasPlans,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (err) {
        console.warn('Gagal sinkron platform_config:', err);
      }
    }

    async function syncRecordToCloud(colName, record) {
      if (!window.__firebaseBridge || !window.__firebaseBridge.ready || !record || !record.id) return;
      try {
        await setDoc(getCollectionDocRef(colName, record.id), record, { merge: true });
      } catch (err) {
        console.warn(`Gagal sinkron ${colName}/${record.id}:`, err);
      }
    }

    async function syncAllCollectionsToCloud() {
      if (!window.__firebaseBridge || !window.__firebaseBridge.ready) return;
      await syncGlobalToCloud();
      const mapCols = [
        ['businesses', state.businesses],
        ['owners', state.owners],
        ['employees', state.employees],
        ['services', state.services],
        ['customers', state.customers],
        ['orders', state.orders],
        ['payments', state.payments],
        ['expenses', state.expenses],
        ['cashTransactions', state.cashTransactions]
      ];
      for (const [colName, arr] of mapCols) {
        for (const item of (arr || [])) {
          if (item && item.id) {
            await syncRecordToCloud(colName, item);
          }
        }
      }
    }

    function attachFirestoreListeners() {
      const { collection } = window.__firestoreFns;

      onSnapshot(getCollectionDocRef('platform_config', 'main'), (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data.platformBranding) {
            state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, data.platformBranding);
          }
          if (data.superAdminAuth) {
            state.superAdminAuth = Object.assign({}, DEFAULT_SUPER_ADMIN_AUTH, data.superAdminAuth);
          }
          if (Array.isArray(data.saasPlans) && data.saasPlans.length > 0) {
            state.saasPlans = data.saasPlans;
          }
          saveStateToStorage();
          renderApp();
        } else {
          syncGlobalToCloud();
        }
      }, (err) => {
        console.warn('Firestore platform_config listener error:', err);
      });

      const listCols = [
        ['businesses', 'businesses'],
        ['owners', 'owners'],
        ['employees', 'employees'],
        ['services', 'services'],
        ['customers', 'customers'],
        ['orders', 'orders'],
        ['payments', 'payments'],
        ['expenses', 'expenses'],
        ['cashTransactions', 'cashTransactions']
      ];

      listCols.forEach(([colName, stateKey]) => {
        const colRef = collection(db, 'artifacts', APP_ID, 'public', 'data', colName);
        onSnapshot(colRef, (querySnap) => {
          const items = [];
          querySnap.forEach((d) => {
            items.push(d.data());
          });
          if (items.length > 0) {
            state[stateKey] = items;
            saveStateToStorage();
            renderApp();
          } else if (state[stateKey] && state[stateKey].length > 0) {
            state[stateKey].forEach((rec) => syncRecordToCloud(colName, rec));
          }
        }, (err) => {
          console.warn(`Firestore ${colName} listener error:`, err);
        });
      });
    }

    function connectToFirebaseRealtime() {
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fs) => {
        window.__firestoreFns = fs;
        state.firebaseStatusLabel = 'Menghubungkan Cloud...';
        renderApp();

        signInAnonymously(auth).then(() => {
          state.firebaseConnected = true;
          state.firebaseStatusLabel = 'Cloud Firebase Terhubung';
          window.__firebaseBridge = { ready: true };
          attachFirestoreListeners();
          renderApp();
        }).catch((err) => {
          console.warn('Anonymous sign-in gagal:', err);
          state.firebaseConnected = false;
          state.firebaseStatusLabel = 'Sinkronisasi Lokal';
          window.__firebaseBridge = { ready: false };
          renderApp();
        });

        onAuthStateChanged(auth, (user) => {
          if (user) {
            state.firebaseConnected = true;
            state.firebaseStatusLabel = 'Cloud Firebase Terhubung';
            window.__firebaseBridge = { ready: true };
          }
        });
      });
    }

    function calculateQuickOrderSummary() {
      const biz = getCurrentBusiness();
      const now = getJakartaNow();
      const dateIn = state.quickOrderForm.customDate || now.dateStr;
      const timeIn = state.quickOrderForm.customTime || now.timeStr;

      let maxDuration = 24;
      let subtotal = 0;
      const resolvedItems = [];

      state.quickOrderForm.items.forEach((it) => {
        const srv = state.services.find(s => s.id === it.serviceId) || state.services[0];
        if (!srv) return;
        let qty = Number(it.qty) || 0;
        if (srv.unit === 'Kg' && biz.minWeight && qty > 0 && qty < Number(biz.minWeight)) {
          qty = Number(biz.minWeight);
        }
        const unitPrice = it.customPrice !== null && it.customPrice !== undefined ? Number(it.customPrice) : Number(srv.price);
        const lineSub = Math.round(qty * unitPrice);
        subtotal += lineSub;
        if (Number(srv.durationHours) > maxDuration) {
          maxDuration = Number(srv.durationHours);
        }
        resolvedItems.push({
          serviceId: srv.id,
          name: srv.name,
          unit: srv.unit,
          qty,
          price: unitPrice,
          subtotal: lineSub
        });
      });

      const discount = Math.max(0, Number(state.quickOrderForm.discount) || 0);
      const extraFees = Math.max(0, Number(state.quickOrderForm.deliveryFee) || 0)
        + Math.max(0, Number(state.quickOrderForm.packingFee) || 0)
        + Math.max(0, Number(state.quickOrderForm.expressFee) || 0);
      const taxableBase = Math.max(0, subtotal - discount + extraFees);
      const taxRate = state.quickOrderForm.applyTax ? (Number(biz.taxRate) || 0) : 0;
      const taxAmount = Math.round((taxableBase * taxRate) / 100);
      const total = Math.max(0, taxableBase + taxAmount);

      let paidAmount = 0;
      if (state.quickOrderForm.paymentOption === 'FULL') {
        paidAmount = total;
      } else if (state.quickOrderForm.paymentOption === 'DP') {
        paidAmount = Math.min(total, Math.max(0, Number(state.quickOrderForm.dpAmount) || 0));
      } else {
        paidAmount = 0;
      }
      const remainingAmount = Math.max(0, total - paidAmount);

      const daysAdded = Math.max(1, Math.ceil(maxDuration / 24));
      const estimatedDone = `${addDaysToDateStr(dateIn, daysAdded)} ${timeIn}`;

      return {
        resolvedItems,
        subtotal,
        discount,
        extraFees,
        taxAmount,
        total,
        paidAmount,
        remainingAmount,
        dateIn,
        timeIn,
        estimatedDone
      };
    }

    function updateQuickOrderLiveSummaryDOM() {
      const s = calculateQuickOrderSummary();
      const subEl = document.getElementById('qo-summary-subtotal');
      const totEl = document.getElementById('qo-summary-total');
      const remEl = document.getElementById('qo-summary-remaining');
      if (subEl) subEl.textContent = formatRupiah(s.subtotal);
      if (totEl) totEl.textContent = formatRupiah(s.total);
      if (remEl) remEl.textContent = formatRupiah(s.remainingAmount);
    }

                      Nota

          </div>
        </div>
      `;

    // =========================================================================

    function renderOrdersView() {
      const biz = getCurrentBusiness();
      const statusList = biz.statuses || DEFAULT_STATUSES;
      const filterOpts = [{ value: 'ALL', label: 'Semua Status' }, ...statusList.map(s => ({ value: s.name, label: s.name }))];
      registerDropdownOptions('ord_status_filter', filterOpts);

      let list = state.orders.filter(o => o.businessId === biz.id);
      if (state.orderStatusFilter && state.orderStatusFilter !== 'ALL') {
        list = list.filter(o => o.status === state.orderStatusFilter);
      }
      if (state.globalSearch.trim()) {
        const q = state.globalSearch.toLowerCase();
        list = list.filter(o =>
          (o.invoiceNumber || '').toLowerCase().includes(q)
          || (o.customerName || '').toLowerCase().includes(q)
        );
      }

      if (state.focusedOrderId) {
        list = list.filter(o => o.id === state.focusedOrderId);
      }

      return `
        <div class="space-y-5 animate-page">
          ${renderSubscriptionExpiryBanner()}

          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Order Laundry</h1>
              <p class="text-xs sm:text-sm text-slate-500">Klik <strong>Detail</strong> untuk memfokuskan satu order dan menyembunyikan kotak lainnya.</p>
            </div>
            <div class="w-full sm:w-52">
              ${renderCustomDropdown({
                id: 'ord_status_filter',
                value: state.orderStatusFilter,
                options: filterOpts,
                onChangeAction: 'setOrderStatusFilter',
                compact: true
              })}
            </div>
          </div>

          ${state.focusedOrderId ? `
            <div class="flex items-center justify-between px-4 py-2.5 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900">
              <span class="font-semibold">Mode Fokus Detail Aktif — kotak order lain disembunyikan.</span>
              <button type="button" onclick="window.appActions.toggleFocusOrder('${state.focusedOrderId}')"

              </button>
            </div>

          <div class="space-y-3">
            ${list.length === 0 ? `
              <div class="bg-white rounded-2xl p-8 text-center border border-slate-200/80 text-sm text-slate-500">

              </div>
            ` : list.map(o => {
              const isFocused = state.focusedOrderId === o.id;
              const ddId = `ord_st_${o.id}`;
              registerDropdownOptions(ddId, statusList.map(s => ({ value: s.name, label: s.name })));

              return `
                <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-2xs space-y-4">

                    <button type="button" onclick="window.appActions.toggleFocusOrder('${o.id}')"
                      class="px-3.5 py-2 rounded-xl text-xs font-bold ${isFocused ? 'bg-slate-900 text-white' : 'theme-primary-soft'}">
                      ${isFocused ? 'Tutup Detail' : 'Detail'}
                    </button>
                  </div>

                  ${isFocused ? `
                    <div class="pt-4 border-t border-slate-100 space-y-4 animate-page">
                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                        <div class="p-3 rounded-xl bg-slate-50">
                          <div class="text-slate-400">Tanggal Masuk</div>
                          <div class="font-bold text-slate-800 mt-0.5">${escapeHtml(o.dateIn)} ${escapeHtml(o.timeIn)}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-slate-50">
                          <div class="text-slate-400">Estimasi Selesai</div>
                          <div class="font-bold text-slate-800 mt-0.5">${escapeHtml(o.estimatedDone)}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-slate-50">
                          <div class="text-slate-400">Total Tagihan</div>
                          <div class="font-extrabold text-slate-900 mt-0.5 tabular-nums">${formatRupiah(o.total)}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-slate-50">
                          <div class="text-slate-400">Sisa Bayar</div>
                          <div class="font-extrabold text-rose-600 mt-0.5 tabular-nums">${formatRupiah(o.remainingAmount)}</div>
                        </div>
                      </div>

                      <div class="space-y-1.5">
                        <div class="text-xs font-bold text-slate-700">Rincian Item</div>
                        ${(o.items || []).map(it => `
                          <div class="flex justify-between text-xs py-1.5 px-3 rounded-lg bg-slate-50/80">

                            options: statusList.map(s => ({ value: s.name, label: s.name })),

        </div>

    function renderApp() {
      applyPlatformBranding();

      if (state.publicPortalMode) {
        document.getElementById('app-root').innerHTML = renderPublicClientPortalView();
        return;
      }

      if (!state.isAuthenticated || !state.currentUser || !state.currentUser.role) {
        document.getElementById('app-root').innerHTML = renderLoginView();
        return;
      }

      const biz = getCurrentBusiness();
      const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});

      if (!canAccess(state.activeTab)) {
        state.activeTab = state.currentUser.role === 'OPERATOR' ? 'orders' : 'dashboard';
      }

      const navItems = [
        { id: 'dashboard', label: state.currentUser.role === 'SUPER_ADMIN' ? 'Dashboard Owner' : 'Dashboard' },
        { id: 'quick_order', label: 'Transaksi / Kasir' },
        { id: 'orders', label: 'Order Laundry' },
        { id: 'scan_invoice', label: 'Scan Invoice' },
        { id: 'customers', label: 'Pelanggan' },
        { id: 'payments', label: 'Pembayaran & Piutang' },
        { id: 'expenses', label: 'Pengeluaran' },
        { id: 'reports', label: 'Laporan Keuangan' },
        { id: 'services', label: 'Layanan & Tarif' },
        { id: 'employees', label: 'Karyawan' },
        { id: 'super_admin', label: 'Super Admin SaaS' },
        { id: 'settings', label: 'Pengaturan' },
        { id: 'guide', label: 'Panduan' },
        { id: 'help', label: 'Help (WA)' }
      ].filter(item => canAccess(item.id));

      const allowedBusinesses = state.currentUser.role === 'SUPER_ADMIN'
        ? state.businesses
        : state.businesses.filter(b => b.id === state.currentUser.businessId);

      const businessOptions = allowedBusinesses.map(b => ({
        value: b.id,
        label: b.name,
        sub: `Paket ${b.plan}`
      }));
      registerDropdownOptions('sidebar_biz_select', businessOptions);

      let mainContent = '';
      switch (state.activeTab) {
        case 'dashboard': mainContent = renderDashboardView(); break;
        case 'quick_order': mainContent = renderQuickOrderView(); break;
        case 'orders': mainContent = renderOrdersView(); break;
        case 'scan_invoice': mainContent = renderScanInvoiceView(); break;
        case 'customers': mainContent = renderCustomersView(); break;
        case 'payments': mainContent = renderPaymentsView(); break;
        case 'expenses': mainContent = renderExpensesView(); break;
        case 'reports': mainContent = renderReportsView(); break;
        case 'services': mainContent = renderServicesView(); break;
        case 'employees': mainContent = renderEmployeesView(); break;
        case 'super_admin': mainContent = renderSuperAdminView(); break;
        case 'settings': mainContent = renderSettingsView(); break;
        case 'guide': mainContent = renderGuideView(); break;
        case 'help': mainContent = renderOwnerHelpView(); break;
        default: mainContent = renderDashboardView();

          state.isAuthenticated = true;
          state.currentUser = {
            id: sa.id || 'usr_super_admin',
            name: sa.name || 'Super Admin',
            email: sa.email,
            role: 'SUPER_ADMIN',
            businessId: state.activeBusinessId || 'biz_ssmart_01'

          state.activeTab = 'dashboard';
          saveSessionToStorage();
          showToast('Berhasil masuk sebagai Super Admin');
          renderApp();
          return;

        const matchedOwner = state.owners.find(o =>
          String(o.email || '').trim().toLowerCase() === emailInput &&
          String(o.password || '') === passInput
        );
        if (matchedOwner) {
          if (matchedOwner.status === 'SUSPENDED') {
            showToast('Akun sedang dinonaktifkan oleh Super Admin', 'error');
            return;

          state.isAuthenticated = true;
          state.activeBusinessId = matchedOwner.businessId || state.activeBusinessId;

          state.activeTab = 'dashboard';

          showToast(`Selamat datang, ${matchedOwner.name}`);
          renderApp();
          return;

        const matchedEmp = state.employees.find(e =>

          state.activeBusinessId = matchedEmp.businessId || state.activeBusinessId;

      submitQuickOrder() {
        const biz = getCurrentBusiness();

        if (!custName) {
          showToast('Nama pelanggan wajib diisi', 'error');

        if (summary.resolvedItems.length === 0) {
          showToast('Pilih minimal satu layanan laundry', 'error');
          return;

        const now = getJakartaNow();
        const nextCounter = (Number(biz.invoiceCounter) || 1);
        biz.invoiceCounter = nextCounter + 1;
        const invoiceNumber = `${biz.invoicePrefix || 'LF'}-${now.compactDate}-${String(nextCounter).padStart(4, '0')}`;

        let custId = state.quickOrderForm.selectedCustomerId;
        const cleanPhone = (state.quickOrderForm.customerPhone || '').trim();
        if (!custId) {
          const existingCust = state.customers.find(c => c.businessId === biz.id && c.name.toLowerCase() === custName.toLowerCase());
          if (existingCust) {
            custId = existingCust.id;
          } else {
            custId = 'cust_' + Date.now();
            const newCust = {
              id: custId,
              businessId: biz.id,
              name: custName,
              phone: cleanPhone || '-',
              address: state.quickOrderForm.customerAddress || '',
              notes: state.quickOrderForm.notes || ''
            };
            state.customers.unshift(newCust);
            syncRecordToCloud('customers', newCust);
          }
        }

        const paymentStatus = summary.remainingAmount <= 0 ? 'LUNAS' : (summary.paidAmount > 0 ? 'DP' : 'BELUM_LUNAS');
        const orderId = 'ord_' + Date.now();

        const newOrder = {
          id: orderId,
          businessId: biz.id,
          invoiceNumber,
          customerId: custId,
          customerName: custName,
          customerPhone: cleanPhone || '-',
          dateIn: summary.dateIn,
          timeIn: summary.timeIn,
          estimatedDone: summary.estimatedDone,
          items: summary.resolvedItems,
          subtotal: summary.subtotal,
          discount: summary.discount,
          extraFees: summary.extraFees,
          taxAmount: summary.taxAmount,
          total: summary.total,
          paidAmount: summary.paidAmount,
          remainingAmount: summary.remainingAmount,
          paymentStatus,
          status: 'Diterima',
          notes: state.quickOrderForm.notes || '',
          createdBy: state.currentUser.name,
          timeline: [{ status: 'Diterima', time: `${summary.dateIn} ${summary.timeIn}`, user: state.currentUser.name }]
        };

        state.orders.unshift(newOrder);
        syncRecordToCloud('orders', newOrder);
        syncRecordToCloud('businesses', biz);

        if (summary.paidAmount > 0) {
          const payRec = {
            id: 'pay_' + Date.now(),
            businessId: biz.id,
            orderId,
            invoiceNumber,
            customerName: custName,
            amount: summary.paidAmount,
            method: state.quickOrderForm.paymentMethod || 'Tunai',
            date: summary.dateIn,
            time: summary.timeIn,
            note: paymentStatus === 'LUNAS' ? 'Pembayaran Lunas' : 'Pembayaran DP'

          const cashRec = {
            id: 'cash_' + Date.now(),
            businessId: biz.id,
            date: summary.dateIn,
            time: summary.timeIn,
            ref: invoiceNumber,
            description: `Pemasukan Order ${invoiceNumber} (${custName})`,
            type: 'IN',
            account: state.quickOrderForm.paymentMethod || 'Tunai',
            amount: summary.paidAmount

          state.payments.unshift(payRec);
          state.cashTransactions.unshift(cashRec);
          syncRecordToCloud('payments', payRec);
          syncRecordToCloud('cashTransactions', cashRec);

        const firstSrv = state.services.find(s => s.businessId === biz.id && s.active);
        state.quickOrderForm = {
          customerPhone: '',
          customerName: '',
          customerAddress: '',
          customerNotes: '',

      sendWhatsAppOrder(orderId, tplType = 'received') {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return;
        const biz = state.businesses.find(b => b.id === order.businessId) || getCurrentBusiness();
        const rawPhone = (order.customerPhone || '').replace(/\D/g, '');
        if (!rawPhone || rawPhone.length < 8) {
          showToast('Nomor WhatsApp pelanggan belum valid', 'error');
          return;
        }
        const formattedPhone = rawPhone.startsWith('0') ? '62' + rawPhone.slice(1) : rawPhone;
        const tplMap = biz.whatsappTemplates || {};
        const rawTpl = tplMap[tplType] || tplMap.received || 'Halo *{nama_pelanggan}*, invoice *{no_invoice}* total *{total}*. Cek: {link_tracking}';
        const msg = rawTpl
          .replace(/\{nama_pelanggan\}/g, order.customerName)
          .replace(/\{no_invoice\}/g, order.invoiceNumber)
          .replace(/\{total\}/g, formatRupiah(order.total))
          .replace(/\{sisa_bayar\}/g, formatRupiah(order.remainingAmount))
          .replace(/\{estimasi\}/g, order.estimatedDone)
          .replace(/\{nama_usaha\}/g, biz.name)
          .replace(/\{link_tracking\}/g, getTrackingUrl(order.invoiceNumber));

        window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');

          return;

        const srvRec = { id: 'srv_' + Date.now(), businessId: biz.id, name, category, unit, price, durationHours, active: true };
        state.services.push(srvRec);
        saveStateToStorage();
        syncRecordToCloud('services', srvRec);
        closeModal();
        showToast('Layanan baru ditambahkan');
        renderApp();
      },

      openEditServiceModal(serviceId) {
        openEditServiceModal(serviceId);
      },

      saveEditedService(serviceId) {
        const srv = state.services.find(s => s.id === serviceId);
        if (!srv) return;
        srv.name = (document.getElementById('edit-srv-name').value || srv.name).trim();
        srv.price = Number(document.getElementById('edit-srv-price').value) || srv.price;
        srv.durationHours = Number(document.getElementById('edit-srv-duration').value) || srv.durationHours;
        saveStateToStorage();
        syncRecordToCloud('services', srv);
        closeModal();
        showToast('Tarif layanan diperbarui');
        renderApp();
      },

      openAddEmployeeModal() {
        openAddEmployeeModal();
      },

      saveEmployee() {
        const biz = getCurrentBusiness();
        const name = (document.getElementById('emp-name').value || '').trim();
        const email = (document.getElementById('emp-email').value || '').trim();
        const password = (document.getElementById('emp-password').value || '').trim();
        const phone = (document.getElementById('emp-phone').value || '').trim();
        const role = document.getElementById('emp-role').value || 'KASIR';
        if (!name || !email || !password) {
          showToast('Nama, email login, dan password wajib diisi', 'error');
          return;
        }
        const empRec = { id: 'emp_' + Date.now(), businessId: biz.id, name, email, password, phone, role, active: true };
        state.employees.push(empRec);
        saveStateToStorage();
        syncRecordToCloud('employees', empRec);
        closeModal();
        showToast('Karyawan & akun login ditambahkan');
        renderApp();
      },

      openOwnerModal(ownerId) {
        openOwnerModal(ownerId);
      },

      quickAddOwnerExpDays(days) {
        const input = document.getElementById('own-form-expires');
        if (!input) return;
        const baseDate = input.value || getJakartaNow().dateStr;
        input.value = addDaysToDateStr(baseDate, days);
      },

      extendOwnerSubscription(ownerId, days = 30) {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') {
          showToast('Hanya Super Admin yang dapat memperpanjang masa aktif', 'error');
          return;
        }
        const owner = state.owners.find(o => o.id === ownerId);
        if (!owner) return;
        const todayStr = getJakartaNow().dateStr;
        const baseStr = owner.expiresAt && owner.expiresAt >= todayStr ? owner.expiresAt : todayStr;
        const newExp = addDaysToDateStr(baseStr, days);
        owner.expiresAt = newExp;
        const tenant = state.businesses.find(b => b.id === owner.businessId);
        if (tenant) {
          tenant.expiresAt = newExp;
          syncRecordToCloud('businesses', tenant);
        }
        saveStateToStorage();
        syncRecordToCloud('owners', owner);
        showToast(`Masa aktif ${owner.name} diperpanjang +${days} hari (s/d ${formatDisplayDate(newExp)})`);
        renderApp();
      },

      saveOwnerAccount(existingOwnerId) {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') {
          showToast('Hanya Super Admin yang dapat menyimpan data Owner', 'error');
          return;
        }
        const name = (document.getElementById('own-form-name').value || '').trim();
        const phone = (document.getElementById('own-form-phone').value || '').trim();
        const email = (document.getElementById('own-form-email').value || '').trim();
        const password = (document.getElementById('own-form-password').value || '').trim();
        const role = document.getElementById('own-form-role').value || 'OWNER';
        const status = document.getElementById('own-form-status').value || 'ACTIVE';
        const expiresAt = document.getElementById('own-form-expires').value || addDaysToDateStr(getJakartaNow().dateStr, 30);
        const bizName = (document.getElementById('own-form-bizname').value || '').trim();
        const plan = document.getElementById('own-form-plan').value || 'STARTER';
        const address = (document.getElementById('own-form-address').value || '').trim();

        if (!name || !email || !password || !bizName) {
          showToast('Nama owner, email, password, dan nama usaha wajib diisi', 'error');
          return;
        }

        if (existingOwnerId) {
          const owner = state.owners.find(o => o.id === existingOwnerId);
          if (owner) {
            owner.name = name;
            owner.phone = phone;
            owner.email = email;
            owner.password = password;
            owner.role = role;
            owner.status = status;
            owner.expiresAt = expiresAt;
            syncRecordToCloud('owners', owner);

            const biz = state.businesses.find(b => b.id === owner.businessId);
            if (biz) {
              biz.name = bizName;
              biz.plan = plan;
              biz.address = address;
              biz.expiresAt = expiresAt;
              syncRecordToCloud('businesses', biz);
            }
          }
          showToast('Data Owner & Tenant berhasil diperbarui');
        } else {
          const newBizId = 'biz_' + Date.now();
          const newOwnerId = 'own_' + Date.now();
          const prefix = bizName.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'LDY';

          const newBiz = {
            id: newBizId,
            name: bizName,
            logoDataUrl: '',
            tagline: 'Kelola Laundry tanpa Ribet',
            address: address || 'Indonesia',
            phone: phone || '6281234567890',
            invoicePrefix: prefix,
            invoiceCounter: 1,
            minWeight: 1,
            weightRounding: '0.1',
            taxRate: 0,
            paperSize: '58mm',
            footerNote: 'Terima kasih telah menggunakan layanan kami.',
            plan,
            status,
            expiresAt,
            statuses: JSON.parse(JSON.stringify(DEFAULT_STATUSES)),
            paymentMethods: ['Tunai', 'QRIS', 'Transfer Bank'],
            expenseCategories: ['Deterjen', 'Pewangi', 'Listrik', 'Gaji', 'Lain-lain'],
            whatsappTemplates: {
              received: 'Halo *{nama_pelanggan}*, order *{no_invoice}* di *{nama_usaha}* diterima. Total *{total}*. Cek: {link_tracking}',
              ready: 'Halo *{nama_pelanggan}*, cucian *{no_invoice}* sudah siap diambil. Cek: {link_tracking}',
              reminder: 'Halo *{nama_pelanggan}*, sisa tagihan *{no_invoice}*: *{sisa_bayar}*.'
            }
          };

          const newOwner = {
            id: newOwnerId,
            businessId: newBizId,
            name,
            email,
            password,
            phone,
            role,
            status,
            expiresAt
          };

          const defaultSrv = {
            id: 'srv_' + Date.now(),
            businessId: newBizId,
            name: 'Cuci Komplit',
            category: 'Kiloan',
            unit: 'Kg',
            price: 7000,
            durationHours: 48,
            active: true
          };

          state.businesses.push(newBiz);
          state.owners.push(newOwner);
          state.services.push(defaultSrv);
          syncRecordToCloud('businesses', newBiz);
          syncRecordToCloud('owners', newOwner);
          syncRecordToCloud('services', defaultSrv);
          showToast('Owner & Tenant baru berhasil didaftarkan');
        }

        saveStateToStorage();
        closeModal();
        renderApp();
      },

      saveSuperAdminCredentials() {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') return;
        const name = (document.getElementById('sa-auth-name').value || 'Super Admin').trim();
        const email = (document.getElementById('sa-auth-email').value || '').trim();
        const password = (document.getElementById('sa-auth-password').value || '').trim();
        if (!email || !password) {
          showToast('Email/username dan password Super Admin wajib diisi', 'error');
          return;
        }
        state.superAdminAuth = {
          id: 'usr_super_admin',
          name,
          email,
          password,
          role: 'SUPER_ADMIN'
        };
        if (state.currentUser.id === 'usr_super_admin') {
          state.currentUser.name = name;
          state.currentUser.email = email;
        }
        saveStateToStorage();
        syncGlobalToCloud();
        showToast('Kredensial Super Admin disimpan ke Firebase');
        renderApp();
      },

      saveSuperAdminSupportWa() {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') return;
        const saName = (document.getElementById('set-sa-name').value || 'Tim Support SSmart Laundry').trim();
        const saWa = (document.getElementById('set-sa-wa').value || '').trim();
        state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {}, {
          superAdminName: saName,
          superAdminWhatsapp: saWa
        });
        saveStateToStorage();
        syncGlobalToCloud();
        showToast('Kontak WhatsApp Super Admin diperbarui');
        renderApp();
      },

      contactSuperAdminWhatsApp() {
        const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
        const waClean = (pb.superAdminWhatsapp || '6281234567890').replace(/\D/g, '').replace(/^0/, '62');
        const msgEl = document.getElementById('owner-help-message');
        const text = msgEl ? msgEl.value.trim() : `Halo ${pb.superAdminName || 'Super Admin'}, saya butuh bantuan terkait ${pb.platformName}.`;
        window.open(`https://wa.me/${waClean}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
      },

      openRenewPackageModal() {
        openRenewPackageModal();
      },

      orderPlanViaWhatsApp(planId) {
        const plan = state.saasPlans.find(p => p.id === planId);
        if (!plan) return;
        const biz = getCurrentBusiness();
        const pb = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
        const waClean = (pb.superAdminWhatsapp || '6281234567890').replace(/\D/g, '').replace(/^0/, '62');
        const text = `Halo ${pb.superAdminName || 'Super Admin'}, saya *${state.currentUser.name}* (${state.currentUser.role}) dari outlet *${biz.name}* ingin memperpanjang / memilih paket *${plan.name}* (${formatRupiah(plan.price)}/bulan) pada platform *${pb.platformName}*.`;
        window.open(`https://wa.me/${waClean}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
      },

      openEditPlanModal(planId) {
        openEditPlanModal(planId);
      },

      saveEditedPlan(planId) {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') {
          showToast('Hanya role Super Admin yang dapat mengubah paket harga', 'error');
          return;
        }
        const plan = state.saasPlans.find(p => p.id === planId);
        if (!plan) return;
        const name = (document.getElementById('edit-plan-name').value || '').trim().toUpperCase();
        const price = Number(document.getElementById('edit-plan-price').value);
        const maxOrders = Number(document.getElementById('edit-plan-orders').value);
        const maxStaff = Number(document.getElementById('edit-plan-staff').value);
        if (!name || isNaN(price) || price < 0) {
          showToast('Nama paket dan harga wajib valid', 'error');
          return;
        }
        plan.name = name;
        plan.price = price;
        plan.maxOrders = maxOrders > 0 ? maxOrders : plan.maxOrders;
        plan.maxStaff = maxStaff > 0 ? maxStaff : plan.maxStaff;
        saveStateToStorage();
        syncGlobalToCloud();
        closeModal();
        showToast(`Paket ${plan.name} berhasil diperbarui`);
        renderApp();
      },

      async handlePlatformLogoUpload(event) {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') return;
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const dataUrl = await readImageFileAsDataUrl(file, 240);
        state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {}, { logoDataUrl: dataUrl });
        saveStateToStorage();
        syncGlobalToCloud();
        applyPlatformBranding();
        showToast('Logo utama web diperbarui');
        renderApp();
      },

      async handlePlatformFaviconUpload(event) {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') return;
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const dataUrl = await readImageFileAsDataUrl(file, 64);
        state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {}, { faviconDataUrl: dataUrl });
        saveStateToStorage();
        syncGlobalToCloud();
        applyPlatformBranding();
        showToast('Favicon web diperbarui');
        renderApp();
      },

      clearPlatformAsset(key) {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') return;
        state.platformBranding = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {}, { [key]: '' });
        saveStateToStorage();
        syncGlobalToCloud();
        applyPlatformBranding();
        showToast('Aset web dihapus');
        renderApp();
      },

      savePlatformBranding() {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') {
          showToast('Hanya Super Admin yang dapat mengatur tampilan global web', 'error');
          return;
        }
        const prev = Object.assign({}, DEFAULT_PLATFORM_BRANDING, state.platformBranding || {});
        state.platformBranding = {
          platformName: (document.getElementById('sa-brand-name').value || 'SSmart Laundry').trim(),
          platformTagline: (document.getElementById('sa-brand-tagline').value || 'Kelola Laundry tanpa Ribet').trim(),
          footerText: (document.getElementById('sa-brand-footer').value || '').trim(),
          primaryColor: document.getElementById('sa-color-primary').value || '#4f46e5',
          accentColor: document.getElementById('sa-color-accent').value || '#06b6d4',
          bgColor: document.getElementById('sa-color-bg').value || '#f8fafc',
          surfaceColor: document.getElementById('sa-color-surface').value || '#ffffff',
          sidebarColor: document.getElementById('sa-color-sidebar').value || '#ffffff',
          logoDataUrl: prev.logoDataUrl || '',
          faviconDataUrl: prev.faviconDataUrl || '',
          superAdminWhatsapp: prev.superAdminWhatsapp || '6281234567890',
          superAdminName: prev.superAdminName || 'Tim Support SSmart Laundry'
        };
        saveStateToStorage();
        syncGlobalToCloud();
        applyPlatformBranding();
        showToast('Seluruh warna, identitas & footer web disimpan');
        renderApp();
      },

      resetPlatformBranding() {
        if (!state.currentUser || state.currentUser.role !== 'SUPER_ADMIN') return;
        state.platformBranding = JSON.parse(JSON.stringify(DEFAULT_PLATFORM_BRANDING));
        saveStateToStorage();
        syncGlobalToCloud();
        applyPlatformBranding();
        showToast('Tampilan web dikembalikan ke pengaturan default');
        renderApp();
      },

      async handleBusinessLogoUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const biz = getCurrentBusiness();
        biz.logoDataUrl = await readImageFileAsDataUrl(file, 220);
        saveStateToStorage();
        syncRecordToCloud('businesses', biz);
        showToast('Logo bisnis untuk nota berhasil diunggah');
        renderApp();
      },

      removeBusinessLogo() {
        const biz = getCurrentBusiness();
        biz.logoDataUrl = '';
        saveStateToStorage();
        syncRecordToCloud('businesses', biz);
        showToast('Logo bisnis dihapus');
        renderApp();
      },

      saveProfileSettings() {
        const biz = getCurrentBusiness();
        biz.name = (document.getElementById('set-biz-name').value || biz.name).trim();
        biz.phone = (document.getElementById('set-biz-phone').value || biz.phone).trim();
        biz.invoicePrefix = (document.getElementById('set-biz-prefix').value || biz.invoicePrefix).trim().toUpperCase();
        biz.address = (document.getElementById('set-biz-address').value || biz.address).trim();
        biz.footerNote = (document.getElementById('set-biz-footer').value || '').trim();
        saveStateToStorage();
        syncRecordToCloud('businesses', biz);
        showToast('Profil & pengaturan nota disimpan');
        renderApp();
      },

      saveRuleSettings() {
        const biz = getCurrentBusiness();
        biz.minWeight = Number(document.getElementById('set-min-weight').value) || 0;
        biz.taxRate = Number(document.getElementById('set-tax-rate').value) || 0;
        saveStateToStorage();
        syncRecordToCloud('businesses', biz);
        showToast('Aturan berat & pajak disimpan');
        renderApp();
      },

      saveStatusSettings() {
        const biz = getCurrentBusiness();
        const inputs = document.querySelectorAll('.status-name-input');
        const current = biz.statuses || DEFAULT_STATUSES;
        inputs.forEach((inp) => {
          const idx = Number(inp.getAttribute('data-status-idx'));
          if (current[idx] && inp.value.trim()) {
            current[idx].name = inp.value.trim();
          }
        });
        biz.statuses = current;
        saveStateToStorage();
        syncRecordToCloud('businesses', biz);
        showToast('Urutan status cucian disimpan');
        renderApp();
      },

      saveWhatsappSettings() {
        const biz = getCurrentBusiness();
        biz.whatsappTemplates = biz.whatsappTemplates || {};
        biz.whatsappTemplates.received = document.getElementById('set-wa-received').value;
        biz.whatsappTemplates.ready = document.getElementById('set-wa-ready').value;
        saveStateToStorage();
        syncRecordToCloud('businesses', biz);
        showToast('Template WhatsApp disimpan');
        renderApp();
      },

      startCameraScanner() {
        const box = document.getElementById('qr-reader-box');
        if (!box || !window.Html5Qrcode) {
          showToast('Scanner kamera tidak tersedia di perangkat ini', 'error');
          return;
        }
        if (html5QrScannerInstance) {
          this.stopCameraScanner();
        }
        const scanner = new Html5Qrcode('qr-reader-box');
        html5QrScannerInstance = scanner;
        scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            let invoice = decodedText.trim();
            try {
              const u = new URL(decodedText);
              const t = u.searchParams.get('track');
              if (t) invoice = t;
            } catch (e) {}
            this.stopCameraScanner();
            const found = state.orders.find(o => o.invoiceNumber.toUpperCase() === invoice.toUpperCase());
            if (found) {
              openOrderModal(found.id);
            } else {
              showToast(`Invoice ${invoice} tidak ditemukan`, 'error');
            }
          },
          () => {}
        ).catch(() => {
          showToast('Izinkan akses kamera pada browser untuk memindai', 'error');
        });
      },

      stopCameraScanner() {
        if (html5QrScannerInstance) {
          html5QrScannerInstance.stop().then(() => {
            html5QrScannerInstance.clear();
            html5QrScannerInstance = null;
          }).catch(() => {
            html5QrScannerInstance = null;
          });
        }
      },

      handleManualInvoiceLookup() {
        const inp = document.getElementById('manual-scan-input');
        const code = (inp ? inp.value : '').trim().toUpperCase();
        if (!code) {
          showToast('Masukkan nomor invoice terlebih dahulu', 'error');
          return;
        }
        const found = state.orders.find(o => o.invoiceNumber.toUpperCase() === code);
        if (found) {
          openOrderModal(found.id);
        } else {
          showToast(`Invoice ${code} tidak ditemukan`, 'error');
        }
      }
    };

    // =========================================================================
    // 12. INISIALISASI APLIKASI
    // =========================================================================
    function bootstrapApplication() {
      seedInitialData();
      try {
        const params = new URLSearchParams(window.location.search);
        const trackParam = params.get('track');
        if (trackParam) {
          state.publicTrackQuery = trackParam.trim();
          state.publicPortalMode = true;
        }
      } catch (e) {}

      renderApp();
      connectToFirebaseRealtime();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapApplication);
    } else {
      bootstrapApplication();
    }
  </script>
</body>
