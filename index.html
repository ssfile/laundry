    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatRp(num) {
      const val = Number(num) || 0;
      return "Rp " + val.toLocaleString("id-ID");
    }

    function formatDateId(isoStr) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
    }

    function formatDateTimeId(isoStr) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function sanitizeWaPhone(phone) {
      let digits = String(phone || "").replace(/\D/g, "");
      if (digits.startsWith("0")) digits = "62" + digits.slice(1);
      if (digits && !digits.startsWith("62")) digits = "62" + digits;
      return digits;
    }

    function hexToRgba(hex, alpha) {
      const clean = String(hex || "#0284c7").replace("#", "");
      if (clean.length !== 6) return `rgba(2, 132, 199, ${alpha})`;
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function showToast(message, type = "info") {
      const root = document.getElementById("toast-root");
      if (!root) return;

      const badgeStyle = {

      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-200 ${badgeStyle}`;

        }
      }, 3600);
    }

    function compressImageFile(file, maxWidth = 480, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function parseLocationInput(rawInput, fallbackAddress = "") {
      const trimmed = String(rawInput || "").trim();
      const coordMatch = trimmed.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (coordMatch) {
        const lat = parseFloat(coordMatch[1]);
        const lng = parseFloat(coordMatch[2]);
        if (!isNaN(lat) && !isNaN(lng)) {
          return {
            lat,
            lng,
            mapsUrl: trimmed.startsWith("http") ? trimmed : `https://www.google.com/maps?q=${lat},${lng}`
          };
        }
      }

      if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
        return {
          lat: null,
          lng: null,
          mapsUrl: trimmed
        };
      }

      const queryTarget = trimmed || fallbackAddress;
      return {
        lat: null,
        lng: null,
        mapsUrl: queryTarget ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryTarget)}` : ""
      };
    }

    function buildEmbedMapUrl(lat, lng, address = "", mapsUrl = "") {
      if (typeof lat === "number" && typeof lng === "number" && !isNaN(lat) && !isNaN(lng)) {
        return `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
      }
      const coordFromUrl = String(mapsUrl || "").match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (coordFromUrl) {
        return `https://maps.google.com/maps?q=${coordFromUrl[1]},${coordFromUrl[2]}&z=15&output=embed`;
      }
      const q = encodeURIComponent(address || mapsUrl || "Jakarta, Indonesia");
      return `https://maps.google.com/maps?q=${q}&z=14&output=embed`;
    }

    // --- STORAGE & CLOUD SYNC ---
    function getOwnerForBusiness(bizId) {
      const biz = state.businesses.find(b => b.id === bizId);
      if (biz && biz.ownerId) {
        const directOwner = state.owners.find(o => o.id === biz.ownerId);
        if (directOwner) return directOwner;
      }
      return state.owners.find(o => o.businessId === bizId) || state.owners[0] || null;
    }

    function getSubscriptionState(owner) {
      if (!owner || !owner.expiresAt) {
        return { status: "ACTIVE", daysLeft: 30, graceDaysLeft: 7, isFrozen: false, isPurgeable: false };
      }
      const now = new Date();
      const expEnd = new Date(owner.expiresAt + "T23:59:59");
      const diffMs = expEnd.getTime() - now.getTime();
      const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

      if (daysLeft > 5) {
        return { status: "ACTIVE", daysLeft, graceDaysLeft: 7, isFrozen: false, isPurgeable: false };
      }
      if (daysLeft >= 0) {
        return { status: "EXPIRING_SOON", daysLeft, graceDaysLeft: 7, isFrozen: false, isPurgeable: false };
      }

      const daysPastExpiry = Math.floor(Math.abs(diffMs) / (1000 * 60 * 60 * 24));
      const graceDaysLeft = Math.max(0, 7 - daysPastExpiry);

      if (daysPastExpiry <= 7) {
        return { status: "GRACE_PERIOD", daysLeft: 0, graceDaysLeft, isFrozen: true, isPurgeable: false };
      }

      return { status: "PURGE_DUE", daysLeft: 0, graceDaysLeft: 0, isFrozen: true, isPurgeable: true };
    }

    function assertBusinessOperational() {
      if (!state.currentUser) return false;
      if (state.currentUser.role === "SUPER_ADMIN") return true;
      const owner = getOwnerForBusiness(state.activeBusinessId);
      const sub = getSubscriptionState(owner);
      if (sub.isFrozen) {
        showToast("Transaksi dibekukan! Akun sedang dalam Masa Tenggang 7 hari. Hubungi Super Admin untuk perpanjangan.", "error");
        return false;
      }
      return true;
    }

    function computeCollectionHash(arr) {
      try {
        return JSON.stringify(arr || []);
      } catch (e) {
        return String((arr || []).length);
      }
    }

    function scheduleCloudRender() {
      if (pendingCloudRenderTimer) clearTimeout(pendingCloudRenderTimer);
      pendingCloudRenderTimer = setTimeout(() => {
        pendingCloudRenderTimer = null;
        renderApp();
      }, 120);
    }

    async function initFirebase() {
      try {
        if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey === "AIzaSyCuY0JO7eIFl656y3Nw92sp9N850YBVJEI") {
          // Konfigurasi valid milik proyek ssmart-laundry
        }
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);

        onAuthStateChanged(auth, async (user) => {
          if (user) {

          } else {

      } catch (err) {

      }
    }

    function attachFirestoreListeners() {
      if (!db || listenersAttached) return;
      listenersAttached = true;

      try {
        const configDocRef = doc(db, "artifacts", APP_ID, "public", "data", "platform_config", "main");
        onSnapshot(configDocRef, (snap) => {
          if (snap.exists()) {
            const remoteCfg = snap.data();
            const remoteHash = computeCollectionHash(remoteCfg);
            if (lastSnapshotHashes["platform_config"] !== remoteHash) {
              lastSnapshotHashes["platform_config"] = remoteHash;
              state.platformBranding = {
                ...DEFAULT_PLATFORM_BRANDING,
                ...remoteCfg,
                superAdminAuth: {
                  ...DEFAULT_PLATFORM_BRANDING.superAdminAuth,
                  ...(remoteCfg.superAdminAuth || {})
                },
                plans: {
                  ...DEFAULT_PLATFORM_BRANDING.plans,
                  ...(remoteCfg.plans || {})
                }
              };
              saveStateToStorage();
              scheduleCloudRender();
            }
          }
        }, () => {});
      } catch (e) {}

      const cols = ["businesses", "owners", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"];
      cols.forEach((colName) => {
        try {
          const colRef = collection(db, "artifacts", APP_ID, "public", "data", colName);
          onSnapshot(colRef, (snapshot) => {
            const docs = [];
            snapshot.forEach((d) => docs.push({ id: d.id, ...d.data() }));
            const nextHash = computeCollectionHash(docs);
            if (lastSnapshotHashes[colName] !== nextHash) {
              lastSnapshotHashes[colName] = nextHash;
              if (docs.length > 0 || cloudConnected) {
                state[colName] = docs;
                saveStateToStorage();
                scheduleCloudRender();
              }
            }
          }, () => {});
        } catch (e) {}
      });
    }

    async function syncRecordToCloud(colName, record) {
      saveStateToStorage();
      if (!db || !cloudConnected || !record || !record.id) return;
      try {
        const docRef = doc(db, "artifacts", APP_ID, "public", "data", colName, String(record.id));
        await setDoc(docRef, record, { merge: true });
      } catch (err) {
        console.warn(`Cloud sync error (${colName}):`, err);
      }
    }

    function purgeOwnerDataCascade(ownerId, silent = false) {
      const owner = state.owners.find(o => o.id === ownerId);
      if (!owner) return;
      const ownedBizIds = state.businesses
        .filter(b => b.ownerId === ownerId || b.id === owner.businessId)
        .map(b => b.id);

      state.owners = state.owners.filter(o => o.id !== ownerId);
      deleteRecordFromCloud("owners", ownerId);

      ownedBizIds.forEach(bId => {
        state.businesses = state.businesses.filter(b => b.id !== bId);
        deleteRecordFromCloud("businesses", bId);

        ["employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
          const toDelete = (state[col] || []).filter(item => item.businessId === bId);
          state[col] = (state[col] || []).filter(item => item.businessId !== bId);
          toDelete.forEach(item => deleteRecordFromCloud(col, item.id));
        });
      });

      if (state.currentUser && state.currentUser.ownerId === ownerId) {
        state.currentUser = null;
      }
      saveStateToStorage();
      if (!silent) {
        showToast(`Akun Owner "${owner.name}" & seluruh data cabangnya telah dihapus.`, "warning");
      }
    }

    function autoPurgeExpiredOwners(notify = true) {
      const toPurge = state.owners.filter(o => getSubscriptionState(o).isPurgeable);
      if (toPurge.length > 0) {
        toPurge.forEach(o => purgeOwnerDataCascade(o.id, true));
        if (notify) {
          showToast(`${toPurge.length} akun Owner yang melewati masa tenggang 7 hari otomatis dibersihkan.`, "info");
        }
      }
    }

    function applyThemeVariables() {
      const pb = state.platformBranding;
      const primary = pb.primaryColor || "#0284c7";
      const bgCanvas = pb.bgCanvas || "#f4f7fb";
      const bgSurface = pb.bgSurface || "#ffffff";
      const textPrimary = pb.textPrimary || "#0f172a";

      const themeSig = [pb.appName, primary, bgCanvas, bgSurface, textPrimary, pb.logoUrl, pb.faviconUrl].join("|");
      if (lastThemeSignature !== themeSig) {
        lastThemeSignature = themeSig;
        const root = document.documentElement.style;
        root.setProperty("--brand-primary", primary);
        root.setProperty("--brand-soft", hexToRgba(primary, 0.10));
        root.setProperty("--brand-border", hexToRgba(primary, 0.26));
        root.setProperty("--bg-canvas", bgCanvas);
        root.setProperty("--bg-surface", bgSurface);
        root.setProperty("--text-primary", textPrimary);
        document.title = `${pb.appName} — ${pb.tagline}`;
        if (pb.faviconUrl) {
          const fav = document.getElementById("dynamic-favicon");
          if (fav) fav.href = pb.faviconUrl;
        }
      }

      const manifestSig = `${pb.appName}|${pb.tagline}|${primary}`;
      if (lastManifestSignature !== manifestSig) {
        lastManifestSignature = manifestSig;
        try {
          const manifestObj = {
            name: pb.appName,
            short_name: pb.appName,
            description: pb.tagline,
            start_url: window.location.href.split("#")[0],
            display: "standalone",
            background_color: bgCanvas,
            theme_color: primary,
            icons: [
              {
                src: pb.faviconUrl || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='48' fill='%230284c7'/%3E%3Ccircle cx='96' cy='102' r='48' fill='none' stroke='white' stroke-width='12'/%3E%3C/svg%3E",
                sizes: "192x192",
                type: "image/svg+xml"
              }
            ]
          };
          const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
          const manifestLink = document.getElementById("dynamic-manifest");
          if (manifestLink) {
            if (manifestLink.href && manifestLink.href.startsWith("blob:")) {
              URL.revokeObjectURL(manifestLink.href);
            }
            manifestLink.href = URL.createObjectURL(blob);
          }
        } catch (e) {
          console.warn("Manifest update skipped:", e);
        }
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;

      const sa = state.platformBranding.superAdminAuth;
      if (email === String(sa.email).toLowerCase() && password === sa.password) {
        state.currentUser = { id: sa.id, name: sa.name, email: sa.email, role: "SUPER_ADMIN" };
        state.activeTab = "dashboard";
        saveStateToStorage();
        closeModal();
        showToast("Selamat datang, Super Admin!", "success");
        renderApp({ forceShellRebuild: true });
        return;
      }

      const owner = state.owners.find(o => String(o.email).toLowerCase() === email && o.password === password);
      if (owner) {
        const sub = getSubscriptionState(owner);
        if (sub.isPurgeable) {
          purgeOwnerDataCascade(owner.id, true);
          showToast("Akun Anda telah melewati masa tenggang 7 hari dan dihapus otomatis.", "error");
          return;
        }
        state.currentUser = {
          id: owner.id,
          ownerId: owner.id,
          businessId: owner.businessId,
          name: owner.name,
          email: owner.email,
          role: "OWNER"
        };
        const ownedBiz = getAccessibleBusinesses();
        if (ownedBiz.length > 0) state.activeBusinessId = ownedBiz[0].id;
        state.activeTab = "dashboard";
        saveStateToStorage();
        closeModal();
        showToast(`Halo, ${owner.name}!`, "success");
        renderApp({ forceShellRebuild: true });
        return;
      }

      const emp = state.employees.find(em => String(em.email).toLowerCase() === email && em.password === password);
      if (emp) {
        if (emp.active === false) {
          showToast("Akun karyawan Anda sedang dinonaktifkan oleh Owner.", "error");
          return;
        }
        const ownerForEmp = getOwnerForBusiness(emp.businessId);
        const sub = getSubscriptionState(ownerForEmp);
        if (sub.isPurgeable) {
          showToast("Masa aktif outlet ini telah berakhir dan melewati masa tenggang.", "error");
          return;
        }
        state.currentUser = {
          id: emp.id,
          businessId: emp.businessId,
          name: emp.name,
          email: emp.email,
          role: emp.role
        };
        state.activeBusinessId = emp.businessId;
        state.activeTab = emp.role === "KASIR" ? "pos" : "dashboard";
        saveStateToStorage();

    function setPreviewSimStep(step) {
      state.uiFilters.previewSimStep = step;
      const box = document.getElementById("landing-sim-preview-slot");
      if (box) {
        box.innerHTML = renderLandingSimPreviewInner();
        if (Number(step) === 2) renderPreviewSimBarcode();
      } else {

    function addPreviewSimService(id, name, unit, price) {
      const items = state.uiFilters.previewSimItems || [];
      const idx = items.findIndex(x => x.id === id);
      if (idx !== -1) {
        items[idx].qty = Number((Number(items[idx].qty) + 1).toFixed(1));
      } else {
        items.push({ id, name, unit, qty: 1, price });
      }
      state.uiFilters.previewSimItems = items;
      setPreviewSimStep(1);
    }

    function updatePreviewSimQty(idx, val) {
      const items = state.uiFilters.previewSimItems || [];
      if (items[idx]) {
        items[idx].qty = Math.max(0.5, parseFloat(val) || 0.5);
        setPreviewSimStep(1);
      }
    }

    function removePreviewSimItem(idx) {
      const items = state.uiFilters.previewSimItems || [];
      if (items.length <= 1) return;
      items.splice(idx, 1);
      state.uiFilters.previewSimItems = items;
      setPreviewSimStep(1);
    }

    function setPreviewSimStatus(idx) {
      state.uiFilters.previewSimStatusIdx = idx;
      setPreviewSimStep(2);
    }

      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const diff = e.changedTouches[0].clientX - testimonialTouchStartX;
      if (Math.abs(diff) > 40) {
        changeTestimonialSlide(diff < 0 ? 1 : -1);

      const current = Number(state.uiFilters.testimonialSlideIndex) || 0;

        renderApp();
      }

    // --- PERSISTENT SHELL & NAVIGATION ---
    function switchTab(tabId) {
      if (state.activeTab === "scanner" && tabId !== "scanner") {
        stopBarcodeScanner();
      }
      state.activeTab = tabId;
      state.mobileSidebarOpen = false;
      saveStateToStorage();
      renderApp();
    }

    function toggleMobileSidebar(forceState) {
      state.mobileSidebarOpen = typeof forceState === "boolean" ? forceState : !state.mobileSidebarOpen;
      updateMobileDrawerOnly();
    }

    function updateMobileDrawerOnly() {
      const slot = document.getElementById("mobile-sidebar-slot");
      if (!slot) return;
      const backdrop = slot.querySelector("[data-drawer-backdrop]");
      const panel = slot.querySelector("[data-drawer-panel]");
      if (backdrop && panel) {
        if (state.mobileSidebarOpen) {
          slot.classList.remove("pointer-events-none");
          backdrop.classList.remove("opacity-0", "pointer-events-none");
          backdrop.classList.add("opacity-100");
          panel.classList.remove("-translate-x-full");
          panel.classList.add("translate-x-0");
        } else {
          slot.classList.add("pointer-events-none");
          backdrop.classList.add("opacity-0", "pointer-events-none");
          backdrop.classList.remove("opacity-100");
          panel.classList.add("-translate-x-full");
          panel.classList.remove("translate-x-0");
        }
      }
    }

      state.activeBusinessId = bizId;

    function saveOwnerAccount(e, ownerId) {
      e.preventDefault();
      const name = document.getElementById("own-name").value.trim();
      const phone = document.getElementById("own-phone").value.trim();
      const email = document.getElementById("own-email").value.trim().toLowerCase();
      const password = document.getElementById("own-pass").value;
      const planId = document.getElementById("own-plan").value;
      const expiresAt = document.getElementById("own-expires").value;
      const planObj = state.platformBranding.plans[planId] || { id: planId, maxBranches: 3 };

      if (ownerId) {
        const idx = state.owners.findIndex(o => o.id === ownerId);
        if (idx !== -1) {
          state.owners[idx] = {
            ...state.owners[idx],
            name,
            phone,
            email,
            password,
            plan: planId,
            maxBranches: planObj.maxBranches,
            expiresAt
          };
          syncRecordToCloud("owners", state.owners[idx]);

          state.businesses.forEach((b, bIdx) => {
            if (b.ownerId === ownerId || b.id === state.owners[idx].businessId) {
              state.businesses[bIdx] = { ...b, plan: planId };
              syncRecordToCloud("businesses", state.businesses[bIdx]);
            }
          });
        }
        showToast("Paket & data Owner berhasil diperbarui.", "success");
      } else {
        const newOwnerId = "own_" + Date.now();
        const newBizId = "biz_" + Date.now();
        const bizName = document.getElementById("own-biz-name").value.trim();

        const newBiz = {
          id: newBizId,
          ownerId: newOwnerId,
          name: bizName,
          plan: planId,
          status: "ACTIVE",
          phone,
          address: "",
          logoUrl: "",
          qrisUrl: "",
          bankName: "",
          bankAccount: "",
          bankHolder: bizName,
          receiptFooter: "Terima kasih atas kepercayaan Anda!",
          invoicePrefix: "INV"
        };
        const newOwner = {
          id: newOwnerId,
          businessId: newBizId,
          name,
          email,
          password,
          phone,
          role: "OWNER",
          plan: planId,
          maxBranches: planObj.maxBranches,
          status: "ACTIVE",
          expiresAt
        };
        state.businesses.push(newBiz);
        state.owners.push(newOwner);
        syncRecordToCloud("businesses", newBiz);
        syncRecordToCloud("owners", newOwner);
        showToast("Owner & Outlet baru berhasil didaftarkan.", "success");
      }

      closeModal();
      renderApp();
    }

              <button type="button" onclick="submitPosOrder()" class="w-full brand-btn py-3 rounded-xl text-sm font-bold">
                Simpan Order & Cetak Nota
              </button>
            </div>
          </div>
        </div>
      `;

    function selectPosCustomer(custId) {
      state.openDropdownId = null;
      if (!custId) {
        state.posDraft.customerId = "";
        state.posDraft.customerName = "";
        state.posDraft.customerPhone = "";
        state.posDraft.customerAddress = "";
        state.posDraft.customerMapsUrl = "";
        renderApp();
        return;
      }
      const c = state.customers.find(x => String(x.id) === String(custId));
      if (c) {
        state.posDraft.customerId = c.id;
        state.posDraft.customerName = c.name || "";
        state.posDraft.customerPhone = c.phone || "";
        state.posDraft.customerAddress = c.address || "";
        state.posDraft.customerMapsUrl = c.mapsUrl || "";
      }
      renderApp();
    }

    function addServiceToPosCart(serviceId) {
      const srv = state.services.find(s => String(s.id) === String(serviceId));
      if (!srv) return;
      const existingIdx = state.posDraft.items.findIndex(it => String(it.serviceId) === String(serviceId));
      if (existingIdx !== -1) {
        const currentQty = Number(state.posDraft.items[existingIdx].qty) || 0;
        const stepAdd = String(srv.unit || "kg").toLowerCase() === "kg" ? 0.5 : 1;
        state.posDraft.items[existingIdx].qty = Number((currentQty + stepAdd).toFixed(2));
      } else {
        state.posDraft.items.push({
          serviceId: srv.id,
          serviceName: srv.name,
          unit: srv.unit || "kg",
          qty: String(srv.unit || "kg").toLowerCase() === "kg" ? 1 : 1,
          price: Number(srv.price) || 0,
          estHours: Number(srv.estHours) || 24
        });
      }
      renderApp();
    }

    function updatePosCartQty(idx, rawVal) {
      const val = Math.max(0.1, parseFloat(rawVal) || 0);
      if (state.posDraft.items[idx]) {
        state.posDraft.items[idx].qty = val;
        updatePosTotalsOnly();
      }
    }

    function removePosCartItem(idx) {
      state.posDraft.items.splice(idx, 1);
      renderApp();
    }

    function updatePosTotalsOnly() {
      const draft = state.posDraft;
      const subtotal = draft.items.reduce((sum, it) => sum + Math.round((Number(it.qty) || 0) * (Number(it.price) || 0)), 0);
      const discount = Math.max(0, Number(draft.discountAmount) || 0);
      const delivery = Math.max(0, Number(draft.deliveryFee) || 0);
      const grandTotal = Math.max(0, subtotal - discount + delivery);
      const box = document.getElementById("pos-summary-box");
      if (box) {
        box.innerHTML = `
          <div class="flex justify-between text-slate-500"><span>Subtotal Layanan</span><span>${formatRp(subtotal)}</span></div>
          <div class="flex justify-between brand-text"><span>Diskon Promo</span><span>-${formatRp(discount)}</span></div>
          <div class="flex justify-between text-slate-500"><span>Biaya Antar-Jemput</span><span>+${formatRp(delivery)}</span></div>
          <div class="flex justify-between text-base font-extrabold brand-text border-t border-slate-200 pt-2 mt-1">
            <span>Total Biaya</span>
            <span>${formatRp(grandTotal)}</span>
          </div>
        `;
      }
    }

    function submitPosOrder() {
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const draft = state.posDraft;

      if (!draft.customerName.trim() || !draft.customerPhone.trim()) {
        showToast("Nama dan Nomor WhatsApp pelanggan wajib diisi.", "error");
        return;
      }
      if (draft.items.length === 0) {
        showToast("Pilih minimal 1 layanan laundry.", "error");
        return;
      }

      const loc = parseLocationInput(draft.customerMapsUrl, draft.customerAddress);
      let custId = draft.customerId;
      if (!custId) {
        custId = "cust_" + Date.now();
        const newCust = {
          id: custId,
          businessId: biz.id,
          name: draft.customerName.trim(),
          phone: sanitizeWaPhone(draft.customerPhone),
          address: draft.customerAddress.trim(),
          lat: loc.lat,
          lng: loc.lng,
          mapsUrl: loc.mapsUrl
        };
        state.customers.unshift(newCust);
        syncRecordToCloud("customers", newCust);
      }

      const items = draft.items.map(it => ({
        serviceId: it.serviceId,
        serviceName: it.serviceName,
        unit: it.unit,
        qty: Number(it.qty),
        price: Number(it.price),
        subtotal: Math.round(Number(it.qty) * Number(it.price))
      }));

      const subtotalAmount = items.reduce((s, i) => s + i.subtotal, 0);
      const discountAmount = Math.max(0, Number(draft.discountAmount) || 0);
      const deliveryFee = Math.max(0, Number(draft.deliveryFee) || 0);
      const totalAmount = Math.max(0, subtotalAmount - discountAmount + deliveryFee);

      let paidAmount = 0;
      if (draft.paymentType === "FULL") paidAmount = totalAmount;
      else if (draft.paymentType === "DP") paidAmount = Math.min(totalAmount, Math.max(0, Number(draft.dpAmount) || 0));

      const maxEstHours = Math.max(...draft.items.map(i => Number(i.estHours) || 24));
      const dueDateObj = new Date(Date.now() + maxEstHours * 3600000);
      const prefix = biz.invoicePrefix || "INV";
      const dStr = new Date().toISOString().slice(2, 10).replace(/-/g, "");
      const invoiceNo = `${prefix}-${dStr}-${Math.floor(100 + Math.random() * 900)}`;
      const orderId = "ord_" + Date.now();

      const newOrder = {
        id: orderId,
        businessId: biz.id,
        invoiceNo,
        customerId: custId,
        customerName: draft.customerName.trim(),
        customerPhone: sanitizeWaPhone(draft.customerPhone),
        customerAddress: draft.customerAddress.trim(),
        customerLat: loc.lat,
        customerLng: loc.lng,
        customerMapsUrl: loc.mapsUrl,
        items,
        subtotalAmount,
        discountAmount,
        deliveryFee,
        totalAmount,
        paidAmount,
        paymentStatus: paidAmount >= totalAmount ? "PAID" : (paidAmount > 0 ? "PARTIAL" : "UNPAID"),
        paymentMethod: draft.paymentMethod,
        status: "RECEIVED",
        notes: draft.notes.trim(),
        createdAt: new Date().toISOString(),
        dueDate: dueDateObj.toISOString().slice(0, 10),
        auditLog: [
          {
            time: new Date().toISOString(),
            actor: `${state.currentUser.name} (${state.currentUser.role})`,
            action: `Order dibuat (${paidAmount >= totalAmount ? "Lunas" : "Tagihan " + formatRp(totalAmount)})`
          }
        ]
      };

      state.orders.unshift(newOrder);
      syncRecordToCloud("orders", newOrder);

      if (paidAmount > 0) {
        const payRec = {
          id: "pay_" + Date.now(),
          businessId: biz.id,
          orderId,
          invoiceNo,
          customerName: newOrder.customerName,
          amount: paidAmount,
          method: draft.paymentMethod,
          date: todayIso(),
          recordedBy: state.currentUser.name
        };
        const cashRec = {
          id: "cash_" + Date.now(),
          businessId: biz.id,
          type: "IN",
          category: "Pendapatan Order",
          description: `Pembayaran ${invoiceNo} (${newOrder.customerName})`,
          amount: paidAmount,
          date: todayIso()
        };
        state.payments.unshift(payRec);
        state.cashTransactions.unshift(cashRec);
        syncRecordToCloud("payments", payRec);
        syncRecordToCloud("cashTransactions", cashRec);
      }

      state.posDraft = {
        customerId: "",
        customerName: "",
        customerPhone: "",
        customerAddress: "",
        customerMapsUrl: "",
        items: [],
        discountAmount: 0,
        deliveryFee: 0,
        paymentMethod: "CASH",
        paymentType: "FULL",
        dpAmount: 0,
        notes: ""
      };

      showToast(`Order ${invoiceNo} berhasil disimpan!`, "success");
      renderApp();
      openReceiptModal(orderId);
    }

    function updateOrderStatus(orderId, newStatus) {
      state.openDropdownId = null;
      if (!assertBusinessOperational()) return;
      const idx = state.orders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const label = ORDER_STATUS_META[newStatus]?.label || newStatus;
      state.orders[idx].status = newStatus;
      state.orders[idx].auditLog = state.orders[idx].auditLog || [];
      state.orders[idx].auditLog.push({
        time: new Date().toISOString(),
        actor: `${state.currentUser.name} (${state.currentUser.role})`,
        action: `Status diubah menjadi ${label}`
      });
      syncRecordToCloud("orders", state.orders[idx]);
      showToast(`Status ${state.orders[idx].invoiceNo} → ${label}`, "success");
      renderApp();
    }

    function settleOrderBalance(orderId) {
      if (!assertBusinessOperational()) return;
      const idx = state.orders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const ord = state.orders[idx];
      const balance = Math.max(0, ord.totalAmount - ord.paidAmount);
      if (balance <= 0) return;

      ord.paidAmount = ord.totalAmount;
      ord.paymentStatus = "PAID";
      ord.auditLog = ord.auditLog || [];
      ord.auditLog.push({
        time: new Date().toISOString(),
        actor: `${state.currentUser.name} (${state.currentUser.role})`,
        action: `Pelunasan sisa tagihan ${formatRp(balance)}`
      });

      const payRec = {
        id: "pay_" + Date.now(),
        businessId: ord.businessId,
        orderId: ord.id,
        invoiceNo: ord.invoiceNo,
        customerName: ord.customerName,
        amount: balance,
        method: ord.paymentMethod || "CASH",
        date: todayIso(),
        recordedBy: state.currentUser.name
      };
      const cashRec = {
        id: "cash_" + Date.now(),
        businessId: ord.businessId,
        type: "IN",
        category: "Pelunasan Order",
        description: `Pelunasan ${ord.invoiceNo} (${ord.customerName})`,
        amount: balance,
        date: todayIso()
      };

      state.payments.unshift(payRec);
      state.cashTransactions.unshift(cashRec);
      syncRecordToCloud("orders", ord);
      syncRecordToCloud("payments", payRec);
      syncRecordToCloud("cashTransactions", cashRec);

      showToast(`Tagihan ${ord.invoiceNo} telah LUNAS!`, "success");
      closeModal();
      renderApp();
    }

    async function startBarcodeScanner() {
      if (scannerRunning || !window.Html5Qrcode) return;
      try {
        html5QrScanner = new Html5Qrcode("qr-reader-box");
        scannerRunning = true;
        await html5QrScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 110 } },
          (decodedText) => {
            stopBarcodeScanner();
            processScannedCode(decodedText);
          },
          () => {}
        );
      } catch (err) {
        scannerRunning = false;
        showToast("Tidak dapat mengakses kamera. Pastikan izin kamera aktif & gunakan input invoice manual.", "warning");
      }
    }

    function stopBarcodeScanner() {
      if (html5QrScanner && scannerRunning) {
        html5QrScanner.stop().catch(() => {}).finally(() => {
          scannerRunning = false;
          try { html5QrScanner.clear(); } catch (e) {}
        });
      }
      scannerRunning = false;
    }

    function handleManualBarcodeSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById("manual-barcode-input");
      if (!inp || !inp.value.trim()) return;
      processScannedCode(inp.value.trim());
    }

    function processScannedCode(code) {
      const clean = String(code || "").trim().toLowerCase();
      const biz = getActiveBusiness();
      const found = state.orders.find(o =>
        o.businessId === biz?.id &&
        (o.invoiceNo.toLowerCase() === clean || o.id.toLowerCase() === clean)
      );
      if (!found) {
        showToast(`Order dengan kode "${code}" tidak ditemukan di cabang ini.`, "error");
        return;
      }
      showToast(`Barcode terdeteksi: ${found.invoiceNo}`, "success");
      openOrderDetailModal(found.id);
    }

      const biz = getActiveBusiness();

    function saveInventoryItem(e) {
      e.preventDefault();
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const item = {
        id: "inv_" + Date.now(),
        businessId: biz.id,
        name: document.getElementById("inv-name").value.trim(),
        unit: document.getElementById("inv-unit").value.trim(),
        stock: Math.max(0, Number(document.getElementById("inv-stock").value) || 0),
        minStock: Math.max(0, Number(document.getElementById("inv-min").value) || 0)
      };
      state.inventory.push(item);
      syncRecordToCloud("inventory", item);
      showToast("Item stok berhasil ditambahkan.", "success");
      closeModal();
      renderApp();
    }

    function adjustInventoryStock(itemId, delta) {
      if (!assertBusinessOperational()) return;
      const idx = state.inventory.findIndex(i => i.id === itemId);
      if (idx === -1) return;
      state.inventory[idx].stock = Math.max(0, (Number(state.inventory[idx].stock) || 0) + delta);
      syncRecordToCloud("inventory", state.inventory[idx]);
      renderApp();
    }

    function deleteInventoryItem(itemId) {
      if (!assertBusinessOperational()) return;
      state.inventory = state.inventory.filter(i => i.id !== itemId);
      deleteRecordFromCloud("inventory", itemId);
      showToast("Item stok bahan baku telah dihapus.", "info");
      renderApp();
    }

    // 10. FINANCIAL REPORTS
    function setReportPeriodPreset(preset) {
      state.uiFilters.reportPreset = preset;
      if (preset === "MONTH") {
        state.uiFilters.reportStartDate = firstDayOfMonthIso();
        state.uiFilters.reportEndDate = todayIso();
      } else if (preset === "YEAR") {
        state.uiFilters.reportStartDate = firstDayOfYearIso();
        state.uiFilters.reportEndDate = todayIso();
      } else if (preset === "ALL") {
        state.uiFilters.reportStartDate = "2000-01-01";
        state.uiFilters.reportEndDate = "2099-12-31";
      }
      renderApp();
    }

    function getFilteredFinancialData(bId) {
      const start = state.uiFilters.reportStartDate || "2000-01-01";
      const end = state.uiFilters.reportEndDate || "2099-12-31";

      const txns = state.cashTransactions.filter(c => c.businessId === bId && c.date >= start && c.date <= end);
      const totalIn = txns.filter(t => t.type === "IN").reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const totalOut = txns.filter(t => t.type === "OUT").reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const netProfit = totalIn - totalOut;

      const filteredOrders = state.orders.filter(o => {
        if (o.businessId !== bId) return false;
        const d = String(o.createdAt || "").slice(0, 10);
        return d >= start && d <= end;
      });

      const serviceUsageMap = {};
      filteredOrders.forEach(o => {
        (o.items || []).forEach(it => {
          const key = it.serviceName || "Layanan";
          if (!serviceUsageMap[key]) {
            serviceUsageMap[key] = { name: key, count: 0, revenue: 0 };
          }
          serviceUsageMap[key].count += 1;
          serviceUsageMap[key].revenue += Number(it.subtotal) || 0;
        });
      });
      const serviceStats = Object.values(serviceUsageMap).sort((a, b) => b.revenue - a.revenue);

      return { start, end, txns, totalIn, totalOut, netProfit, serviceStats };
    }

    function renderReportsView() {

      const maxBar = Math.max(totalIn, totalOut, Math.abs(netProfit), 1);
      const inPct = Math.max(6, Math.round((totalIn / maxBar) * 100));
      const outPct = Math.max(6, Math.round((totalOut / maxBar) * 100));
      const profitPct = Math.max(6, Math.round((Math.max(0, netProfit) / maxBar) * 100));

      const donutShades = [
        hexToRgba(primary, 1.0),

        const deg = totalSrvRev > 0 ? (s.revenue / totalSrvRev) * 360 : 0;
        const startDeg = cumulativeDeg;
        cumulativeDeg += deg;
        const color = donutShades[idx % donutShades.length];
        return `${color} ${startDeg.toFixed(1)}deg ${cumulativeDeg.toFixed(1)}deg`;

                <span class="text-[10px] font-bold brand-text truncate max-w-full">${formatRp(totalIn)}</span>
                <div style="height:${inPct}%" class="w-full max-w-[52px] rounded-t-xl brand-solid chart-bar-anim"></div>

    function saveExpense(e) {
      e.preventDefault();
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const title = document.getElementById("exp-title").value.trim();
      const category = document.getElementById("exp-cat").value.trim() || "Operasional";
      const date = document.getElementById("exp-date").value || todayIso();
      const amount = Math.max(1, Number(document.getElementById("exp-amount").value) || 0);

      const expObj = { id: "exp_" + Date.now(), businessId: biz.id, title, category, amount, date, notes: "" };
      const cashObj = { id: "cash_" + Date.now(), businessId: biz.id, type: "OUT", category, description: title, amount, date };

      state.expenses.unshift(expObj);
      state.cashTransactions.unshift(cashObj);
      syncRecordToCloud("expenses", expObj);
      syncRecordToCloud("cashTransactions", cashObj);

      showToast("Pengeluaran berhasil dicatat.", "success");
      closeModal();
      renderApp();
    }

    function exportFinancialReportCsv() {
      const biz = getActiveBusiness();
      const { start, end, txns, totalIn, totalOut, netProfit } = getFilteredFinancialData(biz?.id);

      const rows = [
        ["LAPORAN KEUANGAN", biz?.name || "Outlet"],
        ["Periode", `${start} s/d ${end}`],
        ["Total Pemasukan", totalIn],
        ["Total Pengeluaran", totalOut],
        ["Laba Bersih", netProfit],
        [],
        ["Tanggal", "Tipe", "Kategori", "Keterangan", "Nominal (Rp)"]
      ];

      txns.forEach(t => {
        rows.push([
          t.date,
          t.type === "IN" ? "PEMASUKAN" : "PENGELUARAN",
          `"${String(t.category || "").replace(/"/g, '""')}"`,
          `"${String(t.description || "").replace(/"/g, '""')}"`,
          t.amount
        ]);
      });

      const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + rows.map(r => r.join(",")).join("\n");
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", `Laporan_Keuangan_${(biz?.name || "Laundry").replace(/\s+/g, "_")}_${todayIso()}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast("File laporan Excel (.csv) berhasil diunduh!", "success");
    }

    function saveEmployee(e, empId) {
      e.preventDefault();
      if (!assertBusinessOperational()) return;
      const biz = getActiveBusiness();
      const name = document.getElementById("emp-name").value.trim();
      const role = document.getElementById("emp-role").value;
      const phone = document.getElementById("emp-phone").value.trim();
      const email = document.getElementById("emp-email").value.trim().toLowerCase();
      const password = document.getElementById("emp-pass").value;

      if (empId) {
        const idx = state.employees.findIndex(x => x.id === empId);
        if (idx !== -1) {
          state.employees[idx] = { ...state.employees[idx], name, role, phone, email, password };
          syncRecordToCloud("employees", state.employees[idx]);
        }
        showToast("Data karyawan diperbarui.", "success");
      } else {
        const newEmp = { id: "emp_" + Date.now(), businessId: biz.id, name, role, phone, email, password, active: true };
        state.employees.push(newEmp);
        syncRecordToCloud("employees", newEmp);
        showToast("Karyawan baru ditambahkan.", "success");
      }
      closeModal();
      renderApp();
    }

    function toggleEmployeeActive(empId) {
      if (!assertBusinessOperational()) return;
      const idx = state.employees.findIndex(e => e.id === empId);
      if (idx === -1) return;
      state.employees[idx].active = state.employees[idx].active === false ? true : false;
      syncRecordToCloud("employees", state.employees[idx]);
      showToast(`Akun ${state.employees[idx].name} ${state.employees[idx].active ? "diaktifkan" : "dinonaktifkan"}.`, "info");
      renderApp();
    }

    function deleteEmployee(empId) {
      if (!assertBusinessOperational()) return;
      state.employees = state.employees.filter(e => e.id !== empId);
      deleteRecordFromCloud("employees", empId);
      showToast("Akun karyawan dihapus.", "info");
      renderApp();
    }

    function saveSingleLegalDocument(fieldKey) {
      const editorEl = document.getElementById("pb-legal-editor");
      const dateEl = document.getElementById("pb-legal-date");
      if (!editorEl) return;
      state.platformBranding[fieldKey] = editorEl.value;
      if (dateEl && dateEl.value.trim()) {
        state.platformBranding.legalUpdatedAt = dateEl.value.trim();
      }
      syncPlatformBrandingToCloud();
      showToast("Dokumen legal & kebijakan berhasil disimpan!", "success");
    }

    function resetSingleLegalDocToDefault(fieldKey, defaultKey) {
      state.platformBranding[fieldKey] = DEFAULT_PLATFORM_BRANDING[defaultKey] || "";
      syncPlatformBrandingToCloud();
      showToast("Teks dokumen dikembalikan ke template bawaan.", "info");
      renderApp();
    }

    function savePlatformGeneralSettings(e) {
      e.preventDefault();
      const pb = state.platformBranding;
      pb.appName = document.getElementById("pb-appname").value.trim() || "SSmart Laundry";
      pb.tagline = document.getElementById("pb-tagline").value.trim();
      pb.supportWa = document.getElementById("pb-wa").value.trim();
      pb.footerText = document.getElementById("pb-footer").value.trim();
      pb.primaryColor = document.getElementById("pb-color").value;
      pb.bgCanvas = document.getElementById("pb-bg-canvas").value;
      pb.bgSurface = document.getElementById("pb-bg-surface").value;
      pb.textPrimary = document.getElementById("pb-text-primary").value;
      pb.logoUrl = document.getElementById("pb-logo").value.trim();
      pb.faviconUrl = document.getElementById("pb-favicon").value.trim();

      Object.keys(pb.plans).forEach(pid => {
        const priceEl = document.getElementById(`plan-price-${pid}`);
        const branchEl = document.getElementById(`plan-branch-${pid}`);
        const descEl = document.getElementById(`plan-desc-${pid}`);
        if (priceEl) pb.plans[pid].price = Math.max(0, Number(priceEl.value) || 0);
        if (branchEl) pb.plans[pid].maxBranches = Math.max(1, Number(branchEl.value) || 1);
        if (descEl) pb.plans[pid].desc = descEl.value.trim();
      });

      pb.superAdminAuth.email = document.getElementById("sa-email").value.trim();
      pb.superAdminAuth.password = document.getElementById("sa-pass").value;

      if (state.currentUser && state.currentUser.role === "SUPER_ADMIN") {
        state.currentUser.email = pb.superAdminAuth.email;
      }

      applyThemeVariables();
      syncPlatformBrandingToCloud();
      showToast("Pengaturan umum platform berhasil diperbarui!", "success");
      renderApp({ forceShellRebuild: true });
    }

      const pb = state.platformBranding;
      pb.landingBadge = document.getElementById("lp-badge").value.trim();
      pb.landingHeroTitle = document.getElementById("lp-hero-title").value.trim();
      pb.landingHeroSubtitle = document.getElementById("lp-hero-sub").value.trim();
      pb.landingSecondaryCtaText = document.getElementById("lp-btn-login").value.trim();
      pb.landingPrimaryCtaText = document.getElementById("lp-btn-cta").value.trim();
      pb.landingHeroImageUrl = document.getElementById("lp-hero-img").value.trim();
      pb.landingCtaBannerTitle = document.getElementById("lp-cta-title").value.trim();
      pb.landingCtaBannerSubtitle = document.getElementById("lp-cta-sub").value.trim();

      pb.landingStats = [0, 1, 2].map(idx => ({
        value: document.getElementById(`lp-stat-val-${idx}`)?.value.trim() || "",
        label: document.getElementById(`lp-stat-lbl-${idx}`)?.value.trim() || ""

      const oldFeatures = Array.isArray(pb.landingFeatures) ? pb.landingFeatures : [];
      pb.landingFeatures = oldFeatures.map((oldF, idx) => ({
        title: document.getElementById(`lp-feat-title-${idx}`)?.value.trim() || "",
        desc: document.getElementById(`lp-feat-desc-${idx}`)?.value.trim() || "",

      })).filter(f => f.title);

      const oldSteps = Array.isArray(pb.landingSteps) ? pb.landingSteps : [];
      pb.landingSteps = oldSteps.map((oldSt, idx) => ({
        step: oldSt.step || `0${idx + 1}`,

      })).filter(fq => fq.q && fq.a);

      syncPlatformBrandingToCloud();
      showToast("Seluruh pengaturan Landing Page & Testimoni berhasil disimpan!", "success");
      renderApp();
    }

    async function handleFileToInput(event, targetInputId) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const compressedDataUrl = await compressImageFile(file, 640, 0.75);
        const inp = document.getElementById(targetInputId);
        if (inp) inp.value = compressedDataUrl;
        showToast("Gambar berhasil dikompres & siap disimpan.", "success");
      } catch (err) {
        const reader = new FileReader();
        reader.onload = () => {
          const inp = document.getElementById(targetInputId);
          if (inp) inp.value = reader.result;
          showToast("Gambar berhasil dimuat.", "info");
        };
        reader.readAsDataURL(file);
      }
    }

    function handleVideoFileToInput(event, targetInputId) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) {
        showToast("Ukuran file video terlalu besar (maks. 8 MB). Gunakan tautan YouTube/MP4 jika video panjang.", "warning");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const inp = document.getElementById(targetInputId);
        if (inp) inp.value = reader.result;
        showToast("Video berhasil dimuat. Klik 'Simpan Perubahan Landing Page' untuk menyimpan.", "success");
      };
      reader.readAsDataURL(file);
    }

    // --- BACKUP & RESTORE FUNCTIONS ---
    function downloadJsonFile(dataObj, filename) {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function downloadOwnerBackup(ownerId) {
      const owner = state.owners.find(o => o.id === ownerId);
      const bizIds = state.businesses
        .filter(b => b.ownerId === ownerId || (owner && b.id === owner.businessId))
        .map(b => b.id);

      const backup = {
        backupScope: "OWNER_TENANT",
        exportedAt: new Date().toISOString(),
        ownerId,
        owner,
        businesses: state.businesses.filter(b => bizIds.includes(b.id)),
        employees: state.employees.filter(e => bizIds.includes(e.businessId)),
        services: state.services.filter(s => bizIds.includes(s.businessId)),
        customers: state.customers.filter(c => bizIds.includes(c.businessId)),
        orders: state.orders.filter(o => bizIds.includes(o.businessId)),
        payments: state.payments.filter(p => bizIds.includes(p.businessId)),
        expenses: state.expenses.filter(ex => bizIds.includes(ex.businessId)),
        cashTransactions: state.cashTransactions.filter(ct => bizIds.includes(ct.businessId)),
        inventory: state.inventory.filter(iv => bizIds.includes(iv.businessId))
      };

      const safeName = (owner?.name || "Owner").replace(/\s+/g, "_");
      downloadJsonFile(backup, `Backup_SSmart_${safeName}_${todayIso()}.json`);
      showToast("File backup Owner (.json) berhasil diunduh!", "success");
    }

    function restoreOwnerBackupFromFile(event, ownerId) {
      if (!assertBusinessOperational()) return;
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.backupScope !== "OWNER_TENANT" || !Array.isArray(data.businesses)) {
            showToast("Format file backup Owner tidak valid.", "error");
            return;
          }
          const bizIds = data.businesses.map(b => b.id);
          state.businesses = [...state.businesses.filter(b => !bizIds.includes(b.id)), ...data.businesses];
          data.businesses.forEach(b => syncRecordToCloud("businesses", b));

          ["employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
            if (Array.isArray(data[col])) {
              state[col] = [...state[col].filter(item => !bizIds.includes(item.businessId)), ...data[col]];
              data[col].forEach(item => syncRecordToCloud(col, item));
            }
          });
          showToast("Restore data usaha Owner berhasil!", "success");
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file backup JSON.", "error");
        }
      };
      reader.readAsText(file);
    }

    function downloadFullPlatformBackup() {
      const backup = {
        backupScope: "FULL_PLATFORM",
        exportedAt: new Date().toISOString(),
        platformBranding: state.platformBranding,
        owners: state.owners,
        businesses: state.businesses,
        employees: state.employees,
        services: state.services,
        customers: state.customers,
        orders: state.orders,
        payments: state.payments,
        expenses: state.expenses,
        cashTransactions: state.cashTransactions,
        inventory: state.inventory
      };
      downloadJsonFile(backup, `Backup_Full_Platform_${todayIso()}.json`);
      showToast("Backup seluruh database platform berhasil diunduh!", "success");
    }

    function restoreFullPlatformBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.backupScope !== "FULL_PLATFORM") {
            showToast("File bukan backup full platform.", "error");
            return;
          }
          if (data.platformBranding) {
            state.platformBranding = { ...DEFAULT_PLATFORM_BRANDING, ...data.platformBranding };
            applyThemeVariables();
            syncPlatformBrandingToCloud();
          }
          ["owners", "businesses", "employees", "services", "customers", "orders", "payments", "expenses", "cashTransactions", "inventory"].forEach(col => {
            if (Array.isArray(data[col])) {
              state[col] = data[col];
              data[col].forEach(rec => syncRecordToCloud(col, rec));
            }
          });
          showToast("Restore seluruh database platform berhasil!", "success");
          renderApp({ forceShellRebuild: true });
        } catch (err) {
          showToast("Gagal memulihkan file JSON.", "error");
        }
      };
      reader.readAsText(file);
    }

    // --- MODAL SYSTEM ---
    function openModal(innerHtml) {
      const root = document.getElementById("modal-root");
      if (!root) return;
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] bg-slate-900/45 backdrop-blur-xs flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
          <div class="bg-white border border-slate-200 w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden animate-page">
            ${innerHtml}
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const root = document.getElementById("modal-root");
      if (root) root.innerHTML = "";
    }

    function setHiddenFieldAndRender(inputId, val) {
      const el = document.getElementById(inputId);
      if (el) el.value = val;
      const modalRoot = document.getElementById("modal-root");
      if (modalRoot && modalRoot.innerHTML.trim().length > 0) {
        const ddWrapper = el?.parentElement?.querySelector("[data-custom-dropdown]");
        if (ddWrapper) {
          const labelSpan = ddWrapper.querySelector("button span");
          if (labelSpan) labelSpan.textContent = val;
        }
      }
    }

    // --- RENDER ORCHESTRATOR ---
    function renderApp(options = {}) {
      applyThemeVariables();
      const appEl = document.getElementById("app");
      if (!appEl) return;

      if (state.publicOrderId) {
        lastShellSignature = "PUBLIC_TRACK";
        appEl.innerHTML = renderPublicClientPortalView();
        if (window.lucide) lucide.createIcons();
        return;
      }

      if (!state.currentUser) {
        lastShellSignature = "LANDING_PAGE";
        appEl.innerHTML = renderLandingPageView();
        if (Number(state.uiFilters.previewSimStep) === 2) renderPreviewSimBarcode();
        if (window.lucide) lucide.createIcons();
        openCacheConsentPopup();
        return;
      }

      const role = state.currentUser.role;
      const pb = state.platformBranding;
      const biz = getActiveBusiness();
      const activeTitleName = role === "SUPER_ADMIN" ? pb.appName : (biz?.name || pb.appName);

      const shellSig = [
        role,
        state.currentUser.id,
        state.activeBusinessId,
        state.activeTab,
        state.openDropdownId || "",
        cloudConnected ? "1" : "0",
        deferredInstallPrompt ? "1" : "0",
        pb.appName,
        pb.logoUrl
      ].join("|");

      const existingMain = document.getElementById("app-main-content");
      const needFullShell = options.forceShellRebuild || !existingMain || lastShellSignature !== shellSig;

      if (needFullShell) {
        lastShellSignature = shellSig;
        const sidebarHtml = buildSidebarInnerHtml(role, pb, biz, activeTitleName);

        appEl.innerHTML = `
          <div class="min-h-screen flex flex-col lg:flex-row">
            <aside id="desktop-sidebar-slot" class="hidden lg:flex lg:w-64 lg:flex-col lg:fixed lg:inset-y-0 border-r border-slate-200/80 bg-white z-30">
              ${sidebarHtml}
            </aside>

            <div id="mobile-sidebar-slot" class="fixed inset-0 z-50 lg:hidden ${state.mobileSidebarOpen ? "" : "pointer-events-none"}">
              <div data-drawer-backdrop onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity duration-200 ${state.mobileSidebarOpen ? "opacity-100" : "opacity-0 pointer-events-none"}"></div>
              <aside data-drawer-panel class="fixed inset-y-0 left-0 w-72 max-w-[82vw] bg-white border-r border-slate-200 flex flex-col shadow-2xl transform transition-transform duration-200 ${state.mobileSidebarOpen ? "translate-x-0" : "-translate-x-full"}">
                ${sidebarHtml}
              </aside>
            </div>

            <div class="flex-1 lg:pl-64 flex flex-col min-w-0">
              <header class="sticky-app-header lg:hidden border-b border-slate-200/80 px-4 py-3 flex items-center justify-between gap-3 shadow-2xs">
                <button type="button" onclick="toggleMobileSidebar(true)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800">
                  <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="text-center min-w-0 flex-1">
                  <p class="font-bold text-sm text-slate-900 truncate">${esc(activeTitleName)}</p>
                  <p class="text-[10px] brand-text font-semibold">${esc(role)}</p>
                </div>
                <button type="button" onclick="handleLogout()" class="p-2 rounded-xl bg-slate-100 brand-text">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </header>

              <main id="app-main-content" class="flex-1 p-4 sm:p-6 max-w-6xl w-full mx-auto">
                ${renderMainContent()}
              </main>

              <footer class="border-t border-slate-200/80 py-3.5 px-4 sm:px-6 text-[11px] text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2 bg-white">
                <p class="text-center sm:text-left">${esc(pb.footerText)}</p>
                <div class="flex flex-wrap items-center justify-center gap-2.5 font-semibold">
                  <button type="button" onclick="openLegalHubModal('disclaimer')" class="brand-text hover:underline">Disclaimer</button>
                  <span>•</span>
                  <button type="button" onclick="openLegalHubModal('privacy')" class="brand-text hover:underline">Privasi</button>
                  <span>•</span>
                  <button type="button" onclick="openLegalHubModal('guide')" class="brand-text hover:underline">Panduan</button>
                  <span>•</span>
                  <button type="button" onclick="openLegalHubModal('contact')" class="brand-text hover:underline">Bantuan</button>
                </div>
              </footer>
            </div>
          </div>
        `;
      } else if (!options.sidebarOnly) {
        existingMain.innerHTML = renderMainContent();
      } else {
        const sidebarHtml = buildSidebarInnerHtml(role, pb, biz, activeTitleName);
        const desktopSlot = document.getElementById("desktop-sidebar-slot");
        const mobilePanel = document.querySelector("#mobile-sidebar-slot [data-drawer-panel]");
        if (desktopSlot) desktopSlot.innerHTML = sidebarHtml;
        if (mobilePanel) mobilePanel.innerHTML = sidebarHtml;
      }

      lastRenderedTab = state.activeTab;
      lastRenderedSubRoute = `${state.uiFilters.reportPreset}|${state.uiFilters.orderStatus}`;
      if (window.lucide) lucide.createIcons();
    }

    // --- BOOTSTRAP ---
    loadStateFromStorage();
    autoPurgeExpiredOwners(false);

    window.addEventListener("hashchange", () => {
      applyRouteFromUrl();
      renderApp({ forceShellRebuild: true });
    });
    renderApp({ forceShellRebuild: true });
    initFirebase();
  </script>
